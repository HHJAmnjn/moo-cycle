    function App() {
      // 密码门禁鉴权状态
      const [isAuthed, setIsAuthed] = useState(() => {
        try { return localStorage.getItem(AUTH_STORAGE_KEY) === ACCESS_PIN; } catch (e) { return false; }
      });
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState(false);

      const [ticker, setTicker] = useState("SOXL");
      const [prices, setPrices] = useState({
        SOXL: 46.22, SOXS: 25.80, TQQQ: 81.60, SQQQ: 18.40, QQQ: 656.50, SPY: 737.80, SOXX: 136.38
      });
      const [prevCloses, setPrevCloses] = useState({
        SOXL: 40.87, SOXS: 28.50, TQQQ: 78.50, SQQQ: 19.20, QQQ: 647.05, SPY: 733.00, SOXX: 127.50
      });
      const [isLive, setIsLive] = useState(true);
      const [liveStatus, setLiveStatus] = useState("正在连接实时行情源...");
      const [viewMode, setViewMode] = useState("both");
      const [intraScenario, setIntraScenario] = useState("A");
      const [cleanShot, setCleanShot] = useState(false);
      const [copied, setCopied] = useState(false);
      const [nowClock, setNowClock] = useState(new Date());

      useEffect(() => {
        const t = setInterval(() => setNowClock(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      // 双模实时行情引擎：优先探测本地 OpenD -> 若 Mac 关机或处于云端则自动调用公网免费美股 API
      useEffect(() => {
        if (!isAuthed) return;
        if (!isLive) {
          setLiveStatus("手动沙盘推演模式");
          return;
        }

        let isMounted = true;

        const syncQuotes = async () => {
          // 1. 若在本地 localhost 运行，优先尝试读取本地 Moomoo OpenD 毫秒级快照
          if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            try {
              const localRes = await fetch("./live_price.json?t=" + Date.now(), { cache: "no-store" });
              if (localRes.ok) {
                const data = await localRes.json();
                if (data && data.prices && isMounted) {
                  setPrices(prev => ({ ...prev, ...data.prices }));
                  if (data.prev_close) setPrevCloses(prev => ({ ...prev, ...data.prev_close }));
                  setLiveStatus(`OpenD 本地实时 (${data.ts})`);
                  return;
                }
              }
            } catch (e) {}
          }

          // 2. 公网云端无服务器实时行情通道（彻底脱离 Mac 电脑，支持盘前/正盘/盘后）
          try {
            const newP = {};
            const newPrev = {};
            await Promise.all(TICKER_ORDER.map(async (sym) => {
              const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d&includePrePost=true`;
              const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
              ];
              for (const pUrl of proxies) {
                try {
                  const r = await fetch(pUrl);
                  if (!r.ok) continue;
                  const j = await r.json();
                  const meta = j?.chart?.result?.[0]?.meta;
                  const quoteIndicators = j?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
                  if (meta) {
                    let latest = meta.regularMarketPrice;
                    if (Array.isArray(quoteIndicators)) {
                      for (let k = quoteIndicators.length - 1; k >= 0; k--) {
                        if (quoteIndicators[k] !== null && quoteIndicators[k] > 0) {
                          latest = quoteIndicators[k];
                          break;
                        }
                      }
                    }
                    if (latest && latest > 0) newP[sym] = parseFloat(latest.toFixed(2));
                    if (meta.chartPreviousClose && meta.chartPreviousClose > 0) {
                      newPrev[sym] = parseFloat(meta.chartPreviousClose.toFixed(2));
                    }
                    break;
                  }
                } catch (innerErr) {}
              }
            }));

            if (Object.keys(newP).length > 0 && isMounted) {
              setPrices(prev => ({ ...prev, ...newP }));
              if (Object.keys(newPrev).length > 0) setPrevCloses(prev => ({ ...prev, ...newPrev }));
              const ts = new Date().toLocaleTimeString("zh-CN", { hour12: false });
              setLiveStatus(`云端公网实时 (${ts})`);
            }
          } catch (err) {
            if (isMounted) setLiveStatus("云端信号重连中...");
          }
        };

        syncQuotes();
        const id = setInterval(syncQuotes, 8000);
        return () => { isMounted = false; clearInterval(id); };
      }, [isLive, isAuthed]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === ACCESS_PIN) {

      const cfg = useMemo(() => {
        const raw = RAW_DB[ticker];
        const realPrev = prevCloses[ticker];
        const k = (raw.autoCalibrate && realPrev && realPrev > 0) ? (realPrev / raw.regClose) : 1.0;
        const baseClose = raw.regClose * k;
        return {
          ...raw,
          regClose: baseClose,
          minP: raw.minP * k,
          maxP: raw.maxP * k,
          theoNow: raw.theoNow * k,
          hist: raw.hist.map(d => [d[0], d[1] * k]),
          theoCurve: raw.theoCurve.map(d => [d[0], d[1] * k]),
          nodes: {
            n1106: raw.nodes.n1106 * k,
            n1118: raw.nodes.n1118 * k,
            n1126: raw.nodes.n1126 * k,
            n1210: raw.nodes.n1210 * k,
            n1231: raw.nodes.n1231 * k
          },
          presets: raw.presets.map(p => ({
            label: `${p.label}: $${(baseClose * p.ratio).toFixed(2)}`,
            val: parseFloat((baseClose * p.ratio).toFixed(2)),

      }, [ticker, prevCloses]);

      const curP = prices[ticker] || cfg.regClose;

      const updatePriceManual = (val) => {
        setIsLive(false);

      const metrics = useMemo(() => {
        const scale = curP / cfg.regClose;
        const spreadPct = ((curP - cfg.theoNow) / cfg.theoNow) * 100;
        const neckLow = curP * cfg.neckRatio[0];
        const neckHigh = curP * cfg.neckRatio[1];
        const sweepLow = curP * cfg.sweepRatio[0];
        const sweepHigh = curP * cfg.sweepRatio[1];
        const pivot = curP * cfg.pivotRatio;

        const damp = (ticker === "SOXL" || ticker === "TQQQ" || ticker === "SOXS" || ticker === "SQQQ")
          ? (0.65 + 0.35 * scale)
          : (0.80 + 0.20 * scale);
        const p1106 = cfg.nodes.n1106 * damp;
        const p1118 = cfg.nodes.n1118 * damp;
        const p1126 = cfg.nodes.n1126 * (0.85 + 0.15 * scale);
        const p1210 = cfg.nodes.n1210 * (0.90 + 0.10 * scale);
        const p1231 = cfg.nodes.n1231 * (0.90 + 0.10 * scale);

        return { spreadPct, neckLow, neckHigh, sweepLow, sweepHigh, pivot, p1106, p1118, p1126, p1210, p1231 };
      }, [ticker, curP, cfg]);

      const intradayData = useMemo(() => {
        const W = 1000, H = 350, PAD_L = 64, PAD_R = 28, PAD_T = 28, PAD_B = 34;
        const plotW = W - PAD_L - PAD_R;
        const seed = cfg.intradaySeed;

        const slots = [

          "NOW",   "18:00", "20:00", "21:30", "22:30", "23:00", "00:30", "02:30", "04:00", "05:00"
        ];
        const xOf = (idx) => PAD_L + (idx / (slots.length - 1)) * plotW;
        const nowIdx = 8;

        const vwap = curP * seed.vwapRatio;
        const demandLow = curP * seed.demandLowRatio;
        const demandHigh = curP * seed.demandHighRatio;
        const microSup = curP * seed.microSupRatio;
        const majorSupLow = curP * seed.majorSupLow;
        const majorSupHigh = curP * seed.majorSupHigh;
        const stopHuntLow = demandLow * 0.985;

        const pastPts = seed.pastRatios.map((r, i) => [i, curP * r]);
        pastPts.push([nowIdx, curP]);

        let pathA, pathB, pathC;
        if (!cfg.isInverse) {
          pathA = [
            [nowIdx, curP],
            [9,  microSup * 0.998],
            [10, curP * 0.986],
            [11, microSup * 1.004],
            [12, curP * 0.982],
            [13, (demandLow + demandHigh) * 0.5],
            [14, vwap * 1.012],
            [15, majorSupLow * 1.005],
            [16, majorSupHigh * 1.006],
            [17, majorSupLow * 0.998]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  microSup * 1.008],
            [10, microSup * 1.002],
            [11, microSup * 1.012],
            [12, curP * 0.995],
            [13, microSup * 1.005],
            [14, majorSupLow * 1.002],
            [15, majorSupHigh * 1.012],

          ];
          pathC = [

            [9,  curP * 0.995],
            [10, curP * 0.982],
            [11, curP * 0.978],
            [12, demandLow * 0.995],
            [13, stopHuntLow],
            [14, curP * 0.992],
            [15, vwap * 1.005],
            [16, microSup * 1.008],
            [17, microSup * 1.002]
          ];
        } else {

            [nowIdx, curP],
            [9,  curP * 0.992],
            [10, curP * 1.012],
            [11, curP * 0.995],
            [12, microSup * 1.005],
            [13, majorSupLow * 1.002],
            [14, vwap * 0.998],
            [15, demandHigh * 1.002],
            [16, demandLow * 0.998],
            [17, demandHigh * 1.005]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  curP * 0.985],
            [10, vwap * 0.995],
            [11, demandHigh * 1.005],
            [12, vwap * 1.002],
            [13, curP * 0.990],
            [14, demandHigh * 0.995],
            [15, demandLow * 0.990],
            [16, stopHuntLow],
            [17, demandLow * 0.995]
          ];
          pathC = [
            [nowIdx, curP],
            [9,  microSup * 1.004],
            [10, microSup * 1.012],
            [11, majorSupLow * 0.998],
            [12, majorSupLow * 1.008],
            [13, majorSupHigh * 1.012],
            [14, microSup * 1.002],
            [15, vwap * 1.005],
            [16, vwap * 0.995],
            [17, vwap * 1.000]
          ];
        }

        const allVals = [
          ...pastPts.map(d => d[1]),
          ...pathA.map(d => d[1]),
          ...pathB.map(d => d[1]),
          ...pathC.map(d => d[1]),
          cfg.regClose,
          stopHuntLow
        ];
        const minY = Math.min(...allVals) * 0.985;
        const maxY = Math.max(...allVals) * 1.015;
        const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * (H - PAD_T - PAD_B);

        return {
          W, H, PAD_L, PAD_R, PAD_T, PAD_B, slots, nowIdx, xOf, yOf, minY, maxY,
          vwap, demandLow, demandHigh, microSup, majorSupLow, majorSupHigh, stopHuntLow,
          pastPts, pathA, pathB, pathC

      const chartData = useMemo(() => {

        const allPct = allPrices.map(p => ((p / curP) - 1) * 100);

        const maxPct = Math.max(...allPct, 40);
        const y2Of = (pct) => 16 + (1 - (pct - minPct) / (maxPct - minPct)) * (H2 - 44);

        return { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futPts, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct };
      }, [cfg, curP, metrics]);

          return `距 22:30 美股开盘 ${dh}h ${dm}m ${ds}s`;

        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // 🔐 未登录时渲染暗黑加密门禁界面
      if (!isAuthed) {
        return (

              <form onSubmit={handleLogin} className="space-y-4">

              </div>
            </div>
          </div>
        );
      }

      const { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futPts, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct } = chartData;
      const nowX = xOf("11/05");
      const shortEndX = xOf("11/18");
      const activeIntraPath = intraScenario === "A" ? intradayData.pathA : (intraScenario === "B" ? intradayData.pathB : intradayData.pathC);

      return (

              <div className="flex items-center gap-2 flex-wrap">
                <button

                      : "bg-amber-50 text-amber-700 border-amber-300"

                >
                  {isLive ? `🟢 ${liveStatus}` : `🟡 ${liveStatus} (点此恢复自动)`}
                </button>
                <span className="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200">
                  ⏱️ {openCountdown}

                {cfg.isInverse && (
                  <span className="px-2.5 py-1 text-xs font-bold rounded-lg bg-purple-100 text-purple-800 border border-purple-300">
                    🔄 3x 反向做空镜像
                  </span>
                )}
                <h1 className="text-base md:text-xl font-bold text-slate-900 tracking-tight">
                  【周期模型 V3.6】{ticker} - {cfg.name}

              <div className="flex items-center gap-2 mt-2 flex-wrap">
                {[
                  { id: "both", label: "⚡ 日内+宏观双擎同屏" },
                  { id: "intraday", label: "📈 仅看日内24H推演" },

                        : (isInv ? "bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100" : "bg-slate-100 text-slate-700 hover:bg-slate-200")

              <button

                <div>

          {(viewMode === "both" || viewMode === "intraday") && (

                    <span className="px-2 py-0.5 text-xs font-bold rounded bg-indigo-600 text-white">LIVE 日内分时雷达</span>

                    <line x1={PAD_L} y1={y2Of(0)} x2={W - PAD_R} y2={y2Of(0)} stroke="#64748B" strokeDasharray="3 3" strokeWidth="1" />
                    <line x1={nowX} y1={10} x2={nowX} y2={H2 - 25} stroke="#DC2626" strokeDasharray="6 3" strokeWidth="1.8" />

                    {[0, maxPct * 0.5, maxPct].map((pctVal, idx) => {
                      const py = y2Of(pctVal);
                      return (
                        <g key={idx}>
                          <text x={PAD_L - 8} y={py + 4} textAnchor="end" fontSize="10.5" fill="#475569" className="font-mono">
                            {pctVal >= 0 ? `+${pctVal.toFixed(0)}%` : `${pctVal.toFixed(0)}%`}
                          </text>
                        </g>
                      );
                    })}

                    <polyline
                      fill="none"
                      stroke="#334155"
                      strokeWidth="1.8"
                      points={histPts.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")}
                    />
                    <polyline
                      fill="none"
                      stroke={cfg.isInverse ? "#7C3AED" : "#1D4ED8"}
                      strokeWidth="2.4"
                      strokeDasharray="6 4"
                      points={futPts.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")}
                    />

                    {allLabels.filter((_, idx) => idx % 2 === 0).map((lbl, i) => (
                      <text key={i} x={xOf(lbl)} y={H2 - 6} textAnchor="middle" fontSize="10.5" fill="#334155" className="font-mono">
                        {lbl}
                      </text>
                    ))}
                  </g>
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
