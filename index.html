    function getRealTimeSlotInfo(nowDate) {
      const bjtStr = nowDate.toLocaleTimeString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
      const estStr = nowDate.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour12: false });
      const parts = bjtStr.split(":").map(Number);
      const h = parts[0] || 0;
      const m = parts[1] || 0;
      const s = parts[2] || 0;

      let minFrom16 = 0;
      if (h >= 16) {
        minFrom16 = (h - 16) * 60 + m;
      } else if (h < 9) {
        minFrom16 = (h + 8) * 60 + m;
      } else {
        minFrom16 = 330;
      }

      let bestIdx = 7;
      for (let i = 1; i < INTRA_SLOTS.length - 1; i++) {
        if (minFrom16 >= INTRA_SLOTS[i].minFrom16) {
          bestIdx = i;
        }
      }

      const curSec = ((h >= 16 ? h - 16 : h + 8) * 3600) + m * 60 + s;
      const openSec = (22 - 16) * 3600 + 30 * 60;
      let countdownText = "🔥 美股正盘交易进行中";
      if (curSec < openSec && h >= 16) {
        const diff = openSec - curSec;
        const dh = Math.floor(diff / 3600);
        const dm = Math.floor((diff % 3600) / 60);
        const ds = diff % 60;
        countdownText = `距 22:30 美股开盘 ${dh}h ${dm}m ${ds}s`;
      } else if (h >= 5 && h < 16) {
        countdownText = "🌙 美股盘后/夜盘休整期";
      }

      return { bjtStr, estStr, nowIdx: bestIdx, countdownText };
    }

    function App() {

      const [realIntraStats, setRealIntraStats] = useState({});
      const [customBaseTheo, setCustomBaseTheo] = useState(null);

            } catch (e) {}

          try {

            await Promise.all(TICKER_ORDER.map(async (sym) => {

      // 周期系统逻辑理论乖离均值回归引擎 + 3x 磨损锁锚引擎
      const metrics = useMemo(() => {
        const spreadRatio = (curP / activeTheoNow) - 1.0;

        const isAlreadyAtTheoCeiling = !cfg.isInverse && (lockedHigh >= cfg.theoToday * 0.94);

        const sysTrack = {

        const dFactor = 1.0 - cfg.betaDecay;
        const lockedTrack = {
          pivot: curP * 0.945,
          p1116: (theoMap["11/16"] * dFactor) * 0.94,

      const intradayData = useMemo(() => {

          const futureTemplateB = [

          const futureTemplateC = [

            [9,  vwap * 0.995],

        } else if (cfg.isInverse) {

          const futureTemplateC = [

        const minY = Math.min(...allVals) * 0.985;
        const maxY = Math.max(...allVals) * 1.015;
        const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * (H - PAD_T - PAD_B);

        return {
          W, H, PAD_L, PAD_R, PAD_T, PAD_B, slots, nowIdx, openIdx, xOf, yOf, minY, maxY,

        const L = metrics.lockedTrack;
        const text = `📊 **【${ticker} 周期系统逻辑理论 V3.5 × 相位自适应日内推演战报】**\n` +
          `● **实时双时区**: 北京 ${timeInfo.bjtStr} | 美东 ${timeInfo.estStr} EST (${timeInfo.countdownText})\n` +
          `● **实盘 vs 周期系统标尺**: 现价 $${curP.toFixed(2)} (盘前极值 $${intradayData.lockedHigh.toFixed(2)}) | 今日周期系统逻辑理论位 $${activeTheoNow.toFixed(2)} (乖离 ${metrics.spreadPct >= 0 ? "+" : ""}${metrics.spreadPct.toFixed(1)}%)\n` +
          `● **🗺️ [日内24H四步作战推演]**: ${intradayData.isBlowOffTop ? `①盘前摸顶回落 (天花板 $${intradayData.majorSupLow.toFixed(2)}~$${intradayData.majorSupHigh.toFixed(2)}) ➔ ②22:30开盘诱多反抽 $${intradayData.microRes.toFixed(2)} 逃命窗 ➔ ③放量跌破VWAP ($${intradayData.vwap.toFixed(2)}) ➔ ④尾盘向11/18中继回归 ($${intradayData.demandLow.toFixed(2)}~$${intradayData.demandHigh.toFixed(2)})` : `①盘前微阻 $${intradayData.microRes.toFixed(2)} ➔ ②22:30开盘承接区 $${intradayData.demandLow.toFixed(2)}~$${intradayData.demandHigh.toFixed(2)} ➔ ③攻克VWAP ($${intradayData.vwap.toFixed(2)}) ➔ ④尾盘目标带 $${intradayData.majorSupLow.toFixed(2)}~$${intradayData.majorSupHigh.toFixed(2)}`}\n` +
          `● **💎 [周期系统逻辑理论：乖离均值回归轨]**: 11/18中继 $${P.p1118.toFixed(2)} ➔ **11/26黄金坑 $${P.p1126.toFixed(2)}** ➔ 12/10主升峰 $${P.p1210.toFixed(2)}\n` +
          `● **🛡️ [3x杠杆磨损锁锚对照轨]**: 11/18中继 $${L.p1118.toFixed(2)} ➔ **11/26磨损极限右脚 $${L.p1126.toFixed(2)}** ➔ 12/10扣磨损峰 $${L.p1210.toFixed(2)}`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      if (!isAuthed) {
        return (
          <div className="min-h-screen bg-[#0F172A] flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-700/80 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">

                    const pVal = intradayData.maxY - r * (intradayData.maxY - intradayData.minY);
                    return (
                      <g key={i}>
                        <line x1={intradayData.PAD_L} y1={py} x2={intradayData.W - intradayData.PAD_R} y2={py} stroke="#334155" strokeDasharray="3 3" strokeWidth="0.8" />
                        <text x={intradayData.PAD_L - 8} y={py + 4} textAnchor="end" fontSize="11" fill="#475569" className="font-mono font-semibold">
                          ${pVal.toFixed(2)}
                        </text>
                      </g>
                    );
                  })}

                  <rect x={intradayData.PAD_L} y={intradayData.yOf(intradayData.majorSupHigh)} width={intradayData.W - intradayData.PAD_L - intradayData.PAD_R} height={Math.max(4, intradayData.yOf(intradayData.majorSupLow) - intradayData.yOf(intradayData.majorSupHigh))} fill="#F43F5E" opacity="0.24" />
                  <text x={intradayData.PAD_L + 10} y={intradayData.yOf(intradayData.majorSupHigh) + 14} textAnchor="start" fontSize="10.5" fontWeight="bold" fill="#FDA4AF" className="font-mono">
                    🔴 {intradayData.isBlowOffTop ? "周期系统理论天花板派发带" : "日内强阻力带"}: ${intradayData.majorSupLow.toFixed(2)} ~ ${intradayData.majorSupHigh.toFixed(2)}
                  </text>

                  <rect x={intradayData.PAD_L} y={intradayData.yOf(intradayData.demandHigh)} width={intradayData.W - intradayData.PAD_L - intradayData.PAD_R} height={Math.max(4, intradayData.yOf(intradayData.demandLow) - intradayData.yOf(intradayData.demandHigh))} fill="#10B981" opacity="0.25" />
                  <text x={intradayData.PAD_L + 10} y={intradayData.yOf(intradayData.demandHigh) - 6} textAnchor="start" fontSize="10.5" fontWeight="bold" fill="#6EE7B7" className="font-mono">
                    🟢 {intradayData.isBlowOffTop ? "11/18中继引力与缺口承接带 (Target Demand Zone)" : "分时需求承接区 (Demand Zone)"}: ${intradayData.demandLow.toFixed(2)} ~ ${intradayData.demandHigh.toFixed(2)}
                  </text>

                  <line x1={intradayData.PAD_L} y1={intradayData.yOf(intradayData.vwap)} x2={intradayData.W - intradayData.PAD_R} y2={intradayData.yOf(intradayData.vwap)} stroke="#FBBF24" strokeDasharray="6 4" strokeWidth="1.6" />
                  <text x={intradayData.PAD_L + 10} y={intradayData.yOf(intradayData.vwap) - 6} fontSize="10.5" fontWeight="bold" fill="#FBBF24" className="font-mono">
                    🟡 今日真实分时均价线 (Locked VWAP 多空分水岭): ${intradayData.vwap.toFixed(2)}
                  </text>

                  <line x1={intradayData.xOf(intradayData.nowIdx)} y1={intradayData.PAD_T} x2={intradayData.xOf(intradayData.nowIdx)} y2={intradayData.H - intradayData.PAD_B} stroke="#EF4444" strokeDasharray="5 3" strokeWidth="1.8" />
                  <line x1={intradayData.xOf(intradayData.openIdx)} y1={intradayData.PAD_T} x2={intradayData.xOf(intradayData.openIdx)} y2={intradayData.H - intradayData.PAD_B} stroke="#6366F1" strokeDasharray="4 4" strokeWidth="1.5" />

                  <polyline fill="none" stroke="#10B981" strokeWidth={intraScenario === "B" ? "3.2" : "1.3"} strokeDasharray="4 4" opacity={intraScenario === "B" ? "1" : "0.38"} points={intradayData.pathB.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#F97316" strokeWidth={intraScenario === "C" ? "3.2" : "1.3"} strokeDasharray="4 4" opacity={intraScenario === "C" ? "1" : "0.38"} points={intradayData.pathC.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#38BDF8" strokeWidth={intraScenario === "A" ? "3.4" : "1.5"} strokeDasharray="7 4" opacity={intraScenario === "A" ? "1" : "0.42"} points={intradayData.pathA.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#F8FAFC" strokeWidth="2.8" points={intradayData.pastPts.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />

                  {intradayData.nowIdx >= 5 && (
                    <g transform={`translate(${intradayData.xOf(5)}, ${intradayData.yOf(cfg.lockedMorningPts[5]) - 14})`}>
                      <circle cx="0" cy="14" r="4.5" fill="#F43F5E" stroke="#FFFFFF" strokeWidth="1" />
                      <text x="0" y="0" textAnchor="middle" fontSize="10.5" fontWeight="bold" fill="#FDA4AF" className="font-mono">
                        盘前极值: ${cfg.lockedMorningPts[5].toFixed(2)}
                      </text>
                    </g>
                  )}

                  <circle cx={intradayData.xOf(intradayData.nowIdx)} cy={intradayData.yOf(curP)} r="6" fill="#EF4444" stroke="#FEF2F2" strokeWidth="2" />
                  <g transform={`translate(${intradayData.xOf(intradayData.nowIdx)}, ${intradayData.yOf(curP) + 22})`}>
                    <rect x="-74" y="-12" width="148" height="20" rx="5" fill="#0F172A" stroke="#EF4444" strokeWidth="1.2" opacity="0.95" />
                    <text x="0" y="2" textAnchor="middle" fontSize="11" fontWeight="bold" fill="#FCA5A5" className="font-mono">
                      NOW({INTRA_SLOTS[intradayData.nowIdx].bjt}): ${curP.toFixed(2)}
                    </text>
                  </g>

                  {(intradayData.isBlowOffTop ? [
                    { idx: 10, label: "23:15 诱多反抽", color: "#FDA4AF", dy: -20 },
                    { idx: 12, label: "01:00 跌破VWAP", color: "#FBBF24", dy: -20 },
                    { idx: 15, label: "04:00 回归中继", color: "#34D399", dy: 24 }
                  ] : [
                    { idx: 10, label: "23:15 开盘右脚", color: "#34D399", dy: 24 },
                    { idx: 12, label: "01:00 攻克VWAP", color: "#FBBF24", dy: -20 },
                    { idx: 15, label: "04:00 尾盘目标", color: "#38BDF8", dy: -20 }
                  ]).map((pt, i) => {
                    const item = activeIntraPath.find(d => d[0] === pt.idx);
                    if (!item) return null;
                    const cx = intradayData.xOf(pt.idx);
                    const cy = intradayData.yOf(item[1]);
                    return (
                      <g key={i}>
                        <circle cx={cx} cy={cy} r="5" fill={pt.color} stroke="#0F172A" strokeWidth="1.5" />
                        <g transform={`translate(${cx}, ${cy + pt.dy})`}>
                          <rect x="-78" y="-12" width="156" height="20" rx="5" fill="#0F172A" stroke={pt.color} strokeWidth="1" opacity="0.92" />
                          <text x="0" y="2" textAnchor="middle" fontSize="10.5" fontWeight="bold" fill={pt.color} className="font-mono">
                            {pt.label}: ${item[1].toFixed(2)}
                          </text>
                        </g>
                      </g>
                    );
                  })}

                  {intradayData.slots.map((s, idx) => {
                    const isNow = idx === intradayData.nowIdx;
                    const isOpen = idx === intradayData.openIdx;
                    return (
                      <g key={idx}>
                        <text
                          x={intradayData.xOf(idx)}
                          y={intradayData.H - 16}
                          textAnchor="middle"
                          fontSize="10.5"
                          fontWeight={isNow || isOpen ? "bold" : "normal"}
                          fill={isNow ? "#EF4444" : (isOpen ? "#818CF8" : "#94A3B8")}
                          className="font-mono"
                        >
                          {isNow ? `NOW(${s.bjt})` : s.bjt}
                        </text>
                        <text
                          x={intradayData.xOf(idx)}
                          y={intradayData.H - 4}
                          textAnchor="middle"
                          fontSize="8.5"
                          fill="#475569"
                          className="font-mono"
                        >
                          {s.est}E
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
            </div>
          )}

          {/* ================= 周期系统逻辑理论跨月日K宏观周期分形推演图 ================= */}
          {(viewMode === "both" || viewMode === "macro") && (
            <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-blue-500/30 space-y-4">
              <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-3">
                <div>
                  <h2 className="text-base md:text-lg font-bold text-slate-900">
                    📅 【个股量化实盘推演 V3.5 · 周期系统逻辑理论乖离均值回归校准】{ticker} - {cfg.name}
                  </h2>
                  <p className="text-xs text-slate-500 font-mono mt-0.5">
                    灰色点线: 10/14周期系统逻辑理论未折价母版(绝对标尺) · 蓝色粗虚线: 周期系统逻辑理论自适应动态推演轨[乖离均值回归校准] · 紫色虚线: 3x杠杆磨损锁锚轨
                  </p>
                </div>

                <div className="flex flex-wrap gap-1.5">
                  {[
                    { id: "dual", label: "🔥 双轨同屏 (周期系统逻辑理论轨 + 3x磨损锁锚轨)", cls: "bg-indigo-600 text-white" },
                    { id: "sys", label: "💎 仅看周期系统逻辑理论轨 (11/26 ➔ $" + metrics.sysTrack.p1126.toFixed(2) + ")", cls: "bg-blue-600 text-white" },
                    { id: "locked", label: "🛡️ 仅看3x磨损锁锚轨 (11/26 ➔ $" + metrics.lockedTrack.p1126.toFixed(2) + ")", cls: "bg-purple-700 text-white" }
                  ].map(m => (
                    <button
                      key={m.id}
                      onClick={() => setCycleEngine(m.id)}
                      className={`px-3 py-1.5 text-xs font-bold rounded-xl transition ${
                        cycleEngine === m.id ? m.cls + " shadow" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                      }`}
                    >
                      {m.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs font-mono bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                <div className="p-3 rounded-xl bg-amber-50/90 border-l-4 border-l-amber-500 border border-amber-200">
                  <div className="text-amber-900 font-bold">PHASE 1 · 当前实盘锚点</div>
                  <div className="text-amber-700 font-extrabold text-sm mt-1">现价: ${curP.toFixed(2)}</div>
                  <div className="text-[11px] text-amber-800 mt-1">今日周期系统逻辑理论位: ${activeTheoNow.toFixed(2)}</div>
                </div>
                <div className="p-3 rounded-xl bg-purple-50/90 border-l-4 border-l-purple-600 border border-purple-200">
                  <div className="text-purple-900 font-bold">PHASE 2 · 11/18 震荡中继</div>
                  <div className="text-purple-700 font-extrabold text-sm mt-1">
                    系统逻辑轨 ${metrics.sysTrack.p1118.toFixed(2)} | 磨损轨 ${metrics.lockedTrack.p1118.toFixed(2)}
                  </div>
                  <div className="text-[11px] text-purple-800 mt-1">财报消化后回撤中继，空单减半锁利</div>
                </div>
                <div className="p-3 rounded-xl bg-blue-50/90 border-l-4 border-l-blue-600 border border-blue-300 shadow-sm">
                  <div className="text-blue-900 font-bold">PHASE 3 · 11/26 终极黄金坑</div>
                  <div className="text-blue-700 font-extrabold text-sm mt-1">
                    系统逻辑轨 ${metrics.sysTrack.p1126.toFixed(2)} | 磨损轨 ${metrics.lockedTrack.p1126.toFixed(2)}
                  </div>
                  <div className="text-[11px] text-blue-900 mt-1 font-semibold">🎯 W底黄金右脚，战略级满仓抄底点</div>
                </div>
                <div className="p-3 rounded-xl bg-emerald-50/90 border-l-4 border-l-emerald-600 border border-emerald-200">
                  <div className="text-emerald-900 font-bold">PHASE 4 · 12/10 跨年主升峰</div>
                  <div className="text-emerald-700 font-extrabold text-sm mt-1">
                    系统逻辑轨 ${metrics.sysTrack.p1210.toFixed(2)} | 磨损轨 ${metrics.lockedTrack.p1210.toFixed(2)}
                  </div>
                  <div className="text-[11px] text-emerald-800 mt-1">🚀 圣诞跨年主升浪波峰兑现区</div>
                </div>
              </div>

              <div className="w-full overflow-x-auto">
                <svg viewBox={`0 0 ${W} ${H1 + H2 + 20}`} className="w-full h-auto select-none">
                  <rect x={PAD_L} y={20} width={W - PAD_L - PAD_R} height={H1 - 45} fill="#FAFAFA" stroke="#CBD5E1" strokeWidth="1" />
                  <rect x={xOf("10/19")} y={20} width={xOf("10/26") - xOf("10/19")} height={H1 - 45} fill="#E2E8F0" opacity="0.55" />
                  <rect x={xOf("10/30")} y={20} width={xOf("11/02") - xOf("10/30")} height={H1 - 45} fill="#FEE2E2" opacity="0.55" />
                  <rect x={xOf("11/23")} y={20} width={xOf("11/26") - xOf("11/23") + 18} height={H1 - 45} fill="#DBEAFE" opacity="0.65" />
                  <rect x={xOf("12/03")} y={20} width={xOf("12/10") - xOf("12/03") + 15} height={H1 - 45} fill="#FEF9C3" opacity="0.65" />

                  {[0, 0.25, 0.5, 0.75, 1].map((r, idx) => {
                    const py = 20 + r * (H1 - 45);
                    const pVal = maxP - r * (maxP - minP);
                    return (
                      <g key={idx}>
                        <line x1={PAD_L} y1={py} x2={W - PAD_R} y2={py} stroke="#CBD5E1" strokeDasharray="4 4" strokeWidth="0.8" />
                        <text x={PAD_L - 8} y={py + 4} textAnchor="end" fontSize="11" fill="#475569" className="font-mono">
                          ${pVal.toFixed(1)}
                        </text>
                      </g>
                    );
                  })}

                  <line x1={nowX} y1={20} x2={nowX} y2={H1 - 25} stroke="#DC2626" strokeDasharray="6 3" strokeWidth="1.8" />

                  <polyline fill="none" stroke="#94A3B8" strokeWidth="2.0" strokeDasharray="3 3" points={cfg.theoCurve.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#0F172A" strokeWidth="2.8" points={histPts.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")} />

                  {/* 宏观顶部派发阻力带 (已与周期系统逻辑理论天花板对齐) */}
                  <rect x={nowX} y={y1Of(metrics.sysTrack.sweepHigh)} width={shortEndX - nowX} height={Math.max(4, y1Of(metrics.sysTrack.sweepLow) - y1Of(metrics.sysTrack.sweepHigh))} fill="#FB7185" opacity="0.32" />
                  <line x1={nowX} y1={y1Of(metrics.sysTrack.sweepHigh)} x2={shortEndX} y2={y1Of(metrics.sysTrack.sweepHigh)} stroke="#E11D48" strokeWidth="1.6" />
                  <line x1={nowX} y1={y1Of(metrics.sysTrack.pivot)} x2={shortEndX} y2={y1Of(metrics.sysTrack.pivot)} stroke="#D97706" strokeDasharray="4 3" strokeWidth="1.4" />

                  {(cycleEngine === "dual" || cycleEngine === "locked") && cfg.betaDecay > 0 && (
                    <g>
                      <polyline fill="none" stroke="#7C3AED" strokeWidth={cycleEngine === "locked" ? "3.2" : "2.2"} strokeDasharray="5 3" points={futLocked.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")} />
                      {[
                        { dt: "11/18", val: metrics.lockedTrack.p1118, label: `磨损中继: $${metrics.lockedTrack.p1118.toFixed(1)}`, dy: 20 },
                        { dt: "11/26", val: metrics.lockedTrack.p1126, label: `磨损底: $${metrics.lockedTrack.p1126.toFixed(2)}`, dy: 22 },
                        { dt: "12/10", val: metrics.lockedTrack.p1210, label: `磨损峰: $${metrics.lockedTrack.p1210.toFixed(1)}`, dy: 22 }
                      ].map((nd, i) => (
                        <g key={i}>
                          <circle cx={xOf(nd.dt)} cy={y1Of(nd.val)} r="4.5" fill="#7C3AED" stroke="#FFFFFF" strokeWidth="1" />
                          <g transform={`translate(${xOf(nd.dt)}, ${y1Of(nd.val) + nd.dy})`}>
                            <rect x="-58" y="-11" width="116" height="16" rx="4" fill="#FFFFFF" stroke="#DDD6FE" strokeWidth="1" opacity="0.92" />
                            <text x="0" y="1" textAnchor="middle" fontSize="10" fontWeight="bold" fill="#6D28D9" className="font-mono">
                              {nd.label}
                            </text>
                          </g>
                        </g>
                      ))}
                    </g>
                  )}

                  {(cycleEngine === "dual" || cycleEngine === "sys") && (
                    <g>
                      <polyline fill="none" stroke="#1D4ED8" strokeWidth="3.2" strokeDasharray="8 4" points={futSys.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")} />
                      {[
                        { dt: "11/18", val: metrics.sysTrack.p1118, label: `11-18: $${metrics.sysTrack.p1118.toFixed(1)}`, color: "#7C3AED", dy: -16 },
                        { dt: "11/26", val: metrics.sysTrack.p1126, label: `11-26: $${metrics.sysTrack.p1126.toFixed(2)}`, color: "#1E40AF", dy: -16 },
                        { dt: "12/10", val: metrics.sysTrack.p1210, label: `12-10: $${metrics.sysTrack.p1210.toFixed(1)}`, color: "#059669", dy: -16 }
                      ].map((nd, i) => (
                        <g key={i}>
                          <circle cx={xOf(nd.dt)} cy={y1Of(nd.val)} r="5.5" fill={nd.color} stroke="#FFFFFF" strokeWidth="1.5" />
                          <g transform={`translate(${xOf(nd.dt)}, ${y1Of(nd.val) + nd.dy})`}>
                            <rect x="-56" y="-11" width="112" height="16" rx="4" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1" opacity="0.92" />
                            <text x="0" y="1" textAnchor="middle" fontSize="10.5" fontWeight="bold" fill={nd.color} className="font-mono">
                              {nd.label}
                            </text>
                          </g>
                        </g>
                      ))}
                    </g>
                  )}

                  <circle cx={nowX} cy={y1Of(curP)} r="6" fill="#DC2626" stroke="#FFFFFF" strokeWidth="1.5" />
                  <text x={nowX - 8} y={y1Of(curP) - 12} textAnchor="end" fontSize="11.5" fontWeight="bold" fill="#DC2626" className="font-mono">
                    当前实盘锚点: ${curP.toFixed(2)}
                  </text>

                  <g transform={`translate(0, ${H1 + 5})`}>
                    <rect x={PAD_L} y={10} width={W - PAD_L - PAD_R} height={H2 - 35} fill="#FAFAFA" stroke="#CBD5E1" strokeWidth="1" />
                    <line x1={PAD_L} y1={y2Of(0)} x2={W - PAD_R} y2={y2Of(0)} stroke="#64748B" strokeDasharray="3 3" strokeWidth="1" />
                    <line x1={nowX} y1={10} x2={nowX} y2={H2 - 25} stroke="#DC2626" strokeDasharray="6 3" strokeWidth="1.8" />

                    {[minPct * 0.5, 0, maxPct * 0.5].map((pctVal, idx) => {
                      const py = y2Of(pctVal);
                      return (
                        <g key={idx}>
                          <text x={PAD_L - 8} y={py + 4} textAnchor="end" fontSize="10.5" fill="#475569" className="font-mono">
                            {pctVal >= 0 ? `+${pctVal.toFixed(0)}%` : `${pctVal.toFixed(0)}%`}
                          </text>
                        </g>
                      );
                    })}

                    <polyline fill="none" stroke="#334155" strokeWidth="1.8" points={histPts.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")} />
                    {(cycleEngine === "dual" || cycleEngine === "locked") && cfg.betaDecay > 0 && (
                      <polyline fill="none" stroke="#7C3AED" strokeWidth="2.0" strokeDasharray="4 3" points={futLocked.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")} />
                    )}
                    {(cycleEngine === "dual" || cycleEngine === "sys") && (
                      <polyline fill="none" stroke="#1D4ED8" strokeWidth="2.6" strokeDasharray="7 4" points={futSys.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")} />
                    )}

                    {allLabels.filter((_, idx) => idx % 2 === 0).map((lbl, i) => (
                      <text key={i} x={xOf(lbl)} y={H2 - 6} textAnchor="middle" fontSize="10.5" fill="#334155" className="font-mono">
                        {lbl}
                      </text>
                    ))}
                  </g>
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
