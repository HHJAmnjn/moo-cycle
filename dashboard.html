        const syncQuotes = async () => {
          if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            try {
              const localRes = await fetch("./live_price.json?t=" + Date.now(), { cache: "no-store" });
              if (localRes.ok) {
                const data = await localRes.json();
                if (data && data.prices && isMounted) {
                  setPrices(prev => ({ ...prev, ...data.prices }));
                  if (data.prev_close) setPrevCloses(prev => ({ ...prev, ...data.prev_close }));
                  setLiveStatus(`OpenD 本地实时 (${data.ts})`);
                  return;
                }
              }
            } catch (e) {}
          }
          try {
            const newP = {};
            const newPrev = {};
            await Promise.all(TICKER_ORDER.map(async (sym) => {
              const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d&includePrePost=true`;
              const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
              ];
              for (const pUrl of proxies) {
                try {
                  const r = await fetch(pUrl);
                  if (!r.ok) continue;
                  const j = await r.json();
                  const meta = j?.chart?.result?.[0]?.meta;
                  const quoteIndicators = j?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
                  if (meta) {
                    let latest = meta.regularMarketPrice;
                    if (Array.isArray(quoteIndicators)) {
                      for (let k = quoteIndicators.length - 1; k >= 0; k--) {
                        if (quoteIndicators[k] !== null && quoteIndicators[k] > 0) {
                          latest = quoteIndicators[k];
                          break;
                        }
                      }
                    }
                    if (latest && latest > 0) newP[sym] = parseFloat(latest.toFixed(2));
                    if (meta.chartPreviousClose && meta.chartPreviousClose > 0) {
                      newPrev[sym] = parseFloat(meta.chartPreviousClose.toFixed(2));
                    }
                    break;
                  }
                } catch (innerErr) {}
              }
            }));
            if (Object.keys(newP).length > 0 && isMounted) {
              setPrices(prev => ({ ...prev, ...newP }));
              if (Object.keys(newPrev).length > 0) setPrevCloses(prev => ({ ...prev, ...newPrev }));
              const ts = new Date().toLocaleTimeString("zh-CN", { hour12: false });
              setLiveStatus(`云端公网实时 (${ts})`);
            }
          } catch (err) {
            if (isMounted) setLiveStatus("云端信号同步中");
          }
        };
        syncQuotes();
        const id = setInterval(syncQuotes, 8000);
        return () => { isMounted = false; clearInterval(id); };
      }, [isLive, isAuthed]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === ACCESS_PIN) {
          try { localStorage.setItem(AUTH_STORAGE_KEY, ACCESS_PIN); } catch (err) {}
          setIsAuthed(true);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const handleLogout = () => {
        try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (err) {}
        setIsAuthed(false);
        setPinInput("");
      };

      const cfg = RAW_DB[ticker];
      const curP = prices[ticker] || cfg.regClose;

      const updatePriceManual = (val) => {
        setIsLive(false);
        setPrices(prev => ({ ...prev, [ticker]: val }));
      };

      // ✨ 双引擎指标同步计算：同时算出【原教旨锁锚版 ($42.35)】与【V3.5 动态乖离回归版 ($47.52)】
      const metrics = useMemo(() => {
        const spreadPct = ((curP - cfg.theoNow) / cfg.theoNow) * 100;

        // 1. 版本B：V3.5 动态乖离均值回归版 (随 curP 浮动，当 SOXL=56.20 时 11/26 精准等于 $47.52)
        const v35 = {
          pivot: curP * cfg.v35Ratios.pivot,
          p1118: curP * cfg.v35Ratios.n1118,
          p1126: curP * cfg.v35Ratios.n1126,
          p1210: curP * cfg.v35Ratios.n1210,
          p1231: curP * cfg.v35Ratios.n1231,
          neckLow: curP * cfg.v35Ratios.neck[0],
          neckHigh: curP * cfg.v35Ratios.neck[1],
          sweepLow: curP * cfg.v35Ratios.sweep[0],
          sweepHigh: curP * cfg.v35Ratios.sweep[1]
        };

        // 2. 版本A：周期原教旨·锁锚定底版 (锁定左脚 + 3x杠杆不可逆损耗，SOXL 11/26 锁死在 $42.35 附近)
        const microDrift = 0.92 + 0.08 * (curP / cfg.regClose);
        const locked = {
          pivot: curP * 0.945,
          p1118: cfg.lockedNodes.n1118 * microDrift,
          p1126: cfg.lockedNodes.n1126, // 终极黄金坑右脚严格锁锚，不被逼空针带偏
          p1210: cfg.lockedNodes.n1210 * microDrift,
          p1231: cfg.lockedNodes.n1231 * microDrift,
          neckLow: cfg.lockedNeck[0],
          neckHigh: cfg.lockedNeck[1],
          sweepLow: cfg.lockedSweep[0],
          sweepHigh: cfg.lockedSweep[1]
        };

        const active = cycleEngine === "v35" ? v35 : locked;
        return { spreadPct, v35, locked, active };
      }, [ticker, curP, cfg, cycleEngine]);

      const intradayData = useMemo(() => {
        const W = 1000, H = 350, PAD_L = 64, PAD_R = 28, PAD_T = 28, PAD_B = 34;
        const plotW = W - PAD_L - PAD_R;
        const seed = cfg.intradaySeed;

        const slots = [
          "08:00", "08:30", "09:30", "11:00", "12:30", "14:00", "15:00", "15:45",
          "NOW",   "18:00", "20:00", "21:30", "22:30", "23:00", "00:30", "02:30", "04:00", "05:00"
        ];
        const xOf = (idx) => PAD_L + (idx / (slots.length - 1)) * plotW;
        const nowIdx = 8;

        const vwap = curP * seed.vwapRatio;
        const demandLow = curP * seed.demandLowRatio;
        const demandHigh = curP * seed.demandHighRatio;
        const microSup = curP * seed.microSupRatio;
        const majorSupLow = curP * seed.majorSupLow;
        const majorSupHigh = curP * seed.majorSupHigh;
        const stopHuntLow = demandLow * 0.975;

        const pastPts = seed.pastRatios.map((r, i) => [i, curP * r]);
        pastPts.push([nowIdx, curP]);

        let pathA, pathB, pathC;
        if (!cfg.isInverse) {
          // 逼空次日/CRWV财报日分时推演：高位换手受阻 -> 盘中回踩分时VWAP -> 尾盘/盘后受财报影响回撤
          pathA = [
            [nowIdx, curP],
            [9,  curP * 0.992],
            [10, curP * 0.985],
            [11, curP * 0.996],
            [12, microSup * 0.998],
            [13, vwap * 1.002],
            [14, vwap * 0.988],
            [15, (demandLow + demandHigh) * 0.5],
            [16, demandLow * 1.004],
            [17, demandHigh * 0.998]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  microSup * 0.998],
            [10, curP * 0.995],
            [11, microSup * 1.005],
            [12, majorSupLow * 1.002],
            [13, majorSupHigh * 0.998],
            [14, curP * 0.995],
            [15, vwap * 1.005],
            [16, vwap * 0.995],
            [17, vwap * 1.000]
          ];
          pathC = [
            [nowIdx, curP],
            [9,  curP * 0.985],
            [10, vwap * 0.995],
            [11, vwap * 0.985],
            [12, demandHigh * 0.995],
            [13, demandLow * 0.992],
            [14, stopHuntLow],
            [15, demandLow * 0.995],
            [16, demandHigh * 0.992],
            [17, demandLow * 1.002]
          ];
        } else {
          pathA = [
            [nowIdx, curP],
            [9,  curP * 1.008],
            [10, curP * 1.015],
            [11, curP * 1.004],
            [12, demandHigh * 0.998],
            [13, vwap * 1.005],
            [14, microSup * 1.002],
            [15, majorSupLow * 1.002],
            [16, majorSupHigh * 0.998],
            [17, majorSupLow * 1.005]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  curP * 0.990],
            [10, demandHigh * 0.995],
            [11, demandLow * 1.002],
            [12, demandLow * 0.988],
            [13, stopHuntLow],
            [14, demandLow * 1.005],
            [15, vwap * 0.995],
            [16, vwap * 1.005],
            [17, vwap * 1.000]
          ];
          pathC = [
            [nowIdx, curP],
            [9,  vwap * 1.005],
            [10, microSup * 1.002],
            [11, microSup * 1.015],
            [12, majorSupLow * 1.010],
            [13, majorSupHigh * 1.015],
            [14, majorSupHigh * 1.028],
            [15, majorSupHigh * 1.012],
            [16, majorSupLow * 1.008],
            [17, majorSupHigh * 1.005]
          ];
        }

        const allVals = [
          ...pastPts.map(d => d[1]),
          ...pathA.map(d => d[1]),
          ...pathB.map(d => d[1]),
          ...pathC.map(d => d[1]),
          stopHuntLow
        ];
        const minY = Math.min(...allVals) * 0.985;
        const maxY = Math.max(...allVals) * 1.015;
        const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * (H - PAD_T - PAD_B);

        return {
          W, H, PAD_L, PAD_R, PAD_T, PAD_B, slots, nowIdx, xOf, yOf, minY, maxY,
          vwap, demandLow, demandHigh, microSup, majorSupLow, majorSupHigh, stopHuntLow,
          pastPts, pathA, pathB, pathC
        };
      }, [ticker, curP, cfg]);

      // 宏观双轨数据生成 (同时生成 Locked 原教旨轨与 V3.5 回归轨)
      const chartData = useMemo(() => {
        const W = 1000, H1 = 350, H2 = 165, PAD_L = 62, PAD_R = 24, PAD_T = 24, PAD_B = 28;
        const plotW = W - PAD_L - PAD_R;
        const allLabels = [
          "08/31","09/07","09/14","09/21","09/28","10/05","10/12","10/19","10/26","10/30","11/02","11/05","11/06",
          "11/09","11/12","11/16","11/18","11/23","11/26","12/03","12/10","12/21","12/31"
        ];
        const xOf = (label) => {
          const idx = allLabels.indexOf(label);
          const safeIdx = idx === -1 ? 6 : idx;
          return PAD_L + (safeIdx / (allLabels.length - 1)) * plotW;
        };

        const histPts = [...cfg.hist, ["11/09", curP]];

        // 轨迹A：原教旨锁锚轨 (11/18 -> $47.53, 11/26 -> $42.35, 12/10 -> $64.52)
        const L = metrics.locked;
        const futLocked = [
          ["11/09", curP],
          ["11/12", curP * 0.62 + L.p1118 * 0.38],
          ["11/16", curP * 0.25 + L.p1118 * 0.75],
          ["11/18", L.p1118],
          ["11/23", (L.p1118 + L.p1126) * 0.50],
          ["11/26", L.p1126],
          ["12/03", (L.p1126 + L.p1210) * 0.52],
          ["12/10", L.p1210],
          ["12/21", (L.p1210 + L.p1231) * 0.50],
          ["12/31", L.p1231]
        ];

        // 轨迹B：V3.5 动态乖离均值回归轨 (11/18 -> $54.99, 11/26 -> $47.52, 12/10 -> $75.60)
        const V = metrics.v35;
        const futV35 = [
          ["11/09", curP],
          ["11/12", curP * 0.70 + V.p1118 * 0.30],
          ["11/16", curP * 0.35 + V.p1118 * 0.65],
          ["11/18", V.p1118],
          ["11/23", (V.p1118 + V.p1126) * 0.50],
          ["11/26", V.p1126],
          ["12/03", (V.p1126 + V.p1210) * 0.52],
          ["12/10", V.p1210],
          ["12/21", (V.p1210 + V.p1231) * 0.50],
          ["12/31", V.p1231]
        ];

        const allPrices = [
          ...histPts.map(d => d[1]),
          ...futLocked.map(d => d[1]),
          ...futV35.map(d => d[1]),
          ...cfg.theoCurve.map(d => d[1]),
          V.sweepHigh,
          L.p1126
        ];
        const minP = Math.min(...allPrices) * 0.90;
        const maxP = Math.max(...allPrices) * 1.06;
        const y1Of = (p) => PAD_T + (1 - (p - minP) / (maxP - minP)) * (H1 - PAD_T - PAD_B);

        const allPct = allPrices.map(p => ((p / curP) - 1) * 100);
        const minPct = Math.min(...allPct, -30);
        const maxPct = Math.max(...allPct, 45);
        const y2Of = (pct) => 16 + (1 - (pct - minPct) / (maxPct - minPct)) * (H2 - 44);

        return { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futLocked, futV35, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct };
      }, [cfg, curP, metrics]);

      const openCountdown = useMemo(() => {
        const h = nowClock.getHours();
        const m = nowClock.getMinutes();
        const s = nowClock.getSeconds();
        const curSec = h * 3600 + m * 60 + s;
        const openSec = 22 * 3600 + 30 * 60;
        if (curSec < openSec && h >= 5) {
          const diff = openSec - curSec;
          const dh = Math.floor(diff / 3600);
          const dm = Math.floor((diff % 3600) / 60);
          const ds = diff % 60;
          return `距 22:30 美股开盘 ${dh}h ${dm}m ${ds}s`;
        }
        return "🔥 美股正盘交易中";
      }, [nowClock]);

      const copyDiscordReport = () => {
        const L = metrics.locked;
        const V = metrics.v35;
        const text = `📊 **【${ticker} 周期模型 V3.5 × V3.6 双轨实盘推演战报】**\n` +
          `● **当前实盘锚点**: $${curP.toFixed(2)} (今日10/14原始理论位 $${cfg.theoNow.toFixed(2)} | 乖离 ${metrics.spreadPct.toFixed(1)}%)\n` +
          `● **🛡️ 轨迹A [周期原教旨·3x损耗锁锚轨]**: 11/18中继 $${L.p1118.toFixed(2)} ➔ **11/26黄金坑右脚 $${L.p1126.toFixed(2)}** ➔ 12/10跨年峰 $${L.p1210.toFixed(2)}\n` +
          `● **💎 轨迹B [V3.5 动态乖离均值回归轨]**: 11/18中继 $${V.p1118.toFixed(2)} ➔ **11/26浅回踩轨 $${V.p1126.toFixed(2)}** ➔ 12/10理论上限 $${V.p1210.toFixed(2)}\n` +
          `● **雷达区对照**: 结构性左脚扫损带 $${L.sweepLow.toFixed(2)}~$${L.sweepHigh.toFixed(2)} (已触及兑现) | V3.5顺势极限阻力 $${V.sweepLow.toFixed(2)}~$${V.sweepHigh.toFixed(2)}`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      if (!isAuthed) {
        return (
          <div className="min-h-screen bg-[#0F172A] flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-700/80 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-2xl mb-1">
                  🛡️
                </div>
                <h1 className="text-xl font-bold text-white tracking-tight">
                  【周期模型 V3.5 × V3.6 双轨终端】
                </h1>
                <p className="text-xs text-slate-400 font-mono">
                  VIP 内部量化监控终端 · 请输入访问口令解锁
                </p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
                    placeholder="请输入访问密码..."
                    autoFocus
                    className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white text-center font-mono text-lg tracking-widest focus:outline-none focus:border-indigo-500 transition"
                  />
                  {pinError && (
                    <p className="text-xs text-rose-400 text-center mt-2 font-mono">
                      ❌ 访问口令错误，请核对后重试
                    </p>
                  )}
                </div>
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition shadow-lg shadow-indigo-600/30"
                >
                  🔓 验证并进入实时终端
                </button>
              </form>
            </div>
          </div>
        );
      }

      const { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futLocked, futV35, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct } = chartData;
      const nowX = xOf("11/09");
      const shortEndX = xOf("11/18");
      const activeIntraPath = intraScenario === "A" ? intradayData.pathA : (intraScenario === "B" ? intradayData.pathB : intradayData.pathC);

      return (
        <div className="min-h-screen p-2.5 md:p-5 max-w-[1440px] mx-auto space-y-4">
          <header className="flex flex-wrap justify-between items-center bg-white px-4 md:px-6 py-3.5 rounded-2xl shadow-sm border border-slate-200 gap-3">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => setIsLive(!isLive)}
                  className={`px-2.5 py-1 text-xs font-bold rounded-lg border transition cursor-pointer ${
                    isLive
                      ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                      : "bg-amber-50 text-amber-700 border-amber-300"
                  }`}
                >
                  {isLive ? `🟢 ${liveStatus}` : `🟡 ${liveStatus} (点此恢复自动)`}
                </button>
                <span className="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200">
                  ⏱️ {openCountdown}
                </span>
                <h1 className="text-base md:text-xl font-bold text-slate-900 tracking-tight">
                  【周期模型 V3.5 × V3.6 双轨实盘推演】{ticker} - {cfg.name}
                </h1>
              </div>

              <div className="flex items-center gap-2 mt-2 flex-wrap">
                {[
                  { id: "both", label: "⚡ 日内+宏观双擎同屏" },
                  { id: "macro", label: "📅 仅看跨月宏观双轨图" },
                  { id: "intraday", label: "📈 仅看日内24H推演" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setViewMode(tab.id)}
                    className={`px-2.5 py-1 text-xs font-bold rounded-lg transition ${
                      viewMode === tab.id ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
                <button
                  onClick={() => setCleanShot(!cleanShot)}
                  className={`px-2.5 py-1 text-xs font-bold rounded-lg border transition ${
                    cleanShot
                      ? "bg-rose-600 text-white border-rose-700 shadow"
                      : "bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100"
                  }`}
                >
                  {cleanShot ? "📸 退出群聊截图模式" : "📸 群聊截图模式"}
                </button>
                <button
                  onClick={handleLogout}
                  className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 transition"
                >
                  🔒 锁定
                </button>
              </div>
            </div>

            <div className="flex items-center gap-1.5 flex-wrap">
              {TICKER_ORDER.map(item => {
                const isInv = RAW_DB[item].isInverse;
                const isSelected = ticker === item;
                return (
                  <button
                    key={item}
                    onClick={() => setTicker(item)}
                    className={`px-2.5 py-1.5 text-xs font-bold rounded-xl transition ${
                      isSelected
                        ? (isInv ? "bg-purple-900 text-white shadow-md scale-105" : "bg-slate-900 text-white shadow-md scale-105")
                        : (isInv ? "bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100" : "bg-slate-100 text-slate-700 hover:bg-slate-200")
                    }`}
                  >
                    {item} (${(prices[item] || RAW_DB[item].regClose).toFixed(2)})
                  </button>
                );
              })}
              <button
                onClick={copyDiscordReport}
                className="ml-1 px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-sm"
              >
                {copied ? "✅ 已复制" : "📋 复制双轨战报"}
              </button>
            </div>
          </header>

          {/* 滑块与双版本雷达对照区 */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            {!cleanShot && (
              <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-4 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-bold text-slate-800">
                      {isLive ? "🟢 实时价格锚点" : "🟡 手动沙盘推演"} ({ticker})
                    </span>
                    <span className="text-lg font-mono font-bold text-indigo-600">${curP.toFixed(2)}</span>
                  </div>
                  <input
                    type="range"
                    min={cfg.minP}
                    max={cfg.maxP}
                    step={cfg.step}
                    value={curP}
                    onChange={(e) => updatePriceManual(parseFloat(e.target.value))}
                    className="w-full accent-indigo-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[11px] text-slate-400 font-mono mt-1 mb-3">
                    <span>${cfg.minP.toFixed(1)}</span>
                    <button onClick={() => setIsLive(true)} className="text-emerald-600 font-bold underline">
                      点此恢复实时自动同步
                    </button>
                    <span>${cfg.maxP.toFixed(1)}</span>

                  </text>

                  <line x1={intradayData.xOf(intradayData.nowIdx)} y1={intradayData.PAD_T} x2={intradayData.xOf(intradayData.nowIdx)} y2={intradayData.H - intradayData.PAD_B} stroke="#EF4444" strokeDasharray="5 3" strokeWidth="1.8" />
                  <line x1={intradayData.xOf(12)} y1={intradayData.PAD_T} x2={intradayData.xOf(12)} y2={intradayData.H - intradayData.PAD_B} stroke="#6366F1" strokeDasharray="4 4" strokeWidth="1.4" />

                  <polyline fill="none" stroke="#10B981" strokeWidth={intraScenario === "B" ? "3.2" : "1.3"} strokeDasharray="4 4" opacity={intraScenario === "B" ? "1" : "0.38"} points={intradayData.pathB.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#F97316" strokeWidth={intraScenario === "C" ? "3.2" : "1.3"} strokeDasharray="4 4" opacity={intraScenario === "C" ? "1" : "0.38"} points={intradayData.pathC.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#38BDF8" strokeWidth={intraScenario === "A" ? "3.4" : "1.5"} strokeDasharray="7 4" opacity={intraScenario === "A" ? "1" : "0.42"} points={intradayData.pathA.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />
                  <polyline fill="none" stroke="#F8FAFC" strokeWidth="2.8" points={intradayData.pastPts.map(d => `${intradayData.xOf(d[0])},${intradayData.yOf(d[1])}`).join(" ")} />

                  <circle cx={intradayData.xOf(intradayData.nowIdx)} cy={intradayData.yOf(curP)} r="6" fill="#EF4444" stroke="#FEF2F2" strokeWidth="2" />
                  <g transform={`translate(${intradayData.xOf(intradayData.nowIdx)}, ${intradayData.yOf(curP) - 22})`}>
                    <rect x="-68" y="-12" width="136" height="20" rx="5" fill="#0F172A" stroke="#EF4444" strokeWidth="1.2" opacity="0.92" />
                    <text x="0" y="2" textAnchor="middle" fontSize="11" fontWeight="bold" fill="#FCA5A5" className="font-mono">
                      当前锚点: ${curP.toFixed(2)}
                    </text>
                  </g>

                  {intradayData.slots.map((lbl, idx) => (
                    <text
                      key={idx}
                      x={intradayData.xOf(idx)}
                      y={intradayData.H - 10}
                      textAnchor="middle"
                      fontSize="10.5"
                      fontWeight={lbl === "NOW" || lbl === "22:30" ? "bold" : "normal"}
                      fill={lbl === "NOW" ? "#EF4444" : (lbl === "22:30" ? "#818CF8" : "#64748B")}
                      className="font-mono"
                    >
                      {lbl}
                    </text>
                  ))}
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
