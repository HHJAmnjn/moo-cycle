      const [cycleEngine, setCycleEngine] = useState("dual");
      const [intraScenario, setIntraScenario] = useState("A");
      const [cleanShot, setCleanShot] = useState(false);
      const [copied, setCopied] = useState(false);
      const [nowClock, setNowClock] = useState(new Date());

      useEffect(() => {
        const t = setInterval(() => setNowClock(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        if (!isAuthed) return;
        if (!isLive) {
          setLiveStatus("手动沙盘推演模式");
          return;
        }
        let isMounted = true;
        const syncQuotes = async () => {
          if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            try {
              const localRes = await fetch("./live_price.json?t=" + Date.now(), { cache: "no-store" });
              if (localRes.ok) {
                const data = await localRes.json();
                if (data && data.prices && isMounted) {
                  setPrices(prev => ({ ...prev, ...data.prices }));
                  setCustomBaseTheo(null);
                  setLiveStatus(`OpenD 本地实时 (${data.ts})`);
                  return;
                }
              }
            } catch (e) {}
          }
          try {
            const newP = {};
            await Promise.all(TICKER_ORDER.map(async (sym) => {
              const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d&includePrePost=true`;
              const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
              ];
              for (const pUrl of proxies) {
                try {
                  const r = await fetch(pUrl);
                  if (!r.ok) continue;
                  const j = await r.json();
                  const meta = j?.chart?.result?.[0]?.meta;
                  const quoteIndicators = j?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
                  if (meta) {
                    let latest = meta.regularMarketPrice;
                    if (Array.isArray(quoteIndicators)) {
                      for (let k = quoteIndicators.length - 1; k >= 0; k--) {
                        if (quoteIndicators[k] !== null && quoteIndicators[k] > 0) {
                          latest = quoteIndicators[k];
                          break;
                        }
                      }
                    }
                    if (latest && latest > 0) newP[sym] = parseFloat(latest.toFixed(2));
                    break;
                  }
                } catch (innerErr) {}
              }
            }));
            if (Object.keys(newP).length > 0 && isMounted) {
              setPrices(prev => ({ ...prev, ...newP }));
              setCustomBaseTheo(null);
              const ts = new Date().toLocaleTimeString("zh-CN", { hour12: false });
              setLiveStatus(`云端公网实时 (${ts})`);
            }
          } catch (err) {
            if (isMounted) setLiveStatus("云端信号同步中");
          }
        };
        syncQuotes();
        const id = setInterval(syncQuotes, 8000);
        return () => { isMounted = false; clearInterval(id); };
      }, [isLive, isAuthed]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === ACCESS_PIN) {
          try { localStorage.setItem(AUTH_STORAGE_KEY, ACCESS_PIN); } catch (err) {}
          setIsAuthed(true);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const handleLogout = () => {
        try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (err) {}
        setIsAuthed(false);
        setPinInput("");
      };

      const cfg = RAW_DB[ticker];
      const curP = prices[ticker] || cfg.regClose;
      const activeTheoNow = customBaseTheo || cfg.theoToday;

      const updatePriceManual = (val, baseTheo = null) => {
        setIsLive(false);
        setCustomBaseTheo(baseTheo);
        setPrices(prev => ({ ...prev, [ticker]: val }));
      };

      const metrics = useMemo(() => {
        const spreadRatio = (curP / activeTheoNow) - 1.0;
        const spreadPct = spreadRatio * 100;

        const theoMap = Object.fromEntries(cfg.theoCurve);
        const calcPdfReversion = (dtLabel) => {
          const baseT = theoMap[dtLabel] || activeTheoNow;
          const w = cfg.reversionWeights[dtLabel] ?? 0.1;
          return baseT * (1.0 + spreadRatio * w);
        };

        const pdfTrack = {
          pivot: curP * cfg.mmRadarRatios.pivot,
          p1116: calcPdfReversion("11/16"),
          p1118: calcPdfReversion("11/18"),
          p1123: calcPdfReversion("11/23"),
          p1126: calcPdfReversion("11/26"),
          p1203: calcPdfReversion("12/03"),
          p1210: calcPdfReversion("12/10"),
          p1221: calcPdfReversion("12/21"),
          p1231: calcPdfReversion("12/31"),
          neckLow: curP * cfg.mmRadarRatios.neck[0],
          neckHigh: curP * cfg.mmRadarRatios.neck[1],
          sweepLow: curP * cfg.mmRadarRatios.sweep[0],
          sweepHigh: curP * cfg.mmRadarRatios.sweep[1]
        };

        const dFactor = 1.0 - cfg.betaDecay;
        const lockedTrack = {
          pivot: curP * 0.945,
          p1116: (theoMap["11/16"] * dFactor) * 0.94,
          p1118: (theoMap["11/18"] * dFactor) * 0.936,
          p1123: (theoMap["11/23"] * dFactor),
          p1126: (theoMap["11/26"] * dFactor),
          p1203: (theoMap["12/03"] * dFactor),
          p1210: (theoMap["12/10"] * dFactor) * 0.974,
          p1221: (theoMap["12/21"] * dFactor),
          p1231: (theoMap["12/31"] * dFactor),
          neckLow: theoMap["11/11"] * 0.925,
          neckHigh: theoMap["11/11"] * 0.945,
          sweepLow: theoMap["11/11"] * 0.975,
          sweepHigh: theoMap["11/11"] * 1.000
        };

        return { spreadPct, pdfTrack, lockedTrack };
      }, [ticker, curP, activeTheoNow, cfg]);

      const intradayData = useMemo(() => {
        const W = 1000, H = 350, PAD_L = 64, PAD_R = 28, PAD_T = 28, PAD_B = 34;
        const plotW = W - PAD_L - PAD_R;
        const seed = cfg.intradaySeed;

        const slots = [
          "08:00", "08:30", "09:30", "11:00", "12:30", "14:00", "15:00", "15:45",
          "NOW",   "18:00", "20:00", "21:30", "22:30", "23:00", "00:30", "02:30", "04:00", "05:00"
        ];
        const xOf = (idx) => PAD_L + (idx / (slots.length - 1)) * plotW;
        const nowIdx = 8;

        const vwap = curP * seed.vwapRatio;
        const demandLow = curP * seed.demandLowRatio;
        const demandHigh = curP * seed.demandHighRatio;
        const microSup = curP * seed.microSupRatio;
        const majorSupLow = curP * seed.majorSupLow;
        const majorSupHigh = curP * seed.majorSupHigh;
        const stopHuntLow = demandLow * 0.982;

        const pastPts = seed.pastRatios.map((r, i) => [i, curP * r]);
        pastPts.push([nowIdx, curP]);

        let pathA, pathB, pathC;
        if (!cfg.isInverse) {
          pathA = [
            [nowIdx, curP],
            [9,  microSup * 0.998],
            [10, curP * 0.992],
            [11, microSup * 1.002],
            [12, curP * 0.985],
            [13, (demandLow + demandHigh) * 0.5],
            [14, vwap * 1.002],
            [15, majorSupLow * 1.002],
            [16, majorSupHigh * 0.998],
            [17, majorSupLow * 1.005]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  microSup * 1.005],
            [10, microSup * 1.002],
            [11, microSup * 1.010],
            [12, curP * 0.996],
            [13, vwap * 1.005],
            [14, majorSupLow * 1.002],
            [15, majorSupHigh * 1.008],
            [16, majorSupHigh * 1.018],
            [17, majorSupHigh * 1.012]
          ];
          pathC = [
            [nowIdx, curP],
            [9,  curP * 0.994],
            [10, curP * 0.985],
            [11, demandHigh * 1.002],
            [12, demandLow * 0.995],
            [13, stopHuntLow],
            [14, demandHigh * 1.002],
            [15, vwap * 0.998],
            [16, microSup * 1.004],
            [17, vwap * 1.002]
          ];
        } else {
          pathA = [
            [nowIdx, curP],
            [9,  curP * 0.992],
            [10, demandLow * 1.002],
            [11, vwap * 1.002],
            [12, microSup * 1.005],
            [13, majorSupLow * 0.998],
            [14, majorSupLow * 1.012],
            [15, majorSupHigh * 0.998],
            [16, majorSupLow * 1.005],
            [17, majorSupHigh * 1.002]
          ];
          pathB = [
            [nowIdx, curP],
            [9,  demandHigh * 0.995],
            [10, stopHuntLow],
            [11, demandLow * 1.002],
            [12, curP * 1.005],
            [13, vwap * 0.998],
            [14, curP * 1.002],
            [15, vwap * 1.002],
            [16, vwap * 1.005],
            [17, vwap * 1.000]
          ];
          pathC = [
            [nowIdx, curP],
            [9,  vwap * 1.005],
            [10, microSup * 1.012],
            [11, majorSupLow * 1.008],
            [12, majorSupHigh * 1.015],
            [13, majorSupHigh * 1.035],
            [14, majorSupHigh * 1.022],
            [15, majorSupHigh * 1.028],
            [16, majorSupHigh * 1.040],
            [17, majorSupHigh * 1.035]
          ];
        }

        const allVals = [
          ...pastPts.map(d => d[1]),
          ...pathA.map(d => d[1]),
          ...pathB.map(d => d[1]),
          ...pathC.map(d => d[1]),
          stopHuntLow
        ];
        const minY = Math.min(...allVals) * 0.985;
        const maxY = Math.max(...allVals) * 1.015;
        const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * (H - PAD_T - PAD_B);

        return {
          W, H, PAD_L, PAD_R, PAD_T, PAD_B, slots, nowIdx, xOf, yOf, minY, maxY,
          vwap, demandLow, demandHigh, microSup, majorSupLow, majorSupHigh, stopHuntLow,
          pastPts, pathA, pathB, pathC
        };
      }, [ticker, curP, cfg]);

      const chartData = useMemo(() => {
        const W = 1000, H1 = 350, H2 = 165, PAD_L = 62, PAD_R = 24, PAD_T = 24, PAD_B = 28;
        const plotW = W - PAD_L - PAD_R;
        const allLabels = [
          "08/31","09/07","09/14","09/21","09/28","10/05","10/12","10/19","10/26","10/30","11/02","11/05","11/09","11/10",
          "11/11","11/16","11/18","11/23","11/26","12/03","12/10","12/21","12/31"
        ];
        const xOf = (label) => {
          const idx = allLabels.indexOf(label);
          const safeIdx = idx === -1 ? 6 : idx;
          return PAD_L + (safeIdx / (allLabels.length - 1)) * plotW;
        };

        const histPts = [...cfg.hist, ["11/11", curP]];
        const P = metrics.pdfTrack;
        const L = metrics.lockedTrack;

        const futPdf = [
          ["11/11", curP],
          ["11/16", P.p1116],
          ["11/18", P.p1118],
          ["11/23", P.p1123],
          ["11/26", P.p1126],
          ["12/03", P.p1203],
          ["12/10", P.p1210],
          ["12/21", P.p1221],
          ["12/31", P.p1231]
        ];

        const futLocked = [
          ["11/11", curP],
          ["11/16", curP * 0.35 + L.p1118 * 0.65],
          ["11/18", L.p1118],
          ["11/23", L.p1123],
          ["11/26", L.p1126],
          ["12/03", L.p1203],
          ["12/10", L.p1210],
          ["12/21", L.p1221],
          ["12/31", L.p1231]
        ];

        const allPrices = [
          ...histPts.map(d => d[1]),
          ...futPdf.map(d => d[1]),
          ...futLocked.map(d => d[1]),
          ...cfg.theoCurve.map(d => d[1]),
          P.sweepHigh,
          L.p1126
        ];
        const minP = Math.min(...allPrices) * 0.90;
        const maxP = Math.max(...allPrices) * 1.06;
        const y1Of = (p) => PAD_T + (1 - (p - minP) / (maxP - minP)) * (H1 - PAD_T - PAD_B);

        const allPct = allPrices.map(p => ((p / curP) - 1) * 100);
        const minPct = Math.min(...allPct, -35);
        const maxPct = Math.max(...allPct, 45);
        const y2Of = (pct) => 16 + (1 - (pct - minPct) / (maxPct - minPct)) * (H2 - 44);

        return { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futPdf, futLocked, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct };
      }, [cfg, curP, metrics]);

      const copyDiscordReport = () => {
        const P = metrics.pdfTrack;
        const L = metrics.lockedTrack;
        const text = `📊 **【${ticker} 原始PDF周期算法 V3.5 × 日内四步作战推演战报】**\n` +
          `● **实盘 vs 10/14原始标尺**: 最新锚点 $${curP.toFixed(2)} | 今日PDF理论基准 $${activeTheoNow.toFixed(2)} (实时乖离 ${metrics.spreadPct >= 0 ? "+" : ""}${metrics.spreadPct.toFixed(1)}%)\n` +
          `● **🗺️ [日内24H四步作战流程图]**: ①盘前微阻 $${intradayData.microSup.toFixed(2)} ➔ ②22:30开盘需求区 $${intradayData.demandLow.toFixed(2)}~$${intradayData.demandHigh.toFixed(2)} ➔ ③攻克VWAP $${intradayData.vwap.toFixed(2)} ➔ ④尾盘冲击阻力带 $${intradayData.majorSupLow.toFixed(2)}~$${intradayData.majorSupHigh.toFixed(2)}\n` +
          `● **💎 [原始PDF乖离均值回归轨]**: 日内转弱位 $${P.pivot.toFixed(2)} ➔ 11/18中继 $${P.p1118.toFixed(2)} ➔ **11/26黄金坑 $${P.p1126.toFixed(2)}** ➔ 12/10主升峰 $${P.p1210.toFixed(2)}\n` +
          `● **🛡️ [3x杠杆磨损锁锚对照轨]**: 11/18中继 $${L.p1118.toFixed(2)} ➔ **11/26磨损极限右脚 $${L.p1126.toFixed(2)}** ➔ 12/10扣磨损峰 $${L.p1210.toFixed(2)}`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      if (!isAuthed) {
        return (
          <div className="min-h-screen bg-[#0F172A] flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-700/80 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-2xl mb-1">
                  🛡️
                </div>
                <h1 className="text-xl font-bold text-white tracking-tight">
                  【原始PDF周期算法 × 实时推演终端】
                </h1>
                <p className="text-xs text-slate-400 font-mono">
                  VIP 内部量化监控终端 · 请输入访问口令解锁
                </p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
                    placeholder="请输入访问密码..."
                    autoFocus
                    className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white text-center font-mono text-lg tracking-widest focus:outline-none focus:border-indigo-500 transition"
                  />
                  {pinError && (
                    <p className="text-xs text-rose-400 text-center mt-2 font-mono">
                      ❌ 访问口令错误，请核对后重试
                    </p>
                  )}
                </div>
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition shadow-lg shadow-indigo-600/30"
                >
                  🔓 验证并进入实时终端
                </button>
              </form>
            </div>
          </div>
        );
      }

      const { W, H1, H2, PAD_L, PAD_R, allLabels, histPts, futPdf, futLocked, xOf, y1Of, y2Of, minP, maxP, minPct, maxPct } = chartData;
      const nowX = xOf("11/11");
      const shortEndX = xOf("11/18");
      const activeIntraPath = intraScenario === "A" ? intradayData.pathA : (intraScenario === "B" ? intradayData.pathB : intradayData.pathC);

      return (
        <div className="min-h-screen p-2.5 md:p-5 max-w-[1440px] mx-auto space-y-4">
          <header className="flex flex-wrap justify-between items-center bg-white px-4 md:px-6 py-3.5 rounded-2xl shadow-sm border border-slate-200 gap-3">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => { setIsLive(!isLive); setCustomBaseTheo(null); }}
                  className={`px-2.5 py-1 text-xs font-bold rounded-lg border transition cursor-pointer ${
                    isLive
                      ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                      : "bg-amber-50 text-amber-700 border-amber-300"
                  }`}
                >
                  {isLive ? `🟢 ${liveStatus}` : `🟡 ${liveStatus} (点此恢复自动)`}
                </button>
                <span className="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200">
                  📐 10/14 原始PDF母版 + 日内24H四步流程图
                </span>
                <h1 className="text-base md:text-xl font-bold text-slate-900 tracking-tight">
                  {ticker} - {cfg.name}
                </h1>
              </div>

              <div className="flex items-center gap-2 mt-2 flex-wrap">
                {[
                  { id: "both", label: "⚡ 日内+宏观双擎同屏" },
                  { id: "intraday", label: "📈 仅看日内24H四步推演" },
                  { id: "macro", label: "📅 仅看原始PDF跨月推演图" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setViewMode(tab.id)}
                    className={`px-2.5 py-1 text-xs font-bold rounded-lg transition ${
                      viewMode === tab.id ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
                <button
                  onClick={() => setCleanShot(!cleanShot)}
                  className={`px-2.5 py-1 text-xs font-bold rounded-lg border transition ${
                    cleanShot
                      ? "bg-rose-600 text-white border-rose-700 shadow"
                      : "bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100"
                  }`}
                >
                  {cleanShot ? "📸 退出群聊截图模式" : "📸 群聊截图模式"}
                </button>
                <button
                  onClick={handleLogout}
                  className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 transition"
                >
                  🔒 锁定
                </button>
              </div>
            </div>

            <div className="flex items-center gap-1.5 flex-wrap">
              {TICKER_ORDER.map(item => {
                const isInv = RAW_DB[item].isInverse;
                const isSelected = ticker === item;
                return (
                  <button
                    key={item}
                    onClick={() => { setTicker(item); setCustomBaseTheo(null); }}
                    className={`px-2.5 py-1.5 text-xs font-bold rounded-xl transition ${
                      isSelected
                        ? (isInv ? "bg-purple-900 text-white shadow-md scale-105" : "bg-slate-900 text-white shadow-md scale-105")
                        : (isInv ? "bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100" : "bg-slate-100 text-slate-700 hover:bg-slate-200")
                    }`}
                  >
                    {item} (${(prices[item] || RAW_DB[item].regClose).toFixed(2)})
                  </button>
                );
              })}
              <button
                onClick={copyDiscordReport}
                className="ml-1 px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-sm"
              >
                {copied ? "✅ 已复制" : "📋 复制完整战报"}
              </button>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            {!cleanShot && (
              <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-4 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-bold text-slate-800">
                      {isLive ? "🟢 实时价格锚点" : "🟡 手动沙盘验证"} ({ticker})
                    </span>
                    <span className="text-lg font-mono font-bold text-indigo-600">${curP.toFixed(2)}</span>
                  </div>
                  <input
                    type="range"
                    min={cfg.minP}
                    max={cfg.maxP}
                    step={cfg.step}
                    value={curP}
                    onChange={(e) => updatePriceManual(parseFloat(e.target.value), customBaseTheo)}
                    className="w-full accent-indigo-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[11px] text-slate-400 font-mono mt-1 mb-3">
                    <span>${cfg.minP.toFixed(1)}</span>
                    <button onClick={() => { setIsLive(true); setCustomBaseTheo(null); }} className="text-emerald-600 font-bold underline">
                      点此恢复公网实时自动同步
                    </button>
                    <span>${cfg.maxP.toFixed(1)}</span>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {cfg.presets.map((p, i) => (
                    <button
                      key={i}
                      onClick={() => updatePriceManual(p.val, p.baseTheo)}
                      className={`p-2 text-xs rounded-xl border font-mono font-semibold hover:opacity-85 transition ${p.style}`}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

                <svg viewBox={`0 0 ${W} ${H1 + H2 + 20}`} className="w-full h-auto select-none">
                  <rect x={PAD_L} y={20} width={W - PAD_L - PAD_R} height={H1 - 45} fill="#FAFAFA" stroke="#CBD5E1" strokeWidth="1" />
                  <rect x={xOf("10/19")} y={20} width={xOf("10/26") - xOf("10/19")} height={H1 - 45} fill="#E2E8F0" opacity="0.55" />
                  <rect x={xOf("10/30")} y={20} width={xOf("11/02") - xOf("10/30")} height={H1 - 45} fill="#FEE2E2" opacity="0.55" />
                  <rect x={xOf("11/23")} y={20} width={xOf("11/26") - xOf("11/23") + 18} height={H1 - 45} fill="#DBEAFE" opacity="0.65" />
                  <rect x={xOf("12/03")} y={20} width={xOf("12/10") - xOf("12/03") + 15} height={H1 - 45} fill="#FEF9C3" opacity="0.65" />

                  {[0, 0.25, 0.5, 0.75, 1].map((r, idx) => {
                    const py = 20 + r * (H1 - 45);
                    const pVal = maxP - r * (maxP - minP);
                    return (
                      <g key={idx}>
                        <line x1={PAD_L} y1={py} x2={W - PAD_R} y2={py} stroke="#CBD5E1" strokeDasharray="4 4" strokeWidth="0.8" />
                        <text x={PAD_L - 8} y={py + 4} textAnchor="end" fontSize="11" fill="#475569" className="font-mono">
                          ${pVal.toFixed(1)}
                        </text>
                      </g>
                    );
                  })}

                  <line x1={nowX} y1={20} x2={nowX} y2={H1 - 25} stroke="#DC2626" strokeDasharray="6 3" strokeWidth="1.8" />

                  <polyline
                    fill="none"
                    stroke="#94A3B8"
                    strokeWidth="2.0"
                    strokeDasharray="3 3"
                    points={cfg.theoCurve.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")}
                  />

                  <polyline
                    fill="none"
                    stroke="#0F172A"
                    strokeWidth="2.8"
                    points={histPts.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")}
                  />

                  <rect
                    x={nowX}
                    y={y1Of(metrics.pdfTrack.sweepHigh)}
                    width={shortEndX - nowX}
                    height={Math.max(3, y1Of(metrics.pdfTrack.sweepLow) - y1Of(metrics.pdfTrack.sweepHigh))}
                    fill="#FB7185"
                    opacity="0.30"
                  />
                  <line x1={nowX} y1={y1Of(metrics.pdfTrack.neckHigh)} x2={shortEndX} y2={y1Of(metrics.pdfTrack.neckHigh)} stroke="#E11D48" strokeWidth="1.5" />
                  <line x1={nowX} y1={y1Of(metrics.pdfTrack.pivot)} x2={shortEndX} y2={y1Of(metrics.pdfTrack.pivot)} stroke="#D97706" strokeDasharray="4 3" strokeWidth="1.4" />

                  {(cycleEngine === "dual" || cycleEngine === "locked") && cfg.betaDecay > 0 && (
                    <g>
                      <polyline
                        fill="none"
                        stroke="#7C3AED"
                        strokeWidth={cycleEngine === "locked" ? "3.2" : "2.2"}
                        strokeDasharray="5 3"
                        points={futLocked.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")}
                      />
                      {[
                        { dt: "11/18", val: metrics.lockedTrack.p1118, label: `磨损中继: $${metrics.lockedTrack.p1118.toFixed(1)}`, dy: 18 },
                        { dt: "11/26", val: metrics.lockedTrack.p1126, label: `磨损底: $${metrics.lockedTrack.p1126.toFixed(2)}`, dy: 20 },
                        { dt: "12/10", val: metrics.lockedTrack.p1210, label: `磨损峰: $${metrics.lockedTrack.p1210.toFixed(1)}`, dy: 18 }
                      ].map((nd, i) => (
                        <g key={i}>
                          <circle cx={xOf(nd.dt)} cy={y1Of(nd.val)} r="4.5" fill="#7C3AED" />
                          <text x={xOf(nd.dt)} y={y1Of(nd.val) + nd.dy} textAnchor="middle" fontSize="10.5" fontWeight="bold" fill="#6D28D9" className="font-mono">
                            {nd.label}
                          </text>
                        </g>
                      ))}
                    </g>
                  )}

                  {(cycleEngine === "dual" || cycleEngine === "pdf") && (
                    <g>
                      <polyline
                        fill="none"
                        stroke="#1D4ED8"
                        strokeWidth="3.2"
                        strokeDasharray="8 4"
                        points={futPdf.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ")}
                      />
                      {[
                        { dt: "11/18", val: metrics.pdfTrack.p1118, label: `11-18: $${metrics.pdfTrack.p1118.toFixed(1)}`, color: "#7C3AED", dy: -12 },
                        { dt: "11/26", val: metrics.pdfTrack.p1126, label: `11-26: $${metrics.pdfTrack.p1126.toFixed(2)}`, color: "#1E40AF", dy: -12 },
                        { dt: "12/10", val: metrics.pdfTrack.p1210, label: `12-10: $${metrics.pdfTrack.p1210.toFixed(1)}`, color: "#059669", dy: -12 }
                      ].map((nd, i) => (
                        <g key={i}>
                          <circle cx={xOf(nd.dt)} cy={y1Of(nd.val)} r="5.5" fill={nd.color} stroke="#FFFFFF" strokeWidth="1.5" />
                          <text x={xOf(nd.dt)} y={y1Of(nd.val) + nd.dy} textAnchor="middle" fontSize="11" fontWeight="bold" fill={nd.color} className="font-mono">
                            {nd.label}
                          </text>
                        </g>
                      ))}
                    </g>
                  )}

                  <circle cx={nowX} cy={y1Of(curP)} r="6" fill="#DC2626" stroke="#FFFFFF" strokeWidth="1.5" />
                  <text x={nowX - 8} y={y1Of(curP) - 12} textAnchor="end" fontSize="11.5" fontWeight="bold" fill="#DC2626" className="font-mono">
                    当前实盘锚点: ${curP.toFixed(2)}
                  </text>

                  <g transform={`translate(0, ${H1 + 5})`}>
                    <rect x={PAD_L} y={10} width={W - PAD_L - PAD_R} height={H2 - 35} fill="#FAFAFA" stroke="#CBD5E1" strokeWidth="1" />
                    <line x1={PAD_L} y1={y2Of(0)} x2={W - PAD_R} y2={y2Of(0)} stroke="#64748B" strokeDasharray="3 3" strokeWidth="1" />
                    <line x1={nowX} y1={10} x2={nowX} y2={H2 - 25} stroke="#DC2626" strokeDasharray="6 3" strokeWidth="1.8" />

                    {[minPct * 0.5, 0, maxPct * 0.5].map((pctVal, idx) => {
                      const py = y2Of(pctVal);
                      return (
                        <g key={idx}>
                          <text x={PAD_L - 8} y={py + 4} textAnchor="end" fontSize="10.5" fill="#475569" className="font-mono">
                            {pctVal >= 0 ? `+${pctVal.toFixed(0)}%` : `${pctVal.toFixed(0)}%`}
                          </text>
                        </g>
                      );
                    })}

                    <polyline
                      fill="none"
                      stroke="#334155"
                      strokeWidth="1.8"
                      points={histPts.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")}
                    />
                    {(cycleEngine === "dual" || cycleEngine === "locked") && cfg.betaDecay > 0 && (
                      <polyline
                        fill="none"
                        stroke="#7C3AED"
                        strokeWidth="2.0"
                        strokeDasharray="4 3"
                        points={futLocked.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")}
                      />
                    )}
                    {(cycleEngine === "dual" || cycleEngine === "pdf") && (
                      <polyline
                        fill="none"
                        stroke="#1D4ED8"
                        strokeWidth="2.6"
                        strokeDasharray="7 4"
                        points={futPdf.map(d => `${xOf(d[0])},${y2Of(((d[1] / curP) - 1) * 100)}`).join(" ")}
                      />
                    )}

                    {allLabels.filter((_, idx) => idx % 2 === 0).map((lbl, i) => (
                      <text key={i} x={xOf(lbl)} y={H2 - 6} textAnchor="middle" fontSize="10.5" fill="#334155" className="font-mono">
                        {lbl}
                      </text>
                    ))}
                  </g>
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
