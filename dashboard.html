    function buildAuthenticDailyHist(keyAnchors, microWaveSeed = 1.0) {
      const anchorDays = keyAnchors.map(([dt, val]) => [dayOf(dt), val]);
      return HIST_DATES.map((dt, idx) => {
        const d = dayOf(dt);
        for (let k = 0; k < keyAnchors.length; k++) {
          if (keyAnchors[k][0] === dt) return [dt, keyAnchors[k][1]];
        }
        let vInterp = anchorDays[anchorDays.length - 1][1];
        for (let k = 0; k < anchorDays.length - 1; k++) {
          const [d0, v0] = anchorDays[k];
          const [d1, v1] = anchorDays[k + 1];
          if (d >= d0 && d <= d1) {
            const r = (d - d0) / Math.max(1, d1 - d0);
            const baseLinear = v0 + (v1 - v0) * r;
            const edgeDamp = Math.sin(Math.PI * r);
            const wiggle = Math.sin(idx * 1.9 + microWaveSeed) * Math.abs(v1 - v0) * 0.14 * edgeDamp;
            vInterp = baseLinear + wiggle;
            break;
          }
        }
        return [dt, parseFloat(vInterp.toFixed(2))];
      });
    }

    function getTheoAt(theoCurve, dtLabel) {
      const targetDay = dayOf(dtLabel);
      for (let i = 0; i < theoCurve.length; i++) {
        if (theoCurve[i][0] === dtLabel) return theoCurve[i][1];
      }
      for (let i = 0; i < theoCurve.length - 1; i++) {
        const d0 = dayOf(theoCurve[i][0]), v0 = theoCurve[i][1];
        const d1 = dayOf(theoCurve[i + 1][0]), v1 = theoCurve[i + 1][1];
        if (targetDay >= d0 && targetDay <= d1) {
          const r = (targetDay - d0) / Math.max(1, d1 - d0);
          return v0 + (v1 - v0) * r;
        }
      }
      return theoCurve[theoCurve.length - 1][1];
    }

    function resolveYCollisions(items, minGap, minYBound, maxYBound) {
      const sorted = [...items].sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 5; pass++) {
        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i].y - sorted[i - 1].y < minGap) {
            const mid = (sorted[i].y + sorted[i - 1].y) * 0.5;
            sorted[i - 1].y = Math.max(minYBound, mid - minGap * 0.5);
            sorted[i].y = Math.min(maxYBound, mid + minGap * 0.5);
          }
        }
      }
      return sorted;
    }

    function resolve2DBoxCollisions(boxes, minYBound, maxYBound, minXBound = 66, maxXBound = 970) {
      for (let b of boxes) {
        b.bx = Math.max(minXBound + b.w * 0.5, Math.min(maxXBound - b.w * 0.5, b.bx));
        b.by = Math.max(minYBound, Math.min(maxYBound, b.by));
      }
      for (let pass = 0; pass < 6; pass++) {
        for (let i = 0; i < boxes.length; i++) {
          for (let j = i + 1; j < boxes.length; j++) {
            const a = boxes[i], b = boxes[j];
            const dx = Math.abs(a.bx - b.bx);
            const dy = Math.abs(a.by - b.by);
            const minW = (a.w + b.w) * 0.5 + 8;
            const minH = 22;
            if (dx < minW && dy < minH) {
              const pushY = (minH - dy) * 0.6 + 2;
              if (a.by <= b.by) {
                a.by = Math.max(minYBound, a.by - pushY);
                b.by = Math.min(maxYBound, b.by + pushY);
              } else {
                a.by = Math.min(maxYBound, a.by + pushY);
                b.by = Math.max(minYBound, b.by - pushY);
              }
            }
          }
        }
      }
      return boxes;
    }

          res.push({
            tIdx: res.length + 1,
            calOffset,
            mmdd: `${mm}/${dd}`,
            wk: wkNames[day]
          });
        }
      }

    }

      const curQuarter = Math.floor((curMonth - 1) / 3) + 1;
      const realMmDd = `${String(curMonth).padStart(2,"0")}/${String(curDay).padStart(2,"0")}`;

      let exactMin = 0;
      if (h >= 8) exactMin = (h - 8) * 60 + m + (s || 0) / 60;
      else exactMin = (h + 16) * 60 + m + (s || 0) / 60;
      exactMin = Math.max(0, Math.min(1439, exactMin));

          nowFloatIdx = i + (exactMin - m0) / Math.max(1, m1 - m0);

        }

      const openMin = 870;

      let countdownText = "🔥 美股正盘交易进行中";
      if (exactMin < openMin) {
        const diffSec = Math.max(0, Math.floor((openMin - exactMin) * 60));
        const dh = Math.floor(diffSec / 3600);
        const dm = Math.floor((diffSec % 3600) / 60);

        label: timeInfo ? timeInfo.realMmDd : "11/17",
        subLabel: "T+0(今日)",
        p: curP,
        isPast: true
      });

      const bandHalfWidth = is3x ? 0.046 : 0.015;
      const anchorDayNum = dayOf(state.anchorDt);
      const lastTheoDt = cfg.theoCurve[cfg.theoCurve.length - 1][0];
      const lastTheoDay = dayOf(lastTheoDt);

      const future5Days = next5Days.map((dInfo, idx) => {
        const step = idx + 1;
        const mappedModelDay = anchorDayNum + dInfo.calOffset;
        let modelCenter = mappedModelDay > lastTheoDay ? calcSysRev(lastTheoDt) : curP;
        for (let k = 0; k < cfg.theoCurve.length - 1; k++) {
          const d0 = dayOf(cfg.theoCurve[k][0]), d1 = dayOf(cfg.theoCurve[k + 1][0]);
          if (mappedModelDay >= d0 && mappedModelDay <= d1) {
            const r = (mappedModelDay - d0) / Math.max(1, d1 - d0);
            const t0 = calcSysRev(cfg.theoCurve[k][0]);
            const t1 = calcSysRev(cfg.theoCurve[k + 1][0]);
            modelCenter = t0 + (t1 - t0) * r;
            break;
          }
        }

        let microAdjustedP = modelCenter;
        if (isExtremeBarrierBreached) {
          const pulseRatio = Math.min(1.0, step * 0.24);
          microAdjustedP = curP + (activeTheoNow - curP) * pulseRatio;
        } else if (!cfg.isInverse && curP < curVwap) {
          const vwapDrag = step === 1 ? (curVwap - curP) * 0.25 : -Math.abs(curVwap - curP) * 0.18 * (step / 5);
          microAdjustedP = modelCenter + vwapDrag;
        } else if (cfg.isInverse && curP >= curVwap) {
          microAdjustedP = modelCenter * (1 + 0.008 * step);
        }

        const dailyCeiling = Math.max(microAdjustedP, modelCenter) * (1 + bandHalfWidth * (1 + step * 0.06));
        const dailyFloor = Math.min(microAdjustedP, modelCenter) * (1 - bandHalfWidth * (1 + step * 0.06));

        const gammaUpper = dailyCeiling * (is3x ? 1.018 : 1.006);
        const gammaLower = dailyFloor * (is3x ? 0.982 : 0.994);

        let microDriverTag = "";
        if (isExtremeBarrierBreached) {
          microDriverTag = "🚨 负乖离红线主导：空头回补强行弹射";
        } else if (!cfg.isInverse && curP < curVwap) {
          microDriverTag = step === 1
            ? `🟡 VWAP反压主导：反抽 $${Math.min(curVwap, dailyCeiling).toFixed(2)} 受阻`
            : (step === 3 ? "🎯 周期中继窗：回撤空单减半锁利" : "🔴 均值回归主导：阶梯向下寻底");
        } else if (cfg.isInverse) {
          microDriverTag = step === 3 ? "💰 周期中继兑现：多单分批止盈50%" : "🟣 镜像买盘主导：回踩底线低吸";
        } else {
          microDriverTag = "⚡ 走廊主导：高抛天花板低吸底线";
        }

        return {
          slotIdx: 4 + step,
          tLabel: `T+${step}`,
          mmdd: dInfo.mmdd,
          wk: dInfo.wk,
          p: microAdjustedP,
          ceiling: dailyCeiling,
          floor: dailyFloor,
          gammaUpper,
          gammaLower,
          microDriverTag
        };
      });

      const W = 1000, H = 350, PAD_L = 66, PAD_R = 28, PAD_T = 36, PAD_B = 40;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const totalSlots = 9;
      const xOf = (sIdx) => PAD_L + (sIdx / totalSlots) * plotW;

      const allVals = [
        ...pastSlice.map(d => d.p),
        ...future5Days.map(d => d.ceiling),
        ...future5Days.map(d => d.floor),
        ...future5Days.map(d => d.gammaUpper),
        ...future5Days.map(d => d.gammaLower),
        curVwap
      ];
      const minY = Math.min(...allVals) * 0.985;
      const maxY = Math.max(...allVals) * 1.015;
      const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * plotH;

      let gridHtml = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * plotH;
        const pVal = maxY - r * (maxY - minY);
        gridHtml += `<line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>
                     <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="11" fill="#475569" class="font-mono font-semibold">$${pVal.toFixed(2)}</text>`;
      });

      const corridorTopPts = [[4, curP * (1 + bandHalfWidth * 0.5)], ...future5Days.map(d => [d.slotIdx, d.ceiling])];
      const corridorBotPts = [[4, curP * (1 - bandHalfWidth * 0.5)], ...future5Days.map(d => [d.slotIdx, d.floor])];
      const polygonPts = [
        ...corridorTopPts.map(d => `${xOf(d[0])},${yOf(d[1])}`),
        ...[...corridorBotPts].reverse().map(d => `${xOf(d[0])},${yOf(d[1])}`)
      ].join(" ");

      const mainPathPts = [[4, curP], ...future5Days.map(d => [d.slotIdx, d.p])];
      const gammaUpPts = [[4, curP], ...future5Days.map(d => [d.slotIdx, d.gammaUpper])];
      const gammaDnPts = [[4, curP], ...future5Days.map(d => [d.slotIdx, d.gammaLower])];

      const dayMarkersHtml = future5Days.map((d, idx) => {
        const cx = xOf(d.slotIdx);
        const cyMain = yOf(d.p);
        const cyCeil = yOf(d.ceiling);
        const cyFloor = yOf(d.floor);
        const showBox = idx === 0 || idx === 2 || idx === 4;
        const boxX = Math.min(W - PAD_R - 56, Math.max(PAD_L + 56, cx));
        return `
          <line x1="${cx}" y1="${cyCeil}" x2="${cx}" y2="${cyFloor}" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2 2"/>
          <circle cx="${cx}" cy="${cyCeil}" r="3.5" fill="#F43F5E"/>
          <text x="${cx}" y="${cyCeil - 7}" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FDA4AF" class="font-mono">顶$${d.ceiling.toFixed(1)}</text>
          <circle cx="${cx}" cy="${cyFloor}" r="3.5" fill="#10B981"/>
          <text x="${cx}" y="${cyFloor + 13}" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6EE7B7" class="font-mono">底$${d.floor.toFixed(1)}</text>
          <circle cx="${cx}" cy="${cyMain}" r="5" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5"/>
          ${showBox ? `
            <g transform="translate(${boxX}, ${cyMain + (idx % 2 === 0 ? -18 : 18)})">
              <rect x="-54" y="-10" width="108" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
              <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="#38BDF8" class="font-mono">${d.tLabel}:$${d.p.toFixed(2)}</text>
            </g>
          ` : ""}
        `;
      }).join("");

      const allSlots = [
        ...pastSlice.map(d => ({ slotIdx: d.slotIdx, top: d.label, bot: d.subLabel, isNow: d.slotIdx === 4 })),
        ...future5Days.map(d => ({ slotIdx: d.slotIdx, top: `${d.mmdd}(${d.wk})`, bot: d.tLabel, isNow: false }))
      ];

      const svgHtml = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="6" width="${xOf(4)-PAD_L}" height="24" rx="4" fill="#0F172A"/>
        <text x="${(PAD_L+xOf(4))*0.5}" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#94A3B8" class="font-mono">◀ 过去 5 个交易日真实收盘轨迹</text>
        <rect x="${xOf(4)+2}" y="6" width="${W-PAD_R-xOf(4)-2}" height="24" rx="4" fill="#1E1B4B"/>
        <text x="${(xOf(4)+W-PAD_R)*0.5}" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#A5B4FC" class="font-mono">🔮 未来 1~5 个交易日周内推演区 ▶</text>

        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${plotH}" fill="#0F172A" rx="8"/>
        <rect x="${xOf(4)}" y="${PAD_T}" width="${W-PAD_R-xOf(4)}" height="${plotH}" fill="#1E293B" opacity="0.72"/>

        ${gridHtml}

        <polygon points="${polygonPts}" fill="#6366F1" opacity="0.16"/>
        <polyline fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="5 3" points="${corridorTopPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="5 3" points="${corridorBotPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>

        <line x1="${PAD_L}" y1="${yOf(curVwap)}" x2="${W-PAD_R}" y2="${yOf(curVwap)}" stroke="#FBBF24" stroke-dasharray="6 4" stroke-width="1.5"/>
        <g transform="translate(${PAD_L + 10}, ${Math.max(PAD_T + 14, Math.min(H - PAD_B - 14, yOf(curVwap) - 12))})">
          <rect x="0" y="-10" width="235" height="18" rx="4" fill="#0F172A" stroke="#EAB308" stroke-width="1" opacity="0.9"/>
          <text x="6" y="3" font-size="9.5" font-weight="bold" fill="#FDE047" class="font-mono">🟡 周内VWAP强弱引力轴: $${curVwap.toFixed(2)}</text>
        </g>

        <line x1="${xOf(4)}" y1="${PAD_T}" x2="${xOf(4)}" y2="${H-PAD_B}" stroke="#EF4444" stroke-dasharray="5 3" stroke-width="1.8"/>

        <polyline fill="none" stroke="#34D399" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.55" points="${gammaUpPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#FB923C" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.55" points="${gammaDnPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>

        <polyline fill="none" stroke="#F8FAFC" stroke-width="2.8" stroke-linejoin="round" points="${pastSlice.map(d=>`${xOf(d.slotIdx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-dasharray="7 4" stroke-linejoin="round" points="${mainPathPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>

        <circle cx="${xOf(4)}" cy="${yOf(curP)}" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
        ${dayMarkersHtml}

        ${allSlots.map(s => `
          <text x="${xOf(s.slotIdx)}" y="${H-17}" text-anchor="middle" font-size="10" font-weight="${s.isNow?'bold':'normal'}" fill="${s.isNow?'#F87171':'#CBD5E1'}" class="font-mono">${s.top}</text>
          <text x="${xOf(s.slotIdx)}" y="${H-5}" text-anchor="middle" font-size="9" font-weight="bold" fill="${s.isNow?'#FCA5A5':(s.slotIdx>4?'#818CF8':'#64748B')}" class="font-mono">${s.bot}</text>
        `).join("")}
      </svg>`;

      return { future5Days, svgHtml, vwapBias: (curP - curVwap) / curVwap };
    }

    function buildMacroSvg(m, timeInfo) {
      const { cfg, curP, sysTrack, lockedTrack, calcSysRev, is3x } = m;
      const W = 1000, H1 = 360, H2 = 155, PAD_L = 64, PAD_R = 28, PAD_T = 28, PAD_B = 26;
      const plotW = W - PAD_L - PAD_R;
      const maxDay = dayOf("12/31");
      const xOf = (dt) => PAD_L + (dayOf(dt) / maxDay) * plotW;

      const cutDay = dayOf(state.anchorDt);
      const histPts = cfg.hist.filter(d => dayOf(d[0]) < cutDay);
      histPts.push([state.anchorDt, curP]);

      const futDates = ["11/06","11/09","11/10","11/11","11/12","11/13","11/16","11/17","11/18","11/20","11/23","11/26","11/30","12/03","12/07","12/10","12/14","12/18","12/23","12/28"]
        .filter(dt => dayOf(dt) > cutDay);

      const futSys = [[state.anchorDt, curP], ...futDates.map(dt => [dt, calcSysRev(dt)])];

      const dFactor = 1.0 - cfg.betaDecay;
      const futLocked = [[state.anchorDt, curP], ...futDates.map(dt => {
        if (dt === "11/18") return [dt, lockedTrack.p1118];
        if (dt === "11/26") return [dt, lockedTrack.p1126];
        if (dt === "12/10") return [dt, lockedTrack.p1210];
        const baseT = getTheoAt(cfg.theoCurve, dt);
        const factor = (dayOf(dt) < dayOf("11/26") && is3x && !cfg.isInverse) ? 0.945 : (is3x && !cfg.isInverse && dayOf(dt) > dayOf("11/26") ? 0.974 : 1.0);
        return [dt, baseT * dFactor * factor];
      })];

      const allPrices = [
        ...histPts.map(d => d[1]), ...futSys.map(d => d[1]), ...futLocked.map(d => d[1]),
        ...cfg.theoCurve.map(d => d[1]), sysTrack.sweepHigh, lockedTrack.p1126, cfg.gammaCorridor[1]
      ];
      const minP = Math.min(...allPrices) * 0.92;
      const maxP = Math.max(...allPrices) * 1.05;
      const y1Of = (p) => PAD_T + (1 - (p - minP) / (maxP - minP)) * (H1 - PAD_T - PAD_B);

      const allPct = allPrices.map(p => ((p / curP) - 1) * 100);
      const minPct = Math.min(...allPct, -35);
      const maxPct = Math.max(...allPct, 65);
      const y2Of = (pct) => 14 + (1 - (pct - minPct) / (maxPct - minPct)) * (H2 - 42);

      const nowX = xOf(state.anchorDt);
      const shortEndX = Math.max(nowX + 24, xOf("11/18"));

      let grid1 = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * (H1 - PAD_T - PAD_B);
        const pVal = maxP - r * (maxP - minP);
        grid1 += `<line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="0.8"/>
                  <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="11" fill="#475569" class="font-mono">$${pVal.toFixed(0)}</text>`;
      });

      const theoPtsStr = cfg.theoCurve.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ");
      const histPtsStr = histPts.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ");
      const futSysStr = futSys.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ");
      const futLockStr = futLocked.map(d => `${xOf(d[0])},${y1Of(d[1])}`).join(" ");

      const showSys = state.cycleEngine === "dual" || state.cycleEngine === "sys";
      const showLock = (state.cycleEngine === "dual" || state.cycleEngine === "locked") && is3x;

      const dispAnchorDt = state.tacticalMode === "auto" ? (timeInfo ? timeInfo.realMmDd : state.anchorDt) : state.anchorDt;

      const rawBoxes = [
        {
          cx: nowX, cy: y1Of(curP),
          bx: nowX - 86, by: y1Of(curP) - 28,
          w: 156, text: `锚点(${dispAnchorDt}):$${curP.toFixed(2)}`,
          borderCol: "#DC2626", textCol: "#B91C1C", dotR: 6
        }
      ];

      if (showSys) {
        rawBoxes.push(
          {
            cx: xOf("11/18"), cy: y1Of(sysTrack.p1118),
            bx: xOf("11/18") - 12, by: y1Of(sysTrack.p1118) - 28,
            w: 120, text: `${sysTrack.dt1}: $${sysTrack.p1118.toFixed(1)}`,
            borderCol: "#2563EB", textCol: "#1E40AF", dotR: 5
          },
          {
            cx: xOf("11/26"), cy: y1Of(sysTrack.p1126),
            bx: xOf("11/26") + 22, by: y1Of(sysTrack.p1126) + (showLock ? -26 : 26),
            w: 124, text: `${sysTrack.dt2}: $${sysTrack.p1126.toFixed(2)}`,
            borderCol: "#1D4ED8", textCol: "#1E3A8A", dotR: 5.5
          },
          {
            cx: xOf("12/10"), cy: y1Of(sysTrack.p1210),
            bx: xOf("12/10") - 4, by: y1Of(sysTrack.p1210) - 26,
            w: 122, text: `${sysTrack.dt3}: $${sysTrack.p1210.toFixed(1)}`,
            borderCol: "#059669", textCol: "#065F46", dotR: 5.5
          }
        );
      }

      if (showLock) {
        rawBoxes.push(
          {
            cx: xOf("11/18"), cy: y1Of(lockedTrack.p1118),
            bx: xOf("11/18") - 16, by: y1Of(lockedTrack.p1118) + 26,
            w: 118, text: `磨损中继:$${lockedTrack.p1118.toFixed(1)}`,
            borderCol: "#7C3AED", textCol: "#5B21B6", dotR: 4.5
          },
          {
            cx: xOf("11/26"), cy: y1Of(lockedTrack.p1126),
            bx: xOf("11/26") + 18, by: y1Of(lockedTrack.p1126) + 28,
            w: 122, text: `磨损底:$${lockedTrack.p1126.toFixed(2)}`,
            borderCol: "#7C3AED", textCol: "#5B21B6", dotR: 5
          },
          {
            cx: xOf("12/10"), cy: y1Of(lockedTrack.p1210),
            bx: xOf("12/10") + 8, by: y1Of(lockedTrack.p1210) + 26,
            w: 118, text: `磨损峰:$${lockedTrack.p1210.toFixed(1)}`,
            borderCol: "#7C3AED", textCol: "#5B21B6", dotR: 4.5
          }
        );
      }

      const safeBoxes = resolve2DBoxCollisions(rawBoxes, PAD_T + 16, H1 - PAD_B - 14, PAD_L + 4, W - PAD_R - 4);
      const badgesHtml = safeBoxes.map(b => `
        <line x1="${b.cx}" y1="${b.cy}" x2="${b.bx}" y2="${b.by}" stroke="${b.borderCol}" stroke-width="1.2" stroke-dasharray="2 2"/>
        <circle cx="${b.cx}" cy="${b.cy}" r="${b.dotR}" fill="${b.borderCol}" stroke="#FFFFFF" stroke-width="1.5"/>
        <g transform="translate(${b.bx}, ${b.by})">
          <rect x="${-b.w/2}" y="-10" width="${b.w}" height="19" rx="5" fill="#FFFFFF" stroke="${b.borderCol}" stroke-width="1.3" opacity="0.96"/>
          <text x="0" y="3" text-anchor="middle" font-size="10.5" font-weight="bold" fill="${b.textCol}" class="font-mono">${b.text}</text>
        </g>
      `).join("");

      const baseNowDate = timeInfo ? timeInfo.now : new Date();
      const anchorDayNum = dayOf(state.anchorDt);
      const tickLabelsHtml = WEEKLY_TICKS.map(lbl => {
        const dispLbl = state.tacticalMode === "auto"
          ? formatOffsetDate(baseNowDate, dayOf(lbl) - anchorDayNum)
          : lbl;
        return `<text x="${xOf(lbl)}" y="${H2-6}" text-anchor="middle" font-size="10" fill="#334155" class="font-mono">${dispLbl}</text>`;
      }).join("");

      return `<svg viewBox="0 0 ${W} ${H1 + H2 + 20}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${H1-PAD_T-PAD_B}" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>
        <rect x="${xOf("10/19")}" y="${PAD_T}" width="${xOf("10/26")-xOf("10/19")}" height="${H1-PAD_T-PAD_B}" fill="#E2E8F0" opacity="0.55"/>
        <rect x="${xOf("10/30")}" y="${PAD_T}" width="${xOf("11/05")-xOf("10/30")}" height="${H1-PAD_T-PAD_B}" fill="#FEE2E2" opacity="0.55"/>
        <rect x="${xOf("11/23")}" y="${PAD_T}" width="${xOf("11/28")-xOf("11/23")}" height="${H1-PAD_T-PAD_B}" fill="#DBEAFE" opacity="0.65"/>
        <rect x="${xOf("12/04")}" y="${PAD_T}" width="${xOf("12/11")-xOf("12/04")}" height="${H1-PAD_T-PAD_B}" fill="#FEF9C3" opacity="0.65"/>

        <rect x="${xOf("11/05")}" y="${y1Of(cfg.gammaCorridor[1])}" width="${xOf("11/17") - xOf("11/05")}" height="${Math.max(6, y1Of(cfg.gammaCorridor[0]) - y1Of(cfg.gammaCorridor[1]))}" fill="#A855F7" opacity="0.14" stroke="#A855F7" stroke-dasharray="3 3"/>
        <g transform="translate(${PAD_L + 10}, ${PAD_T + 8})">
          <rect x="0" y="0" width="380" height="19" rx="4" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" opacity="0.95"/>
          <text x="8" y="13" font-size="10" font-weight="bold" fill="#7E22CE" class="font-mono">⚡ 紫色区: 负Gamma逼空走廊 ($${cfg.gammaCorridor[0]}~$${cfg.gammaCorridor[1]})</text>
        </g>

        ${grid1}
        <line x1="${nowX}" y1="${PAD_T}" x2="${nowX}" y2="${H1-PAD_B}" stroke="#DC2626" stroke-dasharray="6 3" stroke-width="1.8"/>
        <polyline fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="3 3" points="${theoPtsStr}"/>
        <polyline fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" points="${histPtsStr}"/>
        <rect x="${nowX}" y="${y1Of(sysTrack.sweepHigh)}" width="${shortEndX-nowX}" height="${Math.max(4, y1Of(sysTrack.sweepLow)-y1Of(sysTrack.sweepHigh))}" fill="#FB7185" opacity="0.28"/>
        <line x1="${nowX}" y1="${y1Of(sysTrack.sweepHigh)}" x2="${shortEndX}" y2="${y1Of(sysTrack.sweepHigh)}" stroke="#E11D48" stroke-width="1.5"/>

        ${showLock ? `<polyline fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="5 3" stroke-linejoin="round" points="${futLockStr}"/>` : ""}
        ${showSys ? `<polyline fill="none" stroke="#1D4ED8" stroke-width="3.0" stroke-dasharray="7 4" stroke-linejoin="round" points="${futSysStr}"/>` : ""}

        ${badgesHtml}

        <g transform="translate(0, ${H1 + 5})">
          <rect x="${PAD_L}" y="10" width="${plotW}" height="${H2-35}" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="${PAD_L}" y1="${y2Of(0)}" x2="${W-PAD_R}" y2="${y2Of(0)}" stroke="#64748B" stroke-dasharray="3 3" stroke-width="1"/>
          <line x1="${nowX}" y1="10" x2="${nowX}" y2="${H2-25}" stroke="#DC2626" stroke-dasharray="6 3" stroke-width="1.8"/>
          <text x="${PAD_L-8}" y="${y2Of(30)+4}" text-anchor="end" font-size="10" fill="#475569" class="font-mono">+30%</text>
          <text x="${PAD_L-8}" y="${y2Of(0)+4}" text-anchor="end" font-size="10" fill="#475569" class="font-mono">0%</text>
          <polyline fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" points="${histPts.map(d => `${xOf(d[0])},${y2Of(((d[1]/curP)-1)*100)}`).join(" ")}"/>
          ${showLock ? `<polyline fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-dasharray="4 3" stroke-linejoin="round" points="${futLocked.map(d => `${xOf(d[0])},${y2Of(((d[1]/curP)-1)*100)}`).join(" ")}"/>` : ""}
          ${showSys ? `<polyline fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-dasharray="7 4" stroke-linejoin="round" points="${futSys.map(d => `${xOf(d[0])},${y2Of(((d[1]/curP)-1)*100)}`).join(" ")}"/>` : ""}
          ${tickLabelsHtml}
        </g>
      </svg>`;
    }

    function computeAndBuildCompass(m, timeInfo) {
      const { cfg } = m;
      const motherSym = cfg.motherSym || "SOXX";
      const mCfg = MOTHER_INDEX_DB[motherSym];
      const P0 = state.prices[motherSym] || RAW_DB[motherSym].regClose;
      const horizonYrs = state.compassYears;

      const now = timeInfo ? timeInfo.now : new Date();
      const startYear = now.getFullYear();
      const startMonth = now.getMonth() + 1;
      const curQuarter = Math.floor((startMonth - 1) / 3) + 1;
      const nextReanchorMonth = ((curQuarter * 3) % 12) + 1;
      const nextReanchorYear = curQuarter === 4 ? startYear + 1 : startYear;

      const totalSteps = horizonYrs * 24;
      const pts = [];
      const driftPts = [];
      const upperBand = [];
      const lowerBand = [];

      const calcCycleFactor = (tYrs) => {
        const w1 = 0.52 * Math.sin(2 * Math.PI * (tYrs / 1.00 - 0.08 + mCfg.phaseShift));
        const w2 = 0.30 * Math.cos(2 * Math.PI * (tYrs / 1.75 + mCfg.phaseShift));
        const w3 = 0.18 * Math.sin(2 * Math.PI * (tYrs / 3.40 + 0.15));
        return Math.max(-0.98, Math.min(0.98, w1 + w2 + w3));
      };

      const c0 = calcCycleFactor(0);
      for (let i = 0; i <= totalSteps; i++) {
        const t = (i / totalSteps) * horizonYrs;
        const ct = calcCycleFactor(t);
        const driftVal = P0 * Math.exp(mCfg.mu * t);
        const rawP = driftVal * (1.0 + mCfg.amp * ct);
        const normRatio = (1.0 + mCfg.amp * c0);
        const pVal = i === 0 ? P0 : rawP / (i < 6 ? (normRatio * (1 - i/6) + (i/6)) : 1.0);

        const dObj = new Date(now.getTime() + t * 365.25 * 86400000);
        const ymLabel = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, "0")}`;

        pts.push({ idx: i, t, p: pVal, ct, ym: ymLabel });
        driftPts.push({ idx: i, t, p: driftVal });
        upperBand.push({ idx: i, t, p: driftVal * (1.0 + mCfg.amp * 0.92) });
        lowerBand.push({ idx: i, t, p: driftVal * (1.0 - mCfg.amp * 0.88) });
      }

      const extrema = [];
      for (let i = 2; i < pts.length - 2; i++) {
        const prev = pts[i - 1].ct, cur = pts[i].ct, next = pts[i + 1].ct;
        if (cur <= prev && cur <= next && cur < -0.25) {
          if (extrema.length === 0 || extrema[extrema.length - 1].type !== "pit" || (i - extrema[extrema.length - 1].idx) > 6) {
            extrema.push({ ...pts[i], type: "pit", title: "黄金坑大底窗" });
          }
        } else if (cur >= prev && cur >= next && cur > 0.28) {
          if (extrema.length === 0 || extrema[extrema.length - 1].type !== "peak" || (i - extrema[extrema.length - 1].idx) > 6) {
            extrema.push({ ...pts[i], type: "peak", title: "牛市波峰兑现窗" });
          }
        }
      }

      const keyNodes = extrema.slice(0, 6);
      const cardNodes = keyNodes.slice(0, 4);

      const W = 1000, H = 355, PAD_L = 68, PAD_R = 28, PAD_T = 34, PAD_B = 36;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const xOf = (idx) => PAD_L + (idx / totalSteps) * plotW;

      const allVals = [
        ...pts.map(d => d.p),
        ...upperBand.map(d => d.p),
        ...lowerBand.map(d => d.p)
      ];
      const minY = Math.min(...allVals) * 0.93;
      const maxY = Math.max(...allVals) * 1.07;
      const logMin = Math.log(minY), logMax = Math.log(maxY);
      const yOf = (val) => PAD_T + (1 - (Math.log(Math.max(1, val)) - logMin) / (logMax - logMin)) * plotH;

      let gridHtml = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * plotH;
        const pVal = Math.exp(logMax - r * (logMax - logMin));
        const pctFromNow = ((pVal / P0) - 1) * 100;
        gridHtml += `
          <line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>
          <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="10.5" fill="#94A3B8" class="font-mono">$${pVal.toFixed(0)} (${pctFromNow>=0?'+'+pctFromNow.toFixed(0)+'%':pctFromNow.toFixed(0)+'%'})</text>
        `;
      });

      let regimeBandsHtml = "";
      for (let i = 0; i < pts.length - 1; i++) {
        if (pts[i].ct <= -0.38) {
          regimeBandsHtml += `<rect x="${xOf(i)}" y="${PAD_T}" width="${xOf(i+1)-xOf(i)+1}" height="${plotH}" fill="#38BDF8" opacity="0.13"/>`;
        } else if (pts[i].ct >= 0.42) {
          regimeBandsHtml += `<rect x="${xOf(i)}" y="${PAD_T}" width="${xOf(i+1)-xOf(i)+1}" height="${plotH}" fill="#FACC15" opacity="0.12"/>`;
        }
      }

      const rawCompassBoxes = keyNodes.map((nd) => {
        const cx = xOf(nd.idx), cy = yOf(nd.p);
        const isPit = nd.type === "pit";
        const dy = isPit ? 28 : -26;
        const col = isPit ? "#38BDF8" : "#FBBF24";
        const pct = ((nd.p / P0) - 1) * 100;
        return {
          cx, cy,
          bx: cx, by: cy + dy,
          w: 152,
          text: `${nd.ym} ${isPit?'谷':'峰'}:$${nd.p.toFixed(0)}(${pct>=0?'+'+pct.toFixed(0)+'%':pct.toFixed(0)+'%'})`,
          borderCol: col,
          textCol: col,
          dotR: 5.5
        };
      });
      const safeCompassBoxes = resolve2DBoxCollisions(rawCompassBoxes, PAD_T + 16, H - PAD_B - 14, PAD_L + 4, W - PAD_R - 4);
      const nodeBadgesHtml = safeCompassBoxes.map((b) => `
        <line x1="${b.cx}" y1="${b.cy}" x2="${b.bx}" y2="${b.by}" stroke="${b.borderCol}" stroke-width="1.3" stroke-dasharray="2 2"/>
        <circle cx="${b.cx}" cy="${b.cy}" r="${b.dotR}" fill="${b.borderCol}" stroke="#0F172A" stroke-width="1.5"/>
        <g transform="translate(${b.bx}, ${b.by})">
          <rect x="${-b.w/2}" y="-11" width="${b.w}" height="20" rx="5" fill="#0F172A" stroke="${b.borderCol}" stroke-width="1.3" opacity="0.95"/>
          <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="${b.textCol}" class="font-mono">${b.text}</text>
        </g>
      `).join("");

      const xTickStep = Math.max(2, Math.floor(totalSteps / 10));
      let xTicksHtml = "";
      for (let i = 0; i <= totalSteps; i += xTickStep) {
        xTicksHtml += `<text x="${xOf(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#94A3B8" class="font-mono">${pts[i].ym}</text>`;
      }

      const svgHtml = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${plotH}" fill="#0F172A" rx="8"/>
        ${regimeBandsHtml}
        ${gridHtml}
        <polyline fill="none" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" points="${upperBand.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" points="${lowerBand.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#94A3B8" stroke-width="2.0" stroke-dasharray="6 4" points="${driftPts.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linejoin="round" points="${pts.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>

        <g transform="translate(${PAD_L + 12}, 10)">
          <text x="0" y="12" font-size="10.5" font-weight="bold" fill="#38BDF8" class="font-mono">━━ 蓝色实线: P(t)=P₀·e^(μt)·[1+A·C(t)] 周期合成轨</text>
          <text x="340" y="12" font-size="10.5" font-weight="bold" fill="#94A3B8" class="font-mono">┅┅ 灰色虚线: 年化+${(mCfg.mu*100).toFixed(1)}% 宏观漂移中轴</text>
        </g>

        <circle cx="${xOf(0)}" cy="${yOf(P0)}" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
        <g transform="translate(${PAD_L + 78}, ${Math.max(PAD_T + 20, yOf(P0) - 20)})">
          <rect x="-70" y="-10" width="140" height="19" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.3"/>
          <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="#FCA5A5" class="font-mono">当前锚点P₀:$${P0.toFixed(1)}</text>
        </g>

        ${nodeBadgesHtml}
        ${xTicksHtml}
      </svg>`;

      return { mCfg, P0, horizonYrs, startYear, curQuarter, nextReanchorYear, nextReanchorMonth, cardNodes, svgHtml };
    }

    function computeIntraday(m, timeInfo) {
      const { cfg, curP, sysTrack, is3x, lockedHigh, isShortFrozen, curVwap } = m;
      const nowIdx = timeInfo.nowIdx;
      const nowFloatIdx = timeInfo.nowFloatIdx;
      const openIdx = 7;
      const closeIdx = 14;

      const vwap = curVwap;
      const ampUnit = is3x ? 1.0 : 0.35;

      const majorSupLow  = parseFloat((Math.max(curP * (1 + 0.035 * ampUnit), vwap * (1 + 0.020 * ampUnit))).toFixed(2));
      const majorSupHigh = parseFloat((Math.max(curP * (1 + 0.058 * ampUnit), vwap * (1 + 0.038 * ampUnit))).toFixed(2));
      const demandLow    = parseFloat((Math.min(curP * (1 - 0.025 * ampUnit), vwap * (1 - 0.032 * ampUnit))).toFixed(2));
      const demandHigh   = parseFloat((Math.min(curP * (1 - 0.012 * ampUnit), vwap * (1 - 0.018 * ampUnit))).toFixed(2));
      const microRes     = parseFloat((Math.max(curP * (1 + 0.015 * ampUnit), vwap * (1 + 0.004 * ampUnit))).toFixed(2));
      const midTarget    = parseFloat((Math.max(vwap * (1 + 0.014 * ampUnit), (vwap + majorSupLow) * 0.5)).toFixed(2));
      const stopHuntExtreme = parseFloat((demandLow * (1 - 0.015 * ampUnit)).toFixed(2));

      const sessionStartAnchor = parseFloat(((vwap * 0.65 + curP * 0.35)).toFixed(2));
      const pastPts = [];
      const maxPastSlot = Math.floor(nowFloatIdx);
      for (let i = 0; i <= maxPastSlot; i++) {
        if (Math.abs(nowFloatIdx - i) < 0.05) break;
        const progress = maxPastSlot > 0 ? (i / Math.max(1, nowFloatIdx)) : 0;
        const microWave = Math.sin(i * 1.7 + (cfg.isInverse ? 2.1 : 0.4)) * curP * (is3x ? 0.0045 : 0.0018);
        const interpVal = sessionStartAnchor + (curP - sessionStartAnchor) * progress + (i === 0 ? 0 : microWave);
        pastPts.push([i, parseFloat(interpVal.toFixed(2))]);
      }
      pastPts.push([nowFloatIdx, curP]);

      const pathA = [[nowFloatIdx, curP]], pathB = [[nowFloatIdx, curP]], pathC = [[nowFloatIdx, curP]];
      const tmplA = [
        [3, curP * (1 + 0.003 * ampUnit)],
        [5, (curP + demandHigh) * 0.5],
        [7, demandHigh * 0.999],
        [8, parseFloat(((demandLow + demandHigh) * 0.5).toFixed(2))],
        [9, parseFloat((vwap * 1.001).toFixed(2))],
        [10, midTarget],
        [11, parseFloat(((midTarget + majorSupLow) * 0.5).toFixed(2))],
        [12, majorSupLow],
        [13, parseFloat(((majorSupLow + majorSupHigh) * 0.5).toFixed(2))],
        [14, parseFloat((majorSupLow * (1 + 0.004 * ampUnit)).toFixed(2))],
        [15, majorSupLow],
        [16, parseFloat((majorSupLow * (1 + 0.002 * ampUnit)).toFixed(2))]
      ];
      const tmplB = [
        [3, curP * (1 + 0.006 * ampUnit)],
        [5, vwap],
        [7, microRes],
        [8, majorSupLow],
        [9, parseFloat(((majorSupLow + majorSupHigh) * 0.5).toFixed(2))],
        [10, majorSupHigh],
        [11, parseFloat((majorSupHigh * (1 + 0.004 * ampUnit)).toFixed(2))],
        [12, parseFloat((majorSupHigh * (1 + 0.008 * ampUnit)).toFixed(2))],
        [13, parseFloat((majorSupHigh * (1 + 0.012 * ampUnit)).toFixed(2))],
        [14, majorSupHigh],
        [15, majorSupHigh],
        [16, majorSupHigh]
      ];
      const tmplC = [
        [3, curP * (1 - 0.004 * ampUnit)],
        [5, demandHigh],
        [7, demandLow],
        [8, stopHuntExtreme],
        [9, demandLow],
        [10, vwap],
        [11, midTarget],
        [12, midTarget],
        [13, majorSupLow],
        [14, midTarget],
        [15, midTarget],
        [16, midTarget]
      ];

      pathA.push(...tmplA.filter(d => d[0] > nowFloatIdx + 0.12));
      pathB.push(...tmplB.filter(d => d[0] > nowFloatIdx + 0.12));
      pathC.push(...tmplC.filter(d => d[0] > nowFloatIdx + 0.12));

      return {
        nowIdx, nowFloatIdx, bjtHM: timeInfo.bjtHM, estHM: timeInfo.estHM,
        openIdx, closeIdx, isShortFrozen,
        vwap, demandLow, demandHigh, microRes, midTarget, majorSupLow, majorSupHigh, stopHuntExtreme,
        pastPts, pathA, pathB, pathC
      };
    }

                <div class="text-purple-700 font-extrabold text-sm mt-1">系统轨 $${sysTrack.p1118.toFixed(2)}</div>
              </div>
              <div class="p-3 rounded-xl bg-blue-50/90 border-l-4 border-l-blue-600 border border-blue-300">
                <div class="text-blue-900 font-bold">${sysTrack.dt2} ${cfg.isInverse?'止盈波峰':'黄金坑'}</div>
                <div class="text-blue-700 font-extrabold text-sm mt-1">系统轨 $${sysTrack.p1126.toFixed(2)}</div>
              </div>
              <div class="p-3 rounded-xl bg-emerald-50/90 border-l-4 border-l-emerald-600 border border-emerald-200">
                <div class="text-emerald-900 font-bold">${sysTrack.dt3} 跨月节点</div>
                <div class="text-emerald-700 font-extrabold text-sm mt-1">系统轨 $${sysTrack.p1210.toFixed(2)}</div>
              </div>
            </div>
            <div class="w-full overflow-x-auto">${buildMacroSvg(m, timeInfo)}</div>
          `;
        } else {
          elMacro.style.display = "none";
        }
      }

      const elCompass = document.getElementById("compassSection");
      if (elCompass) {
        if (state.viewMode === "all" || state.viewMode === "compass") {
          elCompass.style.display = "block";
          elCompass.innerHTML = `
            <div class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="px-2.5 py-0.5 text-xs font-bold rounded-md bg-amber-600 text-white">第四层：1~5年宏观牛熊罗盘</span>
                  <h2 class="text-base md:text-lg font-bold text-slate-900 mt-1">🧭 【${compass.mCfg.name} · 未来 ${compass.horizonYrs} 年牛熊罗盘】</h2>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${[1, 2, 3, 5].map(yrs => `
                  <button onclick="setCompassYears(${yrs})" class="px-3 py-1.5 text-xs font-bold rounded-xl transition ${state.compassYears===yrs ? 'bg-slate-900 text-amber-300 shadow-md scale-105' : 'bg-slate-100 text-slate-600'}">
                    ${yrs}年罗盘
                  </button>
                `).join("")}
              </div>
            </div>
            <div class="w-full overflow-x-auto">${compass.svgHtml}</div>
          `;
        } else {
          elCompass.style.display = "none";
        }
      }
    }

    function renderFullShell() {
      const root = document.getElementById("app");
      if (!state.isAuthed) {
        root.innerHTML = `
          <div class="min-h-[85vh] flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 text-white">
              <div class="text-center space-y-2">
                <div class="text-3xl">🛡️</div>
                <h1 class="text-xl font-bold">【周期系统逻辑理论 V6.0】</h1>
                <p class="text-xs text-slate-400 font-mono">请输入访问口令解锁</p>
              </div>
              <form id="loginForm" class="space-y-4">
                <input id="pinInput" type="password" placeholder="请输入密码..." autofocus class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white text-center font-mono text-lg tracking-widest focus:outline-none"/>
                ${state.pinError ? `<p class="text-xs text-rose-400 text-center font-mono">❌ 密码错误</p>` : ""}
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">🔓 解锁终端</button>
              </form>
            </div>
          </div>`;
        const form = document.getElementById("loginForm");
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById("pinInput").value.trim();
            if (val === ACCESS_PIN) {
              try { localStorage.setItem(AUTH_KEY, ACCESS_PIN); } catch (err) {}
              state.isAuthed = true; state.pinError = false; renderFullShell();
            } else {
              state.pinError = true; renderFullShell();
            }
          };
        }
        return;
      }

      const cfg = RAW_DB[state.ticker];
      const curP = state.prices[state.ticker] || cfg.regClose;

      root.innerHTML = `
        <header class="flex flex-wrap justify-between items-center bg-white px-4 md:px-6 py-3.5 rounded-2xl shadow-sm border border-slate-200 gap-3">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <button id="liveBtn" onclick="toggleLive()"></button>
              <div id="sourceSwitchGroup" class="inline-flex items-center"></div>
              <span id="clockBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-slate-900 text-amber-300"></span>
              <span id="countdownBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
              <h1 id="headerTitle" class="text-base md:text-lg font-bold text-slate-900"></h1>
            </div>
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <button onclick="setView('all')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='all'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">⚡ 四层全开</button>
              <button onclick="setView('intraday')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='intraday'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📈 一层：24H日内</button>
              <button onclick="setView('weekly5d')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='weekly5d'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">🗓️ 二层：周内5日</button>
              <button onclick="setView('macro')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='macro'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📅 三层：波段轨</button>
              <button onclick="setView('compass')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='compass'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">🧭 四层：罗盘</button>
              <button onclick="toggleClean()" class="px-2.5 py-1 text-xs font-bold rounded-lg border ${state.cleanShot?'bg-rose-600 text-white border-rose-700':'bg-slate-50 text-slate-700 border-slate-300'}">${state.cleanShot?'📸 退出截图':'📸 截图模式'}</button>
              <button onclick="logout()" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-500">🔒 锁定</button>
            </div>
          </div>
          <div id="tickerButtons" class="flex items-center gap-1.5 flex-wrap"></div>
        </header>

        <div id="gammaBanner"></div>
        <div id="barrierBanner" class="grid grid-cols-1 md:grid-cols-2 gap-3 font-mono text-xs"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          ${!state.cleanShot ? `
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span id="sliderStatusLabel" class="text-sm font-bold text-slate-800"></span>
                  <span id="sliderPriceVal" class="text-lg font-mono font-bold text-indigo-600"></span>
                </div>
                <input id="priceSlider" type="range" min="${cfg.minP}" max="${cfg.maxP}" step="${cfg.step}" value="${curP}" class="w-full accent-indigo-600 cursor-pointer"/>
                <div class="flex justify-between text-[11px] text-slate-400 font-mono mt-1 mb-3">
                  <span>$${cfg.minP.toFixed(1)}</span>
                  <button onclick="toggleLive(true)" class="text-emerald-600 font-bold underline">恢复实时自动同步</button>
                  <span>$${cfg.maxP.toFixed(1)}</span>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
                ${cfg.presets.map((p, idx) => `
                  <button onclick="applyPreset(${idx})" class="px-2.5 py-2 text-[11.5px] rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 font-mono font-semibold text-slate-700 text-left transition">${p.label}</button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div id="diagPanel" class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 ${state.cleanShot?'lg:col-span-12':'lg:col-span-7'}"></div>
        </div>

        <div id="intraSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-indigo-500/30 space-y-4"></div>
        <div id="weekly5dSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-purple-500/30 space-y-4"></div>
        <div id="macroSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-blue-500/30 space-y-4"></div>
        <div id="compassSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-amber-500/40 space-y-4"></div>
      `;

      const slider = document.getElementById("priceSlider");
      if (slider) {
        slider.addEventListener("input", (e) => {
          state.isLive = false;
          state.prices[state.ticker] = parseFloat(e.target.value);
          updateDynamicSections();
        });
      }

      updateDynamicSections();
    }

    window.toggleLive = (forceTrue) => {
      state.isLive = forceTrue ? true : !state.isLive;
      state.customBaseTheo = null;
      state.anchorDt = "11/17";
      if (state.isLive) syncQuotes();
      updateDynamicSections();
    };
    window.setDataSource = (src) => {
      state.dataSource = src;
      state.isLive = true;
      syncQuotes();
      updateDynamicSections();
    };
    window.setView = (v) => { state.viewMode = v; renderFullShell(); };
    window.setTacticalMode = (tm) => { state.tacticalMode = tm; updateDynamicSections(); };
    window.setCompassYears = (yrs) => { state.compassYears = yrs; updateDynamicSections(); };
    window.setEngine = (e) => { state.cycleEngine = e; updateDynamicSections(); };
    window.setIntra = (s) => { state.intraScenario = s; updateDynamicSections(); };
    window.toggleClean = () => { state.cleanShot = !state.cleanShot; renderFullShell(); };
    window.logout = () => { try { localStorage.removeItem(AUTH_KEY); } catch(e){} state.isAuthed = false; renderFullShell(); };
    window.selectTicker = (sym) => { state.ticker = sym; state.customBaseTheo = null; state.anchorDt = "11/17"; renderFullShell(); };
    window.applyPreset = (idx) => {
      const p = RAW_DB[state.ticker].presets[idx];
      if (!p) return;
      state.isLive = false;
      state.prices[state.ticker] = p.val;
      state.customBaseTheo = p.baseTheo;
      state.anchorDt = p.anchorDt || "11/17";
      const slider = document.getElementById("priceSlider");
      if (slider) slider.value = p.val;
      updateDynamicSections();
    };
    window.copyReport = () => {
      const timeInfo = getRealTimeSlotInfo();
      const m = computeAll(timeInfo);
      const text = `📊 **【${state.ticker} 周期系统逻辑理论 V6.0 实盘战报】**\n● 数据源: ${state.activeChannel==='opend'?'本地Moomoo OpenD':'云端API'} | 现价 $${m.curP.toFixed(2)} | VWAP $${m.curVwap.toFixed(2)} | 乖离率 ${m.spreadPct.toFixed(1)}%`;
      navigator.clipboard.writeText(text);
      state.copied = true; updateDynamicSections();
      setTimeout(() => { state.copied = false; updateDynamicSections(); }, 2000);
    };

    // 核心同步引擎：优先尝试本地 Moomoo OpenD (127.0.0.1:8888 / live_price.json)，支持手动切换与自动无缝容灾
    async function syncQuotes() {
      if (!state.isAuthed || !state.isLive) return;
      const bjtNowStr = getRealTimeSlotInfo().bjtStr;

      if (state.dataSource === "opend") {
        // 1) 优先尝试本地 moo_bridge.py 批量高速接口
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 2200);
          const res = await fetch("http://127.0.0.1:8888/api/quotes_all", { signal: ctrl.signal });
          clearTimeout(timer);
          if (res.ok) {
            const data = await res.json();
            if (data && data.quotes) {
              TICKER_ORDER.forEach(sym => {
                const q = data.quotes[sym];
                if (q && q.price > 0) {
                  state.prices[sym] = parseFloat(q.price.toFixed(2));
                  if (q.reg_close > 0) RAW_DB[sym].regClose = parseFloat(q.reg_close.toFixed(2));
                  state.realIntraStats[sym] = {
                    high: parseFloat((q.high || q.price * 1.02).toFixed(2)),
                    low: parseFloat((q.low || q.price * 0.98).toFixed(2)),
                    vwap: parseFloat((q.vwap || q.price * (RAW_DB[sym].isInverse ? 0.992 : 1.008)).toFixed(2))
                  };
                }
              });
              const slider = document.getElementById("priceSlider");
              if (slider) slider.value = state.prices[state.ticker];
              state.activeChannel = "opend";
              state.liveStatus = `🔌 本地OpenD实盘 (${data.ts || bjtNowStr})`;
              updateDynamicSections();
              return;
            }
          }
        } catch (bridgeErr) {}

        // 2) 次选尝试本地 moo_live_daemon.py 生成的 live_price.json
        try {
          const resJson = await fetch(`./live_price.json?t=${Date.now()}`);
          if (resJson.ok) {
            const j = await resJson.json();
            if (j && j.prices) {
              TICKER_ORDER.forEach(sym => {
                const p = j.prices[sym];
                if (p && p > 0) {
                  state.prices[sym] = parseFloat(Number(p).toFixed(2));
                  if (j.prev_close && j.prev_close[sym] > 0) RAW_DB[sym].regClose = parseFloat(Number(j.prev_close[sym]).toFixed(2));
                  const meta = j.intraday_meta ? j.intraday_meta[sym] : null;
                  state.realIntraStats[sym] = {
                    high: meta && meta.high ? parseFloat(Number(meta.high).toFixed(2)) : parseFloat((p * 1.02).toFixed(2)),
                    low: meta && meta.low ? parseFloat(Number(meta.low).toFixed(2)) : parseFloat((p * 0.98).toFixed(2)),
                    vwap: parseFloat((p * (RAW_DB[sym].isInverse ? 0.992 : 1.008)).toFixed(2))
                  };
                }
              });
              const slider = document.getElementById("priceSlider");
              if (slider) slider.value = state.prices[state.ticker];
              state.activeChannel = "opend";
              state.liveStatus = `🔌 本地OpenD守护进程 (${j.ts || bjtNowStr})`;
              updateDynamicSections();
              return;
            }
          }
        } catch (daemonErr) {}
      }

      // 3) 云端免费 API 模式（或本地 OpenD 未启动时的自动无感兜底）
      try {
        await Promise.all(TICKER_ORDER.map(async (sym) => {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d&includePrePost=true`;
          const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
          ];
          for (const pUrl of proxies) {
            try {
              const r = await fetch(pUrl);
              if (!r.ok) continue;
              const j = await r.json();
              const res0 = j?.chart?.result?.[0];
              const meta = res0?.meta;
              const q = res0?.indicators?.quote?.[0];
              if (meta) {
                let latest = meta.regularMarketPrice;
                const bjtH = new Date().getUTCHours() + 8;
                const normH = bjtH >= 24 ? bjtH - 24 : bjtH;
                if (normH >= 8 && normH < 22) {
                  if (meta.preMarketPrice && meta.preMarketPrice > 0) latest = meta.preMarketPrice;
                  else if (meta.postMarketPrice && meta.postMarketPrice > 0) latest = meta.postMarketPrice;
                } else if (normH >= 5 && normH < 8) {
                  if (meta.postMarketPrice && meta.postMarketPrice > 0) latest = meta.postMarketPrice;
                }
                if (!latest || isNaN(latest)) latest = RAW_DB[sym].postClose;

                if (meta.regularMarketPrice && meta.regularMarketPrice > 0) {
                  RAW_DB[sym].regClose = parseFloat(meta.regularMarketPrice.toFixed(2));
                }

                let maxH = meta.regularMarketDayHigh || latest * 1.02;
                let minL = meta.regularMarketDayLow || latest * 0.98;
                let sumPV = 0, sumV = 0;

                if (q && Array.isArray(q.close)) {
                  const startIdx = Math.max(0, q.close.length - 36);
                  for (let k = startIdx; k < q.close.length; k++) {
                    const c = q.close[k], h = q.high?.[k], l = q.low?.[k], v = q.volume?.[k] || 0;
                    if (c !== null && c > 0) {
                      latest = c;
                      if (h && h > maxH) maxH = h;
                      if (l && l < minL) minL = l;
                      if (v > 0) { sumPV += c * v; sumV += v; }
                    }
                  }
                }
                if (latest && latest > 0) {
                  state.prices[sym] = parseFloat(latest.toFixed(2));
                  if (sym === state.ticker) {
                    const slider = document.getElementById("priceSlider");
                    if (slider) slider.value = state.prices[sym];
                  }
                }
                const calcVwap = sumV > 0 ? parseFloat((sumPV / sumV).toFixed(2)) : parseFloat((latest * (RAW_DB[sym].isInverse ? 0.992 : 1.008)).toFixed(2));
                state.realIntraStats[sym] = {
                  high: parseFloat(maxH.toFixed(2)),
                  low: parseFloat(minL.toFixed(2)),
                  vwap: Math.abs(calcVwap - latest) / latest < 0.035 ? calcVwap : parseFloat((latest * (RAW_DB[sym].isInverse ? 0.992 : 1.008)).toFixed(2))
                };
                break;
              }
            } catch (innerE) {}
          }
        }));
        state.activeChannel = "cloud";
        state.liveStatus = state.dataSource === "opend"
          ? `☁️ 云端兜底中 (待本地OpenD连接 ${bjtNowStr})`
          : `☁️ 云端公网实时 (${bjtNowStr})`;
        updateDynamicSections();
      } catch (e) {}
    }

    renderFullShell();
    setInterval(() => { if (state.isAuthed) updateDynamicSections(); }, 1000);
    setInterval(syncQuotes, 5000);
    syncQuotes();
  </script>
</body>
</html>
