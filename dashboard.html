    function buildAuthenticDailyHist(keyAnchors, microWaveSeed = 1.0) {
      const anchorDays = keyAnchors.map(([dt, val]) => [dayOf(dt), val]);
      return HIST_DATES.map((dt, idx) => {
        const d = dayOf(dt);
        for (let k = 0; k < keyAnchors.length; k++) {
          if (keyAnchors[k][0] === dt) return [dt, keyAnchors[k][1]];
        }
        let vInterp = anchorDays[0][1];
        for (let k = 0; k < anchorDays.length - 1; k++) {
          const [d0, v0] = anchorDays[k];
          const [d1, v1] = anchorDays[k + 1];
          if (d >= d0 && d <= d1) {
            const r = (d - d0) / Math.max(1, d1 - d0);
            const baseLinear = v0 + (v1 - v0) * r;
            const edgeDamp = Math.sin(Math.PI * r);
            const wiggle = Math.sin(idx * 1.9 + microWaveSeed) * Math.abs(v1 - v0) * 0.14 * edgeDamp;
            vInterp = baseLinear + wiggle;
            break;
          }
        }
        return [dt, parseFloat(vInterp.toFixed(2))];
      });
    }

    function getTheoAt(theoCurve, dtLabel) {
      const targetDay = dayOf(dtLabel);
      for (let i = 0; i < theoCurve.length; i++) {
        if (theoCurve[i][0] === dtLabel) return theoCurve[i][1];
      }
      for (let i = 0; i < theoCurve.length - 1; i++) {
        const d0 = dayOf(theoCurve[i][0]), v0 = theoCurve[i][1];
        const d1 = dayOf(theoCurve[i + 1][0]), v1 = theoCurve[i + 1][1];
        if (targetDay >= d0 && targetDay <= d1) {
          const r = (targetDay - d0) / Math.max(1, d1 - d0);
          return v0 + (v1 - v0) * r;
        }
      }
      return theoCurve[theoCurve.length - 1][1];
    }

    function resolveYCollisions(items, minGap, minYBound, maxYBound) {
      const sorted = [...items].sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 4; pass++) {
        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i].y - sorted[i - 1].y < minGap) {
            const mid = (sorted[i].y + sorted[i - 1].y) * 0.5;
            sorted[i - 1].y = Math.max(minYBound, mid - minGap * 0.5);
            sorted[i].y = Math.min(maxYBound, mid + minGap * 0.5);
          }
        }
      }
      return sorted;
    }

    function resolve2DBoxCollisions(boxes, minYBound, maxYBound, minXBound = 66, maxXBound = 970) {
      for (let b of boxes) {
        b.bx = Math.max(minXBound + b.w * 0.5, Math.min(maxXBound - b.w * 0.5, b.bx));
        b.by = Math.max(minYBound, Math.min(maxYBound, b.by));
      }
      for (let pass = 0; pass < 6; pass++) {
        for (let i = 0; i < boxes.length; i++) {
          for (let j = i + 1; j < boxes.length; j++) {
            const a = boxes[i], b = boxes[j];
            const dx = Math.abs(a.bx - b.bx);
            const dy = Math.abs(a.by - b.by);
            const minW = (a.w + b.w) * 0.5 + 8;
            const minH = 22;
            if (dx < minW && dy < minH) {
              const pushY = (minH - dy) * 0.6 + 2;
              if (a.by <= b.by) {
                a.by = Math.max(minYBound, a.by - pushY);
                b.by = Math.min(maxYBound, b.by + pushY);
              } else {
                a.by = Math.min(maxYBound, a.by + pushY);
                b.by = Math.max(minYBound, b.by - pushY);
              }
            }
          }
        }
      }
      return boxes;
    }

            mmdd: `${mm}/${dd}`,

          badge: "🟣 【伽马脉冲见顶 · 阶段一】：末日负Gamma极值逼空 (Delta饱和中 · 严禁左侧猜顶)",
          bg: "bg-purple-50 border-purple-400 text-purple-950",

        };
      }

      const isAlreadyAtTheoCeiling = !cfg.isInverse && (lockedHigh >= cfg.theoToday * 0.95 || curP > cfg.regClose * 0.95);
      const topLow = Math.min(lockedHigh * 0.96, Math.max(curP * 0.995, cfg.theoToday));
      const topHigh = Math.max(lockedHigh, curP * 1.006, cfg.theoToday);

      const baseNowDate = timeInfo ? timeInfo.now : new Date();
      const dtNode1 = state.tacticalMode === "auto" ? formatOffsetDate(baseNowDate, 6)  : "11/18";
      const dtNode2 = state.tacticalMode === "auto" ? formatOffsetDate(baseNowDate, 14) : "11/26";
      const dtNode3 = state.tacticalMode === "auto" ? formatOffsetDate(baseNowDate, 28) : "12/10";
      const dtNode4 = state.tacticalMode === "auto" ? formatOffsetDate(baseNowDate, 52) : "12/28";

      const sysTrack = {
        pivot: curP * cfg.mmRadarRatios.pivot,
        dt1: dtNode1, p1118: calcSysRev("11/18"),
        dt2: dtNode2, p1126: calcSysRev("11/26"),
        dt3: dtNode3, p1210: calcSysRev("12/10"),
        dt4: dtNode4, p1228: calcSysRev("12/28"),
        sweepLow: isAlreadyAtTheoCeiling ? topLow : curP * cfg.mmRadarRatios.sweep[0],
        sweepHigh: isAlreadyAtTheoCeiling ? topHigh : curP * cfg.mmRadarRatios.sweep[1]
      };

      const dFactor = 1.0 - cfg.betaDecay;
      const lockedTrack = {
        pivot: curP * (is3x ? 0.945 : 0.988),
        p1118: (getTheoAt(cfg.theoCurve, "11/18") * dFactor) * (is3x && !cfg.isInverse ? 0.936 : 1.0),
        p1126: (getTheoAt(cfg.theoCurve, "11/26") * dFactor),
        p1210: (getTheoAt(cfg.theoCurve, "12/10") * dFactor) * (is3x && !cfg.isInverse ? 0.974 : 1.0),
        p1228: (getTheoAt(cfg.theoCurve, "12/28") * dFactor)
      };

      return {
        cfg, curP, activeTheoNow, spreadPct,
        isExtremeBarrierBreached, isShortFrozen, isReversionPhase, phaseTitle,
        gammaStatus, turboCeiling, sysTrack, lockedTrack, calcSysRev, is3x, lockedHigh, curVwap
      };
    }

    function computeAndBuildWeekly5D(m, timeInfo) {
      const { cfg, curP, activeTheoNow, isExtremeBarrierBreached, calcSysRev, is3x, curVwap } = m;
      const baseDate = timeInfo ? timeInfo.now : new Date();
      const next5Days = getNextTradingDays(baseDate, 5);

      const pastSlice = cfg.hist.slice(-4).map((d, idx) => ({
        slotIdx: idx,
        label: d[0],
        subLabel: `T-${4 - idx}`,
        p: d[1],
        isPast: true
      }));
      pastSlice.push({
        slotIdx: 4,
        label: timeInfo ? timeInfo.realMmDd : "11/12",
        subLabel: "T+0(今日)",
        p: curP,
        isPast: true
      });

      const bandHalfWidth = is3x ? 0.046 : 0.015;
      const vwapBias = (curP - curVwap) / curVwap;
      const anchorDayNum = dayOf(state.anchorDt);
      const lastTheoDt = cfg.theoCurve[cfg.theoCurve.length - 1][0];
      const lastTheoDay = dayOf(lastTheoDt);

      const future5Days = next5Days.map((dInfo, idx) => {
        const step = idx + 1;
        const mappedModelDay = anchorDayNum + dInfo.calOffset;
        let modelCenter = mappedModelDay > lastTheoDay ? calcSysRev(lastTheoDt) : curP;
        for (let k = 0; k < cfg.theoCurve.length - 1; k++) {
          const d0 = dayOf(cfg.theoCurve[k][0]), d1 = dayOf(cfg.theoCurve[k + 1][0]);
          if (mappedModelDay >= d0 && mappedModelDay <= d1) {
            const r = (mappedModelDay - d0) / Math.max(1, d1 - d0);
            const t0 = calcSysRev(cfg.theoCurve[k][0]);
            const t1 = calcSysRev(cfg.theoCurve[k + 1][0]);
            modelCenter = t0 + (t1 - t0) * r;
            break;
          }
        }

        let microAdjustedP = modelCenter;
        if (isExtremeBarrierBreached) {
          const pulseRatio = Math.min(1.0, step * 0.24);
          microAdjustedP = curP + (activeTheoNow - curP) * pulseRatio;
        } else if (!cfg.isInverse && curP < curVwap) {
          const vwapDrag = step === 1 ? (curVwap - curP) * 0.25 : -Math.abs(curVwap - curP) * 0.18 * (step / 5);
          microAdjustedP = modelCenter + vwapDrag;
        } else if (cfg.isInverse && curP >= curVwap) {
          microAdjustedP = modelCenter * (1 + 0.008 * step);
        }

        const dailyCeiling = Math.max(microAdjustedP, modelCenter) * (1 + bandHalfWidth * (1 + step * 0.06));
        const dailyFloor = Math.min(microAdjustedP, modelCenter) * (1 - bandHalfWidth * (1 + step * 0.06));

        const gammaUpper = dailyCeiling * (is3x ? 1.018 : 1.006);
        const gammaLower = dailyFloor * (is3x ? 0.982 : 0.994);

        let microDriverTag = "";
        if (isExtremeBarrierBreached) {
          microDriverTag = "🚨 负乖离红线主导：空头回补强行弹射";
        } else if (!cfg.isInverse && curP < curVwap) {
          microDriverTag = step === 1
            ? `🟡 VWAP反压主导：反抽 $${Math.min(curVwap, dailyCeiling).toFixed(2)} 受阻`
            : (step === 4 ? "🎯 周期中继窗共振：回撤空单减半锁利" : "🔴 Delta平账主导：沿底线阶梯寻底");
        } else if (cfg.isInverse) {
          microDriverTag = step === 4 ? "💰 11/18中继兑现窗：多单分批止盈50%" : "🟣 镜像买盘主导：回踩底线顺势低吸";
        } else {
          microDriverTag = "⚡ Gamma走廊主导：高抛天花板低吸底线";
        }

        return {
          slotIdx: 4 + step,
          tLabel: `T+${step}`,
          mmdd: dInfo.mmdd,
          wk: dInfo.wk,
          p: microAdjustedP,
          ceiling: dailyCeiling,
          floor: dailyFloor,
          gammaUpper,
          gammaLower,
          microDriverTag
        };
      });

      const W = 1000, H = 350, PAD_L = 66, PAD_R = 28, PAD_T = 36, PAD_B = 40;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const totalSlots = 9;
      const xOf = (sIdx) => PAD_L + (sIdx / totalSlots) * plotW;

      const allVals = [
        ...pastSlice.map(d => d.p),
        ...future5Days.map(d => d.ceiling),
        ...future5Days.map(d => d.floor),
        ...future5Days.map(d => d.gammaUpper),
        ...future5Days.map(d => d.gammaLower),
        curVwap
      ];
      const minY = Math.min(...allVals) * 0.985;
      const maxY = Math.max(...allVals) * 1.015;
      const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * plotH;

      let gridHtml = "";

        gridHtml += `<line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>

      const corridorTopPts = [[4, curP * (1 + bandHalfWidth * 0.5)], ...future5Days.map(d => [d.slotIdx, d.ceiling])];
      const corridorBotPts = [[4, curP * (1 - bandHalfWidth * 0.5)], ...future5Days.map(d => [d.slotIdx, d.floor])];
      const polygonPts = [

          ${showBox ? `
            <g transform="translate(${boxX}, ${cyMain + (idx % 2 === 0 ? -18 : 18)})">
              <rect x="-54" y="-10" width="108" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
              <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="#38BDF8" class="font-mono">${d.tLabel}:$${d.p.toFixed(2)}</text>
            </g>
          ` : ""}
        `;
      }).join("");

      const allSlots = [
        ...pastSlice.map(d => ({ slotIdx: d.slotIdx, top: d.label, bot: d.subLabel, isNow: d.slotIdx === 4 })),
        ...future5Days.map(d => ({ slotIdx: d.slotIdx, top: `${d.mmdd}(${d.wk})`, bot: d.tLabel, isNow: false }))
      ];

      const svgHtml = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="6" width="${xOf(4)-PAD_L}" height="24" rx="4" fill="#0F172A"/>
        <text x="${(PAD_L+xOf(4))*0.5}" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#94A3B8" class="font-mono">◀ 过去 5 个交易日真实收盘轨迹 (T-4 ~ T+0)</text>
        <rect x="${xOf(4)+2}" y="6" width="${W-PAD_R-xOf(4)-2}" height="24" rx="4" fill="#1E1B4B"/>
        <text x="${(xOf(4)+W-PAD_R)*0.5}" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#A5B4FC" class="font-mono">🔮 未来 1~5 个交易日周内推演区 (周期天花板/底线坐标 + VWAP/Gamma/负乖离主导路径) ▶</text>

        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${plotH}" fill="#0F172A" rx="8"/>
        <rect x="${xOf(4)}" y="${PAD_T}" width="${W-PAD_R-xOf(4)}" height="${plotH}" fill="#1E293B" opacity="0.72"/>

        ${gridHtml}

        <polygon points="${polygonPts}" fill="#6366F1" opacity="0.16"/>
        <polyline fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="5 3" points="${corridorTopPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="5 3" points="${corridorBotPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>

        <line x1="${PAD_L}" y1="${yOf(curVwap)}" x2="${W-PAD_R}" y2="${yOf(curVwap)}" stroke="#FBBF24" stroke-dasharray="6 4" stroke-width="1.5"/>
        <g transform="translate(${PAD_L + 10}, ${Math.max(PAD_T + 14, Math.min(H - PAD_B - 14, yOf(curVwap) - 12))})">

        <polyline fill="none" stroke="#FB923C" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.55" points="${gammaDnPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>

          <text x="${xOf(s.slotIdx)}" y="${H-5}" text-anchor="middle" font-size="9" font-weight="bold" fill="${s.isNow?'#FCA5A5':(s.slotIdx>4?'#818CF8':'#64748B')}" class="font-mono">${s.bot}</text>

      </svg>`;

      return { future5Days, svgHtml, vwapBias };

    function buildMacroSvg(m, timeInfo) {

        .filter(dt => dayOf(dt) > cutDay);

      const dFactor = 1.0 - cfg.betaDecay;
      const futLocked = [[state.anchorDt, curP], ...futDates.map(dt => {
        if (dt === "11/18") return [dt, lockedTrack.p1118];
        if (dt === "11/26") return [dt, lockedTrack.p1126];
        if (dt === "12/10") return [dt, lockedTrack.p1210];
        const baseT = getTheoAt(cfg.theoCurve, dt);
        const factor = (dayOf(dt) < dayOf("11/26") && is3x && !cfg.isInverse) ? 0.945 : (is3x && !cfg.isInverse && dayOf(dt) > dayOf("11/26") ? 0.974 : 1.0);
        return [dt, baseT * dFactor * factor];
      })];

                  <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="11" fill="#475569" class="font-mono">$${pVal.toFixed(0)}</text>`;

          ? formatOffsetDate(baseNowDate, dayOf(lbl) - anchorDayNum)
          : lbl;
        return `<text x="${xOf(lbl)}" y="${H2-6}" text-anchor="middle" font-size="10" fill="#334155" class="font-mono">${dispLbl}</text>`;
      }).join("");

      return `<svg viewBox="0 0 ${W} ${H1 + H2 + 20}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${H1-PAD_T-PAD_B}" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>
        <rect x="${xOf("10/19")}" y="${PAD_T}" width="${xOf("10/26")-xOf("10/19")}" height="${H1-PAD_T-PAD_B}" fill="#E2E8F0" opacity="0.55"/>
        <rect x="${xOf("10/30")}" y="${PAD_T}" width="${xOf("11/05")-xOf("10/30")}" height="${H1-PAD_T-PAD_B}" fill="#FEE2E2" opacity="0.55"/>
        <rect x="${xOf("11/23")}" y="${PAD_T}" width="${xOf("11/28")-xOf("11/23")}" height="${H1-PAD_T-PAD_B}" fill="#DBEAFE" opacity="0.65"/>
        <rect x="${xOf("12/04")}" y="${PAD_T}" width="${xOf("12/11")-xOf("12/04")}" height="${H1-PAD_T-PAD_B}" fill="#FEF9C3" opacity="0.65"/>

        <rect x="${xOf("11/05")}" y="${y1Of(cfg.gammaCorridor[1])}" width="${xOf("11/12") - xOf("11/05")}" height="${Math.max(6, y1Of(cfg.gammaCorridor[0]) - y1Of(cfg.gammaCorridor[1]))}" fill="#A855F7" opacity="0.14" stroke="#A855F7" stroke-dasharray="3 3"/>
        <g transform="translate(${PAD_L + 10}, ${PAD_T + 8})">
          <rect x="0" y="0" width="380" height="19" rx="4" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" opacity="0.95"/>
          <text x="8" y="13" font-size="10" font-weight="bold" fill="#7E22CE" class="font-mono">⚡ 紫色区: 负Gamma逼空走廊 ($${cfg.gammaCorridor[0]}~$${cfg.gammaCorridor[1]}) · 10/14起灰线与黑线已精准对齐</text>
        </g>

        ${grid1}
        <line x1="${nowX}" y1="${PAD_T}" x2="${nowX}" y2="${H1-PAD_B}" stroke="#DC2626" stroke-dasharray="6 3" stroke-width="1.8"/>
        <polyline fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="3 3" points="${theoPtsStr}"/>
        <polyline fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" points="${histPtsStr}"/>
        <rect x="${nowX}" y="${y1Of(sysTrack.sweepHigh)}" width="${shortEndX-nowX}" height="${Math.max(4, y1Of(sysTrack.sweepLow)-y1Of(sysTrack.sweepHigh))}" fill="#FB7185" opacity="0.28"/>
        <line x1="${nowX}" y1="${y1Of(sysTrack.sweepHigh)}" x2="${shortEndX}" y2="${y1Of(sysTrack.sweepHigh)}" stroke="#E11D48" stroke-width="1.5"/>

        ${showLock ? `<polyline fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="5 3" stroke-linejoin="round" points="${futLockStr}"/>` : ""}

        <g transform="translate(0, ${H1 + 5})">

          ${showLock ? `<polyline fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-dasharray="4 3" stroke-linejoin="round" points="${futLocked.map(d => `${xOf(d[0])},${y2Of(((d[1]/curP)-1)*100)}`).join(" ")}"/>` : ""}
          ${showSys ? `<polyline fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-dasharray="7 4" stroke-linejoin="round" points="${futSys.map(d => `${xOf(d[0])},${y2Of(((d[1]/curP)-1)*100)}`).join(" ")}"/>` : ""}

    }

    function computeAndBuildCompass(m, timeInfo) {
      const { cfg } = m;
      const motherSym = cfg.motherSym || "SOXX";
      const mCfg = MOTHER_INDEX_DB[motherSym];
      const P0 = state.prices[motherSym] || RAW_DB[motherSym].regClose;
      const horizonYrs = state.compassYears;

      const now = timeInfo ? timeInfo.now : new Date();
      const startYear = now.getFullYear();
      const startMonth = now.getMonth() + 1;
      const curQuarter = Math.floor((startMonth - 1) / 3) + 1;
      const nextReanchorMonth = ((curQuarter * 3) % 12) + 1;
      const nextReanchorYear = curQuarter === 4 ? startYear + 1 : startYear;

      const totalSteps = horizonYrs * 24;
      const pts = [];
      const driftPts = [];
      const upperBand = [];
      const lowerBand = [];

      const calcCycleFactor = (tYrs) => {
        const w1 = 0.52 * Math.sin(2 * Math.PI * (tYrs / 1.00 - 0.08 + mCfg.phaseShift));
        const w2 = 0.30 * Math.cos(2 * Math.PI * (tYrs / 1.75 + mCfg.phaseShift));
        const w3 = 0.18 * Math.sin(2 * Math.PI * (tYrs / 3.40 + 0.15));
        return Math.max(-0.98, Math.min(0.98, w1 + w2 + w3));
      };

      const c0 = calcCycleFactor(0);
      for (let i = 0; i <= totalSteps; i++) {
        const t = (i / totalSteps) * horizonYrs;
        const ct = calcCycleFactor(t);
        const driftVal = P0 * Math.exp(mCfg.mu * t);
        const rawP = driftVal * (1.0 + mCfg.amp * ct);
        const normRatio = (1.0 + mCfg.amp * c0);
        const pVal = i === 0 ? P0 : rawP / (i < 6 ? (normRatio * (1 - i/6) + (i/6)) : 1.0);

        const dObj = new Date(now.getTime() + t * 365.25 * 86400000);
        const ymLabel = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, "0")}`;

        pts.push({ idx: i, t, p: pVal, ct, ym: ymLabel });
        driftPts.push({ idx: i, t, p: driftVal });
        upperBand.push({ idx: i, t, p: driftVal * (1.0 + mCfg.amp * 0.92) });
        lowerBand.push({ idx: i, t, p: driftVal * (1.0 - mCfg.amp * 0.88) });
      }

      const extrema = [];
      for (let i = 2; i < pts.length - 2; i++) {
        const prev = pts[i - 1].ct, cur = pts[i].ct, next = pts[i + 1].ct;
        if (cur <= prev && cur <= next && cur < -0.25) {
          if (extrema.length === 0 || extrema[extrema.length - 1].type !== "pit" || (i - extrema[extrema.length - 1].idx) > 6) {
            extrema.push({ ...pts[i], type: "pit", title: "黄金坑大底窗" });
          }
        } else if (cur >= prev && cur >= next && cur > 0.28) {
          if (extrema.length === 0 || extrema[extrema.length - 1].type !== "peak" || (i - extrema[extrema.length - 1].idx) > 6) {
            extrema.push({ ...pts[i], type: "peak", title: "牛市波峰兑现窗" });
          }
        }
      }

      const keyNodes = extrema.slice(0, 6);
      const cardNodes = keyNodes.slice(0, 4);

      const W = 1000, H = 355, PAD_L = 68, PAD_R = 28, PAD_T = 34, PAD_B = 36;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const xOf = (idx) => PAD_L + (idx / totalSteps) * plotW;

      const allVals = [
        ...pts.map(d => d.p),
        ...upperBand.map(d => d.p),
        ...lowerBand.map(d => d.p)
      ];
      const minY = Math.min(...allVals) * 0.93;
      const maxY = Math.max(...allVals) * 1.07;
      const logMin = Math.log(minY), logMax = Math.log(maxY);
      const yOf = (val) => PAD_T + (1 - (Math.log(Math.max(1, val)) - logMin) / (logMax - logMin)) * plotH;

      let gridHtml = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * plotH;
        const pVal = Math.exp(logMax - r * (logMax - logMin));
        const pctFromNow = ((pVal / P0) - 1) * 100;
        gridHtml += `
          <line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>
          <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="10.5" fill="#94A3B8" class="font-mono">$${pVal.toFixed(0)} (${pctFromNow>=0?'+'+pctFromNow.toFixed(0)+'%':pctFromNow.toFixed(0)+'%'})</text>
        `;
      });

      let regimeBandsHtml = "";
      for (let i = 0; i < pts.length - 1; i++) {
        if (pts[i].ct <= -0.38) {
          regimeBandsHtml += `<rect x="${xOf(i)}" y="${PAD_T}" width="${xOf(i+1)-xOf(i)+1}" height="${plotH}" fill="#38BDF8" opacity="0.13"/>`;
        } else if (pts[i].ct >= 0.42) {
          regimeBandsHtml += `<rect x="${xOf(i)}" y="${PAD_T}" width="${xOf(i+1)-xOf(i)+1}" height="${plotH}" fill="#FACC15" opacity="0.12"/>`;
        }
      }

      const rawCompassBoxes = keyNodes.map((nd) => {
        const cx = xOf(nd.idx), cy = yOf(nd.p);
        const isPit = nd.type === "pit";
        const dy = isPit ? 28 : -26;
        const col = isPit ? "#38BDF8" : "#FBBF24";
        const pct = ((nd.p / P0) - 1) * 100;
        return {
          cx, cy,
          bx: cx, by: cy + dy,
          w: 152,
          text: `${nd.ym} ${isPit?'谷':'峰'}:$${nd.p.toFixed(0)}(${pct>=0?'+'+pct.toFixed(0)+'%':pct.toFixed(0)+'%'})`,
          borderCol: col,
          textCol: col,
          dotR: 5.5
        };
      });
      const safeCompassBoxes = resolve2DBoxCollisions(rawCompassBoxes, PAD_T + 16, H - PAD_B - 14, PAD_L + 4, W - PAD_R - 4);
      const nodeBadgesHtml = safeCompassBoxes.map((b) => `
        <line x1="${b.cx}" y1="${b.cy}" x2="${b.bx}" y2="${b.by}" stroke="${b.borderCol}" stroke-width="1.3" stroke-dasharray="2 2"/>
        <circle cx="${b.cx}" cy="${b.cy}" r="${b.dotR}" fill="${b.borderCol}" stroke="#0F172A" stroke-width="1.5"/>
        <g transform="translate(${b.bx}, ${b.by})">
          <rect x="${-b.w/2}" y="-11" width="${b.w}" height="20" rx="5" fill="#0F172A" stroke="${b.borderCol}" stroke-width="1.3" opacity="0.95"/>
          <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="${b.textCol}" class="font-mono">${b.text}</text>
        </g>
      `).join("");

      const xTickStep = Math.max(2, Math.floor(totalSteps / 10));
      let xTicksHtml = "";
      for (let i = 0; i <= totalSteps; i += xTickStep) {
        xTicksHtml += `<text x="${xOf(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#94A3B8" class="font-mono">${pts[i].ym}</text>`;
      }

      const svgHtml = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${plotH}" fill="#0F172A" rx="8"/>
        ${regimeBandsHtml}
        ${gridHtml}
        <polyline fill="none" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" points="${upperBand.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" points="${lowerBand.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#94A3B8" stroke-width="2.0" stroke-dasharray="6 4" points="${driftPts.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>
        <polyline fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linejoin="round" points="${pts.map(d=>`${xOf(d.idx)},${yOf(d.p)}`).join(" ")}"/>

        <g transform="translate(${PAD_L + 12}, 10)">
          <text x="0" y="12" font-size="10.5" font-weight="bold" fill="#38BDF8" class="font-mono">━━ 蓝色实线: P(t)=P₀·e^(μt)·[1+A·C(t)] 周期合成轨</text>
          <text x="340" y="12" font-size="10.5" font-weight="bold" fill="#94A3B8" class="font-mono">┅┅ 灰色虚线: 年化+${(mCfg.mu*100).toFixed(1)}% 宏观漂移中轴</text>
          <text x="630" y="12" font-size="10.5" font-weight="bold" fill="#FACC15" class="font-mono">🟨 金色带: 牛市波峰派发窗</text>
          <text x="805" y="12" font-size="10.5" font-weight="bold" fill="#38BDF8" class="font-mono">🟦 蓝色带: 战略黄金坑抄底窗</text>
        </g>

        <circle cx="${xOf(0)}" cy="${yOf(P0)}" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
        <g transform="translate(${PAD_L + 78}, ${Math.max(PAD_T + 20, yOf(P0) - 20)})">
          <rect x="-70" y="-10" width="140" height="19" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.3"/>
          <text x="0" y="3" text-anchor="middle" font-size="10" font-weight="bold" fill="#FCA5A5" class="font-mono">当前锚点P₀:$${P0.toFixed(1)}</text>
        </g>

        ${nodeBadgesHtml}
        ${xTicksHtml}
      </svg>`;

      return { mCfg, P0, horizonYrs, startYear, curQuarter, nextReanchorYear, nextReanchorMonth, cardNodes, svgHtml };
    }

    function computeIntraday(m, timeInfo) {
      const { cfg, curP, sysTrack, is3x, lockedHigh, isShortFrozen, curVwap } = m;
      const nowIdx = timeInfo.nowIdx;
      const nowFloatIdx = timeInfo.nowFloatIdx;
      const openIdx = 7;
      const closeIdx = 14;

      let vwap = curVwap;
      const isBlowOffTop = !cfg.isInverse && !isShortFrozen && (lockedHigh >= cfg.theoToday * 0.95);
      const isAlreadyBelowVwap = isBlowOffTop && (curP < vwap);

      let majorSupLow, majorSupHigh, demandLow, demandHigh, microRes, midTarget, stopHuntExtreme;
      if (isBlowOffTop) {
        majorSupHigh = Math.max(lockedHigh, cfg.regClose, cfg.theoToday, vwap * (is3x ? 1.035 : 1.008));
        majorSupLow = Math.max(vwap * (is3x ? 1.012 : 1.003), Math.min(cfg.regClose, cfg.theoToday, majorSupHigh * (is3x ? 0.965 : 0.990)));

        const rawTargetLow = Math.min(cfg.intraLow, sysTrack.p1118, curP * (is3x ? 0.925 : 0.978));
        const rawTargetHigh = Math.min(curP * (is3x ? 0.968 : 0.990), Math.max(rawTargetLow * (is3x ? 1.035 : 1.006), cfg.intraLow));
        demandLow = rawTargetLow;
        demandHigh = Math.max(rawTargetLow + (is3x ? 0.8 : 1.5), rawTargetHigh);
        stopHuntExtreme = Math.min(sysTrack.p1118, demandLow * (is3x ? 0.975 : 0.992));

        if (isAlreadyBelowVwap) {
          microRes = curP + (vwap - curP) * 0.85;
          midTarget = (curP + demandHigh) * 0.5;
        } else {
          microRes = curP >= majorSupLow ? Math.min(majorSupHigh, curP * 1.012) : curP + (majorSupLow - curP) * 0.70;
          midTarget = vwap * (is3x ? 0.985 : 0.996);
        }
      } else if (cfg.isInverse) {
        majorSupLow = Math.max(cfg.regClose * 1.05, curP * 1.045);
        majorSupHigh = Math.max(cfg.regClose * 1.10, curP * 1.085);
        demandLow = Math.min(cfg.intraLow, curP * 0.965);
        demandHigh = Math.min(vwap * 0.992, curP * 0.985);
        microRes = Math.max(vwap, curP * 1.015);
        midTarget = (curP + majorSupLow) * 0.5;
        stopHuntExtreme = demandLow * 0.975;
      } else {
        majorSupLow = Math.max(curP * 1.035, vwap * 1.025);
        majorSupHigh = Math.max(curP * 1.065, vwap * 1.045);
        demandLow = Math.min(curP * 0.975, vwap * 0.980);
        demandHigh = Math.min(curP * 0.988, vwap * 0.990);
        microRes = curP * 1.015;
        midTarget = vwap * 1.015;
        stopHuntExtreme = demandLow * 0.985;
      }

      const rawMorning = [...cfg.lockedMorningPts];
      const scaleShift = curP / (rawMorning[Math.min(3, rawMorning.length - 1)] || curP);
      const baseMorning = rawMorning.map(v => (scaleShift < 0.82 || scaleShift > 1.22) ? parseFloat((v * scaleShift).toFixed(2)) : v);

      const pastPts = [];
      for (let i = 0; i <= Math.floor(nowFloatIdx); i++) {
        if (Math.abs(nowFloatIdx - i) < 0.04) break;
        const fallbackVal = i < baseMorning.length ? baseMorning[i] : parseFloat((baseMorning[baseMorning.length - 1] * 0.4 + curP * 0.6).toFixed(2));
        pastPts.push([i, fallbackVal]);
      }
      pastPts.push([nowFloatIdx, curP]);

      const pathA = [[nowFloatIdx, curP]], pathB = [[nowFloatIdx, curP]], pathC = [[nowFloatIdx, curP]];
      const tmplA = isBlowOffTop
        ? [
            [2, curP * 0.995], [3, curP], [4, (curP + microRes) * 0.5], [5, microRes * 0.996],
            [6, (curP + microRes) * 0.5], [7, curP * 0.998], [8, microRes], [9, (microRes + midTarget) * 0.5],
            [10, midTarget], [11, (midTarget + demandHigh) * 0.5], [12, demandHigh * 1.004],
            [13, (demandLow + demandHigh) * 0.5], [14, demandHigh * 0.998], [15, demandLow * 1.002], [16, demandLow]
          ]
        : [
            [2, curP * 0.995], [3, curP], [4, (curP + demandHigh) * 0.5], [5, demandHigh * 1.002],
            [6, curP * 0.998], [7, demandHigh * 0.998], [8, (demandLow + demandHigh) * 0.5], [9, vwap * 1.002],
            [10, midTarget], [11, (midTarget + majorSupLow) * 0.5], [12, majorSupLow * 0.998],
            [13, (majorSupLow + majorSupHigh) * 0.5], [14, majorSupLow * 1.005], [15, majorSupLow], [16, majorSupLow * 1.002]
          ];
      const tmplB = isBlowOffTop
        ? [
            [2, curP * 1.004], [3, curP * 1.006], [4, vwap * 0.998], [5, vwap * 1.004],
            [6, majorSupLow * 0.995], [7, majorSupLow], [8, majorSupHigh * 0.988], [9, majorSupLow * 0.995],
            [10, vwap * 1.002], [11, vwap * 0.996], [12, curP * 1.002], [13, curP * 0.998],
            [14, curP], [15, curP * 0.996], [16, curP * 0.995]
          ]
        : [
            [2, curP * 1.005], [3, curP * 1.008], [4, microRes], [5, microRes * 1.008],
            [6, microRes * 1.012], [7, microRes * 1.005], [8, majorSupLow * 0.992], [9, majorSupLow * 1.002],
            [10, majorSupHigh * 0.992], [11, majorSupHigh * 1.002], [12, majorSupHigh * 1.008],
            [13, majorSupHigh * 1.015], [14, majorSupHigh * 1.010], [15, majorSupHigh * 1.012], [16, majorSupHigh * 1.015]
          ];
      const tmplC = isBlowOffTop
        ? [
            [2, curP * 0.985], [3, midTarget], [4, demandHigh * 1.005], [5, demandHigh * 0.998],
            [6, demandLow * 1.005], [7, demandLow], [8, (demandLow + stopHuntExtreme) * 0.5], [9, stopHuntExtreme * 1.008],
            [10, stopHuntExtreme], [11, stopHuntExtreme * 0.995], [12, stopHuntExtreme * 0.998],
            [13, demandLow * 0.995], [14, demandLow], [15, demandLow * 0.998], [16, demandLow]
          ]
        : [
            [2, curP * 0.990], [3, demandHigh * 0.998], [4, demandLow * 0.998], [5, demandLow * 0.992],
            [6, demandLow * 0.995], [7, demandLow * 0.990], [8, stopHuntExtreme], [9, demandLow * 1.002],
            [10, vwap * 0.998], [11, vwap * 1.005], [12, vwap * 1.012], [13, vwap * 1.018],
            [14, vwap * 1.015], [15, vwap * 1.012], [16, vwap * 1.015]
          ];

      pathA.push(...tmplA.filter(d => d[0] > nowFloatIdx + 0.08));
      pathB.push(...tmplB.filter(d => d[0] > nowFloatIdx + 0.08));
      pathC.push(...tmplC.filter(d => d[0] > nowFloatIdx + 0.08));

      return {
        nowIdx, nowFloatIdx, bjtHM: timeInfo.bjtHM, estHM: timeInfo.estHM,
        openIdx, closeIdx, isBlowOffTop, isAlreadyBelowVwap, isShortFrozen,
        vwap, demandLow, demandHigh, microRes, midTarget, majorSupLow, majorSupHigh, stopHuntExtreme,
        pastPts, pathA, pathB, pathC
      };
    }

    function buildIntraSvg(intra, m) {
      const W = 1000, H = 370, PAD_L = 66, PAD_R = 26, PAD_T = 36, PAD_B = 40;
      const plotW = W - PAD_L - PAD_R;
      const plotH = H - PAD_T - PAD_B;
      const xOf = (idx) => PAD_L + (idx / (INTRA_SLOTS.length - 1)) * plotW;

      const allVals = [
        ...intra.pastPts.map(d => d[1]), ...intra.pathA.map(d => d[1]),
        ...intra.pathB.map(d => d[1]), ...intra.pathC.map(d => d[1]),
        intra.majorSupHigh, intra.demandLow, intra.stopHuntExtreme, intra.vwap
      ];
      const minY = Math.min(...allVals) * 0.991;
      const maxY = Math.max(...allVals) * 1.009;
      const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * plotH;

      let grid = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * plotH;
        const pVal = maxY - r * (maxY - minY);

              <form id="loginForm" class="space-y-4">
                <input id="pinInput" type="password" placeholder="请输入访问密码..." autofocus class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white text-center font-mono text-lg tracking-widest focus:outline-none"/>
                ${state.pinError ? `<p class="text-xs text-rose-400 text-center font-mono">❌ 访问口令错误，请重试</p>` : ""}
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">🔓 验证并进入实时终端</button>
              </form>
            </div>
          </div>`;
        const form = document.getElementById("loginForm");
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById("pinInput").value.trim();
            if (val === ACCESS_PIN) {
              try { localStorage.setItem(AUTH_KEY, ACCESS_PIN); } catch (err) {}
              state.isAuthed = true; state.pinError = false; renderFullShell();
            } else {
              state.pinError = true; renderFullShell();
            }
          };
        }
        return;
      }

      const cfg = RAW_DB[state.ticker];
      const curP = state.prices[state.ticker] || cfg.regClose;

      root.innerHTML = `
        <header class="flex flex-wrap justify-between items-center bg-white px-4 md:px-6 py-3.5 rounded-2xl shadow-sm border border-slate-200 gap-3">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <button id="liveBtn" onclick="toggleLive()"></button>
              <span id="clockBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-slate-900 text-amber-300"></span>
              <span id="countdownBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
              <h1 id="headerTitle" class="text-base md:text-lg font-bold text-slate-900"></h1>
            </div>
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <button onclick="setView('all')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='all'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">⚡ 四层全开 (24H日内 + 周内5日 + 2~3月波段 + 1~5年罗盘)</button>
              <button onclick="setView('intraday')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='intraday'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📈 一层：24H日内</button>
              <button onclick="setView('weekly5d')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='weekly5d'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">🗓️ 二层：周内5日</button>
              <button onclick="setView('macro')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='macro'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📅 三层：2~3月波段</button>
              <button onclick="setView('compass')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='compass'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">🧭 四层：1~5年罗盘</button>
              <button onclick="toggleClean()" class="px-2.5 py-1 text-xs font-bold rounded-lg border ${state.cleanShot?'bg-rose-600 text-white border-rose-700':'bg-slate-50 text-slate-700 border-slate-300'}">${state.cleanShot?'📸 退出群聊截图模式':'📸 群聊截图模式'}</button>
              <button onclick="logout()" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-500">🔒 锁定</button>
            </div>
          </div>
          <div id="tickerButtons" class="flex items-center gap-1.5 flex-wrap"></div>
        </header>

        <div id="gammaBanner"></div>
        <div id="barrierBanner" class="grid grid-cols-1 md:grid-cols-2 gap-3 font-mono text-xs"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          ${!state.cleanShot ? `
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span id="sliderStatusLabel" class="text-sm font-bold text-slate-800"></span>
                  <span id="sliderPriceVal" class="text-lg font-mono font-bold text-indigo-600"></span>
                </div>
                <input id="priceSlider" type="range" min="${cfg.minP}" max="${cfg.maxP}" step="${cfg.step}" value="${curP}" class="w-full accent-indigo-600 cursor-pointer"/>
                <div class="flex justify-between text-[11px] text-slate-400 font-mono mt-1 mb-3">
                  <span>$${cfg.minP.toFixed(1)}</span>
                  <button onclick="toggleLive(true)" class="text-emerald-600 font-bold underline">点此恢复公网实时自动同步</button>
                  <span>$${cfg.maxP.toFixed(1)}</span>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
                ${cfg.presets.map((p, idx) => `
                  <button onclick="applyPreset(${idx})" class="px-2.5 py-2 text-[11.5px] rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 font-mono font-semibold text-slate-700 text-left transition">${p.label}</button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div id="diagPanel" class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 ${state.cleanShot?'lg:col-span-12':'lg:col-span-7'}"></div>
        </div>

        <div id="intraSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-indigo-500/30 space-y-4"></div>
        <div id="weekly5dSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-purple-500/30 space-y-4"></div>
        <div id="macroSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-blue-500/30 space-y-4"></div>
        <div id="compassSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-amber-500/40 space-y-4"></div>
      `;

      const slider = document.getElementById("priceSlider");
      if (slider) {
        slider.addEventListener("input", (e) => {
          state.isLive = false;
          state.prices[state.ticker] = parseFloat(e.target.value);
          updateDynamicSections();
        });
      }

      updateDynamicSections();
    }

    window.toggleLive = (forceTrue) => {
      state.isLive = forceTrue ? true : !state.isLive;
      state.customBaseTheo = null;
      state.anchorDt = "11/12";
      updateDynamicSections();
    };
    window.setView = (v) => { state.viewMode = v; renderFullShell(); };
    window.setTacticalMode = (tm) => { state.tacticalMode = tm; updateDynamicSections(); };
    window.setCompassYears = (yrs) => { state.compassYears = yrs; updateDynamicSections(); };
    window.setEngine = (e) => { state.cycleEngine = e; updateDynamicSections(); };
    window.setIntra = (s) => { state.intraScenario = s; updateDynamicSections(); };
    window.toggleClean = () => { state.cleanShot = !state.cleanShot; renderFullShell(); };
    window.logout = () => { try { localStorage.removeItem(AUTH_KEY); } catch(e){} state.isAuthed = false; renderFullShell(); };
    window.selectTicker = (sym) => { state.ticker = sym; state.customBaseTheo = null; state.anchorDt = "11/12"; renderFullShell(); };
    window.applyPreset = (idx) => {
      const p = RAW_DB[state.ticker].presets[idx];
      if (!p) return;
      state.isLive = false;
      state.prices[state.ticker] = p.val;
      state.customBaseTheo = p.baseTheo;
      state.anchorDt = p.anchorDt || "11/12";
      const slider = document.getElementById("priceSlider");
      if (slider) slider.value = p.val;
      updateDynamicSections();
    };
    window.copyReport = () => {
      const timeInfo = getRealTimeSlotInfo();
      const m = computeAll(timeInfo);
      const weekly5d = computeAndBuildWeekly5D(m, timeInfo);
      const compass = computeAndBuildCompass(m, timeInfo);
      const w5Str = weekly5d.future5Days.map(d => `${d.tLabel}(${d.mmdd}):$${d.p.toFixed(2)}[顶$${d.ceiling.toFixed(1)}/底$${d.floor.toFixed(1)}]`).join(" ➔ ");
      const nextNodesStr = compass.cardNodes.map(n => `${n.ym}(${n.type==='pit'?'黄金坑':'波峰'} $${n.p.toFixed(0)})`).join(" ➔ ");
      const text = `📊 **【${state.ticker} 周期系统逻辑理论 V6.0 四层全周期实盘战报】**\n` +
        `● **一层 [24H日内伽马雷达]**: ${m.gammaStatus.badge} | 现价 $${m.curP.toFixed(2)} | VWAP $${m.curVwap.toFixed(2)}\n` +
        `● **二层 [周内1~5日高低点走廊]**: ${w5Str}\n` +
        `● **三层 [未来2~3月滚动波段轨]**: ${m.sysTrack.dt1}中继 $${m.sysTrack.p1118.toFixed(2)} ➔ **${m.sysTrack.dt2}节点 $${m.sysTrack.p1126.toFixed(2)}** ➔ ${m.sysTrack.dt3}节点 $${m.sysTrack.p1210.toFixed(2)}\n` +
        `● **四层 [${compass.mCfg.sym} 未来${compass.horizonYrs}年宏观牛熊罗盘]**: ${nextNodesStr}`;
      navigator.clipboard.writeText(text);
      state.copied = true; updateDynamicSections();
      setTimeout(() => { state.copied = false; updateDynamicSections(); }, 2000);
    };

    async function syncQuotes() {
      if (!state.isAuthed || !state.isLive) return;
      try {
        await Promise.all(TICKER_ORDER.map(async (sym) => {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d&includePrePost=true`;
          const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
          ];
          for (const pUrl of proxies) {
            try {
              const r = await fetch(pUrl);
              if (!r.ok) continue;
              const j = await r.json();
              const res0 = j?.chart?.result?.[0];
              const meta = res0?.meta;
              const q = res0?.indicators?.quote?.[0];
              if (meta) {
                let latest = meta.postMarketPrice || meta.preMarketPrice || meta.regularMarketPrice;
                let maxH = RAW_DB[sym].intraHigh, minL = RAW_DB[sym].intraLow, sumPV = 0, sumV = 0;
                if (q && Array.isArray(q.close)) {
                  for (let k = 0; k < q.close.length; k++) {
                    const c = q.close[k], h = q.high?.[k], l = q.low?.[k], v = q.volume?.[k] || 0;
                    if (c !== null && c > 0) {
                      latest = c;
                      if (h && h > maxH) maxH = h;
                      if (l && l < minL) minL = l;
                      if (v > 0) { sumPV += c * v; sumV += v; }
                    }
                  }
                }
                if (latest && latest > 0) {
                  state.prices[sym] = parseFloat(latest.toFixed(2));
                  if (sym === state.ticker) {
                    const slider = document.getElementById("priceSlider");
                    if (slider) slider.value = state.prices[sym];
                  }
                }
                state.realIntraStats[sym] = {
                  high: parseFloat(maxH.toFixed(2)),
                  low: parseFloat(minL.toFixed(2)),
                  vwap: sumV > 0 ? parseFloat((sumPV / sumV).toFixed(2)) : RAW_DB[sym].fixedVwap
                };
                break;
              }
            } catch (innerE) {}
          }
        }));
        state.liveStatus = `云端公网实时 (${getRealTimeSlotInfo().bjtStr})`;
        updateDynamicSections();
      } catch (e) {}
    }

    renderFullShell();
    setInterval(() => { if (state.isAuthed) updateDynamicSections(); }, 1000);
    setInterval(syncQuotes, 8000);
    syncQuotes();
  </script>
</body>
</html>
