    function getRealTimeSlotInfo() {
      const now = new Date();

      const [h, m, s] = bjtStr.split(":").map(Number);

      let minFrom16 = 330;
      if (h >= 16) minFrom16 = (h - 16) * 60 + m;
      else if (h < 9) minFrom16 = (h + 8) * 60 + m;

      let bestIdx = 8;
      for (let i = 1; i < INTRA_SLOTS.length - 1; i++) {
        if (minFrom16 >= INTRA_SLOTS[i].minFrom16) bestIdx = i;
      }

      const curSec = ((h >= 16 ? h - 16 : h + 8) * 3600) + m * 60 + (s || 0);
      const openSec = (22 - 16) * 3600 + 30 * 60;
      let countdownText = "🔥 美股正盘交易进行中";
      if (curSec < openSec && h >= 16) {
        const diff = openSec - curSec;
        countdownText = `距 22:30 美股开盘 ${Math.floor(diff/3600)}h ${Math.floor((diff%3600)/60)}m ${diff%60}s`;
      } else if (h >= 5 && h < 16) {

      const spreadRatio = (curP / activeTheoNow) - 1.0;
      const spreadPct = spreadRatio * 100;

      const theoMap = Object.fromEntries(cfg.theoCurve);
      const baseWeight = cfg.reversionWeights[state.anchorDt] || 0.75;
      const calcSysRev = (dtLabel) => {
        const baseT = theoMap[dtLabel] || activeTheoNow;
        const w = (cfg.reversionWeights[dtLabel] ?? 0.05) / baseWeight;
        return baseT * (1.0 + spreadRatio * w);
      };

      const stat = state.realIntraStats[state.ticker] || {};
      const is3x = cfg.betaDecay > 0;
      const lockedHigh = Math.max(cfg.intraHigh, stat.high || 0, curP * (is3x ? 1.012 : 1.003));
      const isAlreadyAtTheoCeiling = !cfg.isInverse && (lockedHigh >= cfg.theoToday * 0.95 || curP > cfg.regClose * 1.025);

      const topLow = Math.min(lockedHigh * 0.992, Math.max(curP * 0.995, cfg.theoToday * 0.985));
      const topHigh = Math.max(lockedHigh, curP * 1.006, cfg.theoToday);

        sweepLow: isAlreadyAtTheoCeiling ? topLow : curP * cfg.mmRadarRatios.sweep[0],
        sweepHigh: isAlreadyAtTheoCeiling ? topHigh : curP * cfg.mmRadarRatios.sweep[1]

      const dFactor = 1.0 - cfg.betaDecay;

    function computeIntraday(m, timeInfo) {
      const { cfg, curP, sysTrack, is3x, lockedHigh } = m;
      const nowIdx = timeInfo.nowIdx;
      const openIdx = 9;
      const stat = state.realIntraStats[state.ticker] || {};

      let vwap = stat.vwap || cfg.fixedVwap;
      if (!cfg.isInverse && (vwap >= curP * 0.995 || vwap <= cfg.regClose)) {
        vwap = parseFloat((cfg.regClose * 0.42 + curP * 0.58).toFixed(2));
      }

      const dayGainPct = ((lockedHigh - cfg.regClose) / cfg.regClose) * 100;
      const isBlowOffTop = !cfg.isInverse && (lockedHigh >= cfg.theoToday * 0.95 || dayGainPct >= (is3x ? 7.5 : 1.8));

      let majorSupLow, majorSupHigh, demandLow, demandHigh, microRes, stopHuntExtreme;
      if (isBlowOffTop) {
        majorSupHigh = Math.max(lockedHigh, cfg.theoToday, curP * (is3x ? 1.022 : 1.006));
        majorSupLow = Math.max(curP * (is3x ? 1.005 : 1.001), majorSupHigh * (is3x ? 0.978 : 0.992));
        microRes = curP + (majorSupHigh - curP) * 0.60;
        const rawTargetLow = Math.min(cfg.regClose * (is3x ? 1.025 : 1.002), sysTrack.p1118, vwap * (is3x ? 0.915 : 0.982));
        const rawTargetHigh = Math.min(vwap * (is3x ? 0.945 : 0.990), Math.max(rawTargetLow * (is3x ? 1.024 : 1.006), sysTrack.p1118));
        demandLow = rawTargetLow;
        demandHigh = Math.max(rawTargetLow + (is3x ? 0.8 : 1.5), rawTargetHigh);
        stopHuntExtreme = Math.min(cfg.regClose, demandLow * (is3x ? 0.980 : 0.993));
      } else if (cfg.isInverse) {
        majorSupLow = cfg.regClose * 0.965;
        majorSupHigh = cfg.regClose * 1.015;
        demandLow = Math.min(cfg.intraLow, curP * 0.975);
        demandHigh = Math.min(vwap * 0.985, curP * 0.992);
        microRes = vwap;
        stopHuntExtreme = demandLow * 0.975;
      } else {
        majorSupLow = Math.max(curP * 1.015, vwap * 1.012);
        majorSupHigh = Math.max(curP * 1.028, vwap * 1.024);
        demandLow = Math.min(curP * 0.982, vwap * 0.985);
        demandHigh = Math.min(curP * 0.990, vwap * 0.992);
        microRes = curP * 1.005;
        stopHuntExtreme = demandLow * 0.988;
      }

      const baseMorning = [...cfg.lockedMorningPts];
      if (curP > baseMorning[5]) {
        const ratio = lockedHigh / baseMorning[5];
        for (let k = 1; k < baseMorning.length; k++) {
          baseMorning[k] = cfg.regClose + (baseMorning[k] - cfg.regClose) * ratio;
        }
      }
      const pastPts = [];
      for (let i = 0; i < nowIdx; i++) {
        pastPts.push([i, i < baseMorning.length ? baseMorning[i] : baseMorning[baseMorning.length - 1]]);
      }
      pastPts.push([nowIdx, curP]);

      const pathA = [[nowIdx, curP]], pathB = [[nowIdx, curP]], pathC = [[nowIdx, curP]];
      const tmplA = isBlowOffTop
        ? [[8,curP*0.998],[9,curP+(microRes-curP)*0.45],[10,microRes],[11,(microRes+vwap)*0.5],[12,vwap*(is3x?0.982:0.995)],[13,(vwap+demandHigh)*0.5],[14,demandHigh],[15,(demandLow+demandHigh)*0.5],[16,demandHigh*0.998]]
        : [[8,curP*0.996],[9,demandHigh*0.995],[10,(demandLow+demandHigh)*0.5],[11,vwap*0.998],[12,vwap*1.018],[13,(vwap+majorSupLow)*0.5],[14,majorSupLow*1.002],[15,(majorSupLow+majorSupHigh)*0.5],[16,majorSupLow*1.005]];
      const tmplB = isBlowOffTop
        ? [[8,curP*1.001],[9,microRes*0.998],[10,majorSupLow],[11,majorSupHigh*0.998],[12,majorSupLow*0.995],[13,curP*0.996],[14,vwap*1.005],[15,vwap*1.001],[16,vwap*1.003]]
        : [[8,curP*1.005],[9,vwap*1.005],[10,vwap*1.022],[11,majorSupLow*1.005],[12,majorSupHigh*1.005],[13,majorSupHigh*1.022],[14,majorSupHigh*1.015],[15,majorSupHigh*1.028],[16,majorSupHigh*1.020]];
      const tmplC = isBlowOffTop
        ? [[8,curP*0.992],[9,vwap*0.998],[10,demandHigh],[11,demandLow],[12,(demandLow+stopHuntExtreme)*0.5],[13,stopHuntExtreme],[14,demandLow*0.998],[15,demandLow*1.002],[16,demandLow]]
        : [[8,curP*0.990],[9,demandLow*0.995],[10,stopHuntExtreme],[11,demandHigh*1.002],[12,vwap*0.998],[13,vwap*1.008],[14,vwap*1.015],[15,majorSupLow*0.995],[16,vwap*1.012]];

      pathA.push(...tmplA.filter(d => d[0] > nowIdx));
      pathB.push(...tmplB.filter(d => d[0] > nowIdx));
      pathC.push(...tmplC.filter(d => d[0] > nowIdx));

      return { nowIdx, openIdx, isBlowOffTop, vwap, demandLow, demandHigh, microRes, majorSupLow, majorSupHigh, stopHuntExtreme, baseMorningPeak: baseMorning[5], pastPts, pathA, pathB, pathC };

                    <div class="text-[11px] text-slate-600 mt-1.5">低位换手筑底，等待正盘确认</div>
                  </div>
                  <div class="p-3.5 rounded-2xl bg-emerald-50/80 border-l-4 border-l-emerald-600 border border-emerald-200">
                    <div class="flex justify-between text-emerald-800 font-bold"><span>STEP 2 · 开盘决战窗</span><span class="bg-emerald-100 px-2 py-0.5 rounded">22:30-23:15</span></div>
                    <div class="text-emerald-700 font-extrabold text-[15px] mt-1.5">回踩需求区: $${intra.demandLow.toFixed(2)}~$${intra.demandHigh.toFixed(2)}</div>
                    <div class="text-[11px] text-emerald-800 mt-1.5 font-semibold">🎯 开盘回测右脚不破，右侧最佳低吸/做T点</div>
                  </div>
                  <div class="p-3.5 rounded-2xl bg-indigo-50/80 border-l-4 border-l-indigo-600 border border-indigo-200">
                    <div class="flex justify-between text-indigo-900 font-bold"><span>STEP 3 · 盘中主升段</span><span class="bg-indigo-100 px-2 py-0.5 rounded">23:15-02:30</span></div>
                    <div class="text-indigo-700 font-extrabold text-[15px] mt-1.5">攻克 VWAP: $${intra.vwap.toFixed(2)}</div>
                    <div class="text-[11px] text-indigo-800 mt-1.5 font-semibold">🚀 放量站稳分时VWAP均线($${intra.vwap.toFixed(2)})，触发回补主升</div>
                  </div>
                  <div class="p-3.5 rounded-2xl bg-rose-50/80 border-l-4 border-l-rose-600 border border-rose-200">
                    <div class="flex justify-between text-rose-900 font-bold"><span>STEP 4 · 尾盘止盈窗</span><span class="bg-rose-100 px-2 py-0.5 rounded">02:30-05:00</span></div>
                    <div class="text-rose-700 font-extrabold text-[15px] mt-1.5">冲击阻力带: $${intra.majorSupLow.toFixed(2)}~$${intra.majorSupHigh.toFixed(2)}</div>
                    <div class="text-[11px] text-rose-800 mt-1.5 font-semibold">💰 尾盘摸高目标阻力区，分批止盈50%</div>
                  </div>
                </div>
              `}
            </div>
            <div class="w-full overflow-x-auto">${buildIntraSvg(intra, m)}</div>
          </div>
        ` : ""}

        ${(state.viewMode === "both" || state.viewMode === "macro") ? `
          <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-blue-500/30 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-3">
              <div>
                <h2 class="text-base md:text-lg font-bold text-slate-900">📅 【个股量化实盘推演 V3.5 · 周期系统逻辑理论乖离均值回归校准】${state.ticker} - ${cfg.name}</h2>
                <p class="text-xs text-slate-500 font-mono mt-0.5">黑色实线: 逐日真实K线收盘价 (自然日比例) · 灰色点线: 10/14周期系统逻辑理论母版 · 蓝色粗虚线: 乖离均值回归动态轨</p>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="setEngine('dual')" class="px-3 py-1.5 text-xs font-bold rounded-xl ${state.cycleEngine==='dual'?'bg-indigo-600 text-white shadow':'bg-slate-100 text-slate-600'}">🔥 双轨同屏</button>
                <button onclick="setEngine('sys')" class="px-3 py-1.5 text-xs font-bold rounded-xl ${state.cycleEngine==='sys'?'bg-blue-600 text-white shadow':'bg-slate-100 text-slate-600'}">💎 仅看周期系统逻辑轨 (11/26 ➔ $${sysTrack.p1126.toFixed(2)})</button>
                <button onclick="setEngine('locked')" class="px-3 py-1.5 text-xs font-bold rounded-xl ${state.cycleEngine==='locked'?'bg-purple-700 text-white shadow':'bg-slate-100 text-slate-600'}">🛡️ 仅看${is3x?'3x磨损锁锚轨':'10/14母版轨'} (11/26 ➔ $${lockedTrack.p1126.toFixed(2)})</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs font-mono bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
              <div class="p-3 rounded-xl bg-amber-50/90 border-l-4 border-l-amber-500 border border-amber-200">
                <div class="text-amber-900 font-bold">PHASE 1 · 当前实盘锚点 (${state.anchorDt})</div>
                <div class="text-amber-700 font-extrabold text-sm mt-1">现价: $${curP.toFixed(2)}</div>
                <div class="text-[11px] text-amber-800 mt-1">周期系统逻辑理论位: $${activeTheoNow.toFixed(2)}</div>
              </div>
              <div class="p-3 rounded-xl bg-purple-50/90 border-l-4 border-l-purple-600 border border-purple-200">
                <div class="text-purple-900 font-bold">PHASE 2 · 11/18 震荡中继</div>
                <div class="text-purple-700 font-extrabold text-sm mt-1">系统逻辑轨 $${sysTrack.p1118.toFixed(2)} | ${is3x?'磨损轨':'母版轨'} $${lockedTrack.p1118.toFixed(2)}</div>
                <div class="text-[11px] text-purple-800 mt-1">财报消化后回撤中继，空单减半锁利</div>
              </div>
              <div class="p-3 rounded-xl bg-blue-50/90 border-l-4 border-l-blue-600 border border-blue-300">
                <div class="text-blue-900 font-bold">PHASE 3 · 11/26 终极黄金坑</div>
                <div class="text-blue-700 font-extrabold text-sm mt-1">系统逻辑轨 $${sysTrack.p1126.toFixed(2)} | ${is3x?'磨损轨':'母版轨'} $${lockedTrack.p1126.toFixed(2)}</div>
                <div class="text-[11px] text-blue-900 mt-1 font-semibold">🎯 W底黄金右脚，战略级满仓抄底点</div>
              </div>
              <div class="p-3 rounded-xl bg-emerald-50/90 border-l-4 border-l-emerald-600 border border-emerald-200">
                <div class="text-emerald-900 font-bold">PHASE 4 · 12/10 跨年主升峰</div>
                <div class="text-emerald-700 font-extrabold text-sm mt-1">系统逻辑轨 $${sysTrack.p1210.toFixed(2)} | ${is3x?'磨损轨':'母版轨'} $${lockedTrack.p1210.toFixed(2)}</div>
                <div class="text-[11px] text-emerald-800 mt-1">🚀 圣诞跨年主升浪波峰兑现区</div>
              </div>
            </div>

            <div class="w-full overflow-x-auto">${buildMacroSvg(m)}</div>
          </div>
        ` : ""}
      `;

      const slider = document.getElementById("priceSlider");
      if (slider) {
        slider.oninput = (e) => {
          state.isLive = false;
          state.prices[state.ticker] = parseFloat(e.target.value);
          render();
        };
      }
    }

    window.toggleLive = (forceTrue) => {
      state.isLive = forceTrue ? true : !state.isLive;
      state.customBaseTheo = null;
      state.anchorDt = "11/11";
      render();
    };
    window.setView = (v) => { state.viewMode = v; render(); };
    window.setEngine = (e) => { state.cycleEngine = e; render(); };
    window.setIntra = (s) => { state.intraScenario = s; render(); };
    window.toggleClean = () => { state.cleanShot = !state.cleanShot; render(); };
    window.logout = () => { try { localStorage.removeItem(AUTH_KEY); } catch(e){} state.isAuthed = false; render(); };
    window.selectTicker = (sym) => { state.ticker = sym; state.customBaseTheo = null; state.anchorDt = "11/11"; render(); };
    window.applyPreset = (idx) => {
      const p = RAW_DB[state.ticker].presets[idx];
      if (!p) return;
      state.isLive = false;
      state.prices[state.ticker] = p.val;
      state.customBaseTheo = p.baseTheo;
      state.anchorDt = p.anchorDt || "11/11";
      render();
    };
    window.copyReport = () => {
      const m = computeAll();
      const t = getRealTimeSlotInfo();
      const text = `📊 **【${state.ticker} 周期系统逻辑理论 V3.5 实盘推演战报】**\n` +
        `● **现价锚点**: $${m.curP.toFixed(2)} | 今日理论位 $${m.activeTheoNow.toFixed(2)} (乖离 ${m.spreadPct.toFixed(1)}%)\n` +
        `● **💎 [周期系统逻辑理论轨]**: 11/18中继 $${m.sysTrack.p1118.toFixed(2)} ➔ **11/26黄金坑 $${m.sysTrack.p1126.toFixed(2)}** ➔ 12/10主升峰 $${m.sysTrack.p1210.toFixed(2)}\n` +
        `● **🛡️ [基准锁锚对照轨]**: 11/18中继 $${m.lockedTrack.p1118.toFixed(2)} ➔ **11/26右脚 $${m.lockedTrack.p1126.toFixed(2)}** ➔ 12/10峰 $${m.lockedTrack.p1210.toFixed(2)}`;
      navigator.clipboard.writeText(text);
      state.copied = true; render();
      setTimeout(() => { state.copied = false; render(); }, 2000);
    };

    async function syncQuotes() {
      if (!state.isAuthed || !state.isLive) return;
      try {
        await Promise.all(TICKER_ORDER.map(async (sym) => {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d&includePrePost=true`;
          const pUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const r = await fetch(pUrl);
          if (!r.ok) return;
          const j = await r.json();
          const res0 = j?.chart?.result?.[0];
          const meta = res0?.meta;
          const q = res0?.indicators?.quote?.[0];
          if (meta) {
            let latest = meta.regularMarketPrice;
            let maxH = RAW_DB[sym].intraHigh, minL = RAW_DB[sym].intraLow, sumPV = 0, sumV = 0;
            if (q && Array.isArray(q.close)) {
              for (let k = 0; k < q.close.length; k++) {
                const c = q.close[k], h = q.high?.[k], l = q.low?.[k], v = q.volume?.[k] || 0;
                if (c !== null && c > 0) {
                  latest = c;
                  if (h && h > maxH) maxH = h;
                  if (l && l < minL) minL = l;
                  if (v > 0) { sumPV += c * v; sumV += v; }
                }
              }
            }
            if (latest && latest > 0) state.prices[sym] = parseFloat(latest.toFixed(2));
            state.realIntraStats[sym] = {
              high: parseFloat(maxH.toFixed(2)),
              low: parseFloat(minL.toFixed(2)),
              vwap: sumV > 0 ? parseFloat((sumPV / sumV).toFixed(2)) : RAW_DB[sym].fixedVwap
            };
          }
        }));
        state.liveStatus = `云端公网实时 (${getRealTimeSlotInfo().bjtStr})`;
        render();
      } catch (e) {}
    }

    render();
    setInterval(() => { if (state.isAuthed) render(); }, 1000);
    setInterval(syncQuotes, 8000);
    syncQuotes();
  </script>
</body>
</html>
