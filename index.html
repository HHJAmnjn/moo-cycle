    function getRealTimeSlotInfo() {
      const now = new Date();
      const bjtStr = now.toLocaleTimeString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
      const estStr = now.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour12: false });
      const [h, m, s] = bjtStr.split(":").map(Number);
      const [eh, em] = estStr.split(":").map(Number);
      const bjtHM = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
      const estHM = `${String(eh).padStart(2,"0")}:${String(em).padStart(2,"0")}`;

      // 计算距离当日 08:00 BJT (美东夜盘 20:00/19:00) 的分钟数 (0 ~ 1440)
      let exactMin = 0;
      if (h >= 8) {
        exactMin = (h - 8) * 60 + m + (s || 0) / 60;
      } else {
        exactMin = (h + 16) * 60 + m + (s || 0) / 60;
      }
      exactMin = Math.max(0, Math.min(1439, exactMin));

      let bestIdx = 0, nowFloatIdx = 0;
      for (let i = 0; i < INTRA_SLOTS.length - 1; i++) {
        const m0 = INTRA_SLOTS[i].minFrom08, m1 = INTRA_SLOTS[i + 1].minFrom08;
        if (exactMin >= m0 && exactMin <= m1) {
          bestIdx = i;
          nowFloatIdx = i + (exactMin - m0) / Math.max(1, m1 - m0);
          break;
        }
      }

      // 计算距离 22:30 BJT 美股正盘开盘 (minFrom08 = 870) 的状态
      const openMin = 870; // 22:30 BJT
      const closeMin = 1260; // 05:00 BJT
      let countdownText = "🔥 美股正盘交易进行中";
      if (exactMin < openMin) {
        const diffSec = Math.max(0, Math.floor((openMin - exactMin) * 60));
        const dh = Math.floor(diffSec / 3600);
        const dm = Math.floor((diffSec % 3600) / 60);
        const ds = diffSec % 60;
        const sessionTag = exactMin < 480 ? "亚洲夜盘交易中" : "欧美盘前交易中";
        countdownText = `${sessionTag} · 距22:30正盘 ${dh}h ${dm}m ${ds}s`;
      } else if (exactMin >= closeMin) {
        countdownText = "🌙 美股盘后交易时段 (05:00-08:00)";

      return { bjtStr, estStr, bjtHM, estHM, nowIdx: bestIdx, nowFloatIdx, exactMin, countdownText };

        ${showLock ? `

          <circle cx="${xOf("11/26")}" cy="${y1Of(sysTrack.p1126)}" r="5.5" fill="#1E40AF" stroke="#FFF" stroke-width="1.5"/>

    function computeIntraday(m, timeInfo) {
      const { cfg, curP, sysTrack, is3x, lockedHigh, isShortFrozen, curVwap } = m;
      const nowIdx = timeInfo.nowIdx;
      const nowFloatIdx = timeInfo.nowFloatIdx;
      const openIdx = 7;  // 22:30 BJT 正盘开盘
      const closeIdx = 14; // 05:00 BJT 正盘收盘

      let vwap = curVwap;
      const isBlowOffTop = !cfg.isInverse && !isShortFrozen && (lockedHigh >= cfg.theoToday * 0.95);

      let majorSupLow, majorSupHigh, demandLow, demandHigh, microRes, stopHuntExtreme;
      if (isBlowOffTop) {
        majorSupHigh = Math.max(lockedHigh, cfg.regClose, cfg.theoToday, curP * (is3x ? 1.015 : 1.005));
        majorSupLow = Math.min(cfg.regClose, cfg.theoToday, majorSupHigh * (is3x ? 0.965 : 0.990));
        microRes = curP >= majorSupLow ? Math.min(majorSupHigh, curP * 1.012) : curP + (majorSupLow - curP) * 0.65;
        const rawTargetLow = Math.min(cfg.intraLow, sysTrack.p1118, vwap * (is3x ? 0.925 : 0.982));
        const rawTargetHigh = Math.min(vwap * (is3x ? 0.960 : 0.990), Math.max(rawTargetLow * (is3x ? 1.032 : 1.006), cfg.intraLow));
        demandLow = rawTargetLow;
        demandHigh = Math.max(rawTargetLow + (is3x ? 0.8 : 1.5), rawTargetHigh);
        stopHuntExtreme = Math.min(sysTrack.p1118, demandLow * (is3x ? 0.975 : 0.992));
      } else if (cfg.isInverse) {
        majorSupLow = Math.max(cfg.regClose * 1.05, curP * 1.06);
        majorSupHigh = Math.max(cfg.regClose * 1.12, curP * 1.12);
        demandLow = Math.min(cfg.intraLow, curP * 0.975);
        demandHigh = Math.min(vwap * 0.990, curP * 0.992);
        microRes = Math.max(vwap, curP * 1.015);
        stopHuntExtreme = demandLow * 0.975;
      } else {
        majorSupLow = Math.max(curP * 1.035, vwap * 1.025);
        majorSupHigh = Math.max(curP * 1.065, vwap * 1.045);
        demandLow = Math.min(curP * 0.975, vwap * 0.980);
        demandHigh = Math.min(curP * 0.988, vwap * 0.990);
        microRes = curP * 1.015;
        stopHuntExtreme = demandLow * 0.985;
      }

      const baseMorning = [...cfg.lockedMorningPts];
      const pastPts = [];
      for (let i = 0; i <= Math.floor(nowFloatIdx); i++) {
        if (Math.abs(nowFloatIdx - i) < 0.03) break;
        const fallbackVal = i < baseMorning.length ? baseMorning[i] : parseFloat((baseMorning[baseMorning.length - 1] * 0.4 + curP * 0.6).toFixed(2));
        pastPts.push([i, fallbackVal]);
      }
      pastPts.push([nowFloatIdx, curP]);

      // ✨ 修复 Bug 3 & 4：覆盖全天 24H (idx 1 ~ 16) 的完整推演模板，并与 idx 8 (23:15), idx 10 (01:00), idx 13 (04:00) 精准对齐
      const pathA = [[nowFloatIdx, curP]], pathB = [[nowFloatIdx, curP]], pathC = [[nowFloatIdx, curP]];
      const tmplA = isBlowOffTop
        ? [
            [2, curP * 0.992], [3, (curP + vwap) * 0.5], [4, vwap * 1.005], [5, vwap * 1.010],
            [6, (curP + vwap) * 0.5], [7, curP * 0.995], [8, microRes], [9, vwap * 1.002],
            [10, vwap * (is3x ? 0.982 : 0.995)], [11, (vwap + demandHigh) * 0.5], [12, demandHigh * 1.005],
            [13, (demandLow + demandHigh) * 0.5], [14, demandHigh * 0.998], [15, demandLow * 1.002], [16, demandLow]
          ]
        : [
            [2, curP * 0.995], [3, curP * 1.002], [4, (curP + vwap) * 0.5], [5, vwap * 0.998],
            [6, vwap * 1.002], [7, demandHigh * 0.998], [8, (demandLow + demandHigh) * 0.5], [9, vwap * 1.002],
            [10, vwap * 1.022], [11, (vwap + majorSupLow) * 0.5], [12, majorSupLow * 0.998],
            [13, (majorSupLow + majorSupHigh) * 0.5], [14, majorSupLow * 1.005], [15, majorSupLow], [16, majorSupLow * 1.002]
          ];
      const tmplB = isBlowOffTop
        ? [
            [2, curP * 1.004], [3, curP * 1.008], [4, microRes * 0.996], [5, microRes],
            [6, majorSupLow * 0.998], [7, majorSupLow], [8, majorSupHigh * 0.985], [9, majorSupLow * 0.995],
            [10, curP * 0.995], [11, vwap * 1.012], [12, vwap * 1.005], [13, vwap * 1.002],
            [14, vwap * 1.004], [15, vwap], [16, vwap * 0.998]
          ]
        : [
            [2, curP * 1.005], [3, vwap * 1.005], [4, vwap * 1.012], [5, vwap * 1.018],
            [6, vwap * 1.022], [7, vwap * 1.015], [8, vwap * 1.028], [9, majorSupLow * 0.995],
            [10, majorSupLow * 1.008], [11, majorSupHigh * 0.995], [12, majorSupHigh * 1.008],
            [13, majorSupHigh * 1.018], [14, majorSupHigh * 1.012], [15, majorSupHigh * 1.015], [16, majorSupHigh * 1.020]
          ];
      const tmplC = isBlowOffTop
        ? [
            [2, curP * 0.982], [3, vwap * 0.995], [4, vwap * 0.982], [5, (vwap + demandHigh) * 0.5],
            [6, demandHigh * 1.01], [7, demandHigh * 0.998], [8, demandLow * 0.998], [9, (demandLow + stopHuntExtreme) * 0.5],
            [10, stopHuntExtreme * 1.008], [11, stopHuntExtreme], [12, stopHuntExtreme * 0.995],
            [13, demandLow * 0.996], [14, demandLow * 1.002], [15, demandLow], [16, demandLow * 0.998]
          ]
        : [
            [2, curP * 0.990], [3, demandHigh * 0.998], [4, demandLow * 0.998], [5, demandLow * 0.992],
            [6, demandLow * 0.995], [7, demandLow * 0.990], [8, stopHuntExtreme], [9, demandLow * 1.002],
            [10, vwap * 0.998], [11, vwap * 1.005], [12, vwap * 1.012], [13, vwap * 1.018],
            [14, vwap * 1.015], [15, vwap * 1.012], [16, vwap * 1.015]
          ];

      pathA.push(...tmplA.filter(d => d[0] > nowFloatIdx + 0.08));
      pathB.push(...tmplB.filter(d => d[0] > nowFloatIdx + 0.08));
      pathC.push(...tmplC.filter(d => d[0] > nowFloatIdx + 0.08));

      return { nowIdx, nowFloatIdx, bjtHM: timeInfo.bjtHM, estHM: timeInfo.estHM, openIdx, closeIdx, isBlowOffTop, isShortFrozen, vwap, demandLow, demandHigh, microRes, majorSupLow, majorSupHigh, stopHuntExtreme, baseMorningPeak: cfg.preHigh || baseMorning[1], pastPts, pathA, pathB, pathC };
    }

    function buildIntraSvg(intra, m) {
      const W = 1000, H = 350, PAD_L = 64, PAD_R = 28, PAD_T = 28, PAD_B = 38;
      const plotW = W - PAD_L - PAD_R;
      const xOf = (idx) => PAD_L + (idx / (INTRA_SLOTS.length - 1)) * plotW;

      const allVals = [
        ...intra.pastPts.map(d => d[1]), ...intra.pathA.map(d => d[1]),
        ...intra.pathB.map(d => d[1]), ...intra.pathC.map(d => d[1]),
        intra.majorSupHigh, intra.demandLow, intra.stopHuntExtreme
      ];
      const minY = Math.min(...allVals) * 0.990;
      const maxY = Math.max(...allVals) * 1.010;
      const yOf = (val) => PAD_T + (1 - (val - minY) / (maxY - minY)) * (H - PAD_T - PAD_B);

      let grid = "";
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const py = PAD_T + r * (H - PAD_T - PAD_B);
        const pVal = maxY - r * (maxY - minY);
        grid += `<line x1="${PAD_L}" y1="${py}" x2="${W-PAD_R}" y2="${py}" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>
                 <text x="${PAD_L-8}" y="${py+4}" text-anchor="end" font-size="11" fill="#475569" class="font-mono font-semibold">$${pVal.toFixed(2)}</text>`;
      });

      const activePath = state.intraScenario === "A" ? intra.pathA : (state.intraScenario === "B" ? intra.pathB : intra.pathC);
      // ✨ 修复 Bug 4：气泡索引严格对齐 idx 8 (23:15)、idx 10 (01:00) 与 idx 13 (04:00)
      const bubbles = (intra.isBlowOffTop ? [
        { idx: 8,  label: "23:15 开盘反抽", color: "#FDA4AF", dy: -20 },
        { idx: 10, label: "01:00 跌破VWAP", color: "#FBBF24", dy: -20 },
        { idx: 13, label: "04:00 回归支撑", color: "#34D399", dy: 24 }
      ] : [
        { idx: 8,  label: "23:15 开盘右脚", color: "#34D399", dy: 24 },
        { idx: 10, label: "01:00 攻克VWAP", color: "#FBBF24", dy: -20 },
        { idx: 13, label: "04:00 尾盘目标", color: "#38BDF8", dy: -20 }
      ]).map(pt => {
        const item = activePath.find(d => d[0] === pt.idx);
        if (!item) return "";
        const cx = xOf(pt.idx), cy = yOf(item[1]);
        return `<circle cx="${cx}" cy="${cy}" r="5" fill="${pt.color}" stroke="#0F172A" stroke-width="1.5"/>
                <g transform="translate(${cx}, ${cy + pt.dy})">
                  <rect x="-78" y="-12" width="156" height="20" rx="5" fill="#0F172A" stroke="${pt.color}" stroke-width="1" opacity="0.92"/>
                  <text x="0" y="2" text-anchor="middle" font-size="10.5" font-weight="bold" fill="${pt.color}" class="font-mono">${pt.label}: $${item[1].toFixed(2)}</text>
                </g>`;
      }).join("");

      return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto select-none">
        <rect x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${H-PAD_T-PAD_B}" fill="#0F172A" rx="8"/>
        <!-- 16:00 盘前区与 22:30 正盘区背景分层 -->
        <rect x="${xOf(3)}" y="${PAD_T}" width="${xOf(intra.openIdx)-xOf(3)}" height="${H-PAD_T-PAD_B}" fill="#1E293B" opacity="0.38"/>
        <text x="${xOf(3)+8}" y="${PAD_T+18}" font-size="10" font-weight="bold" fill="#64748B" class="font-mono">🌍 16:00 欧美盘前区</text>
        <rect x="${xOf(intra.openIdx)}" y="${PAD_T}" width="${xOf(intra.closeIdx)-xOf(intra.openIdx)}" height="${H-PAD_T-PAD_B}" fill="#1E293B" opacity="0.80"/>
        <text x="${xOf(intra.openIdx)+10}" y="${PAD_T+18}" font-size="11" font-weight="bold" fill="#94A3B8" class="font-mono">🇺🇸 22:30 ~ 05:00 美股正盘决战区</text>
        ${grid}
        <rect x="${PAD_L}" y="${yOf(intra.majorSupHigh)}" width="${plotW}" height="${Math.max(4, yOf(intra.majorSupLow)-yOf(intra.majorSupHigh))}" fill="#F43F5E" opacity="0.24"/>
        <text x="${PAD_L+10}" y="${yOf(intra.majorSupHigh)+14}" font-size="10.5" font-weight="bold" fill="#FDA4AF" class="font-mono">🔴 ${intra.isBlowOffTop ? "周期理论天花板与隔夜极值派发带" : "日内目标阻力带"}: $${intra.majorSupLow.toFixed(2)} ~ $${intra.majorSupHigh.toFixed(2)}</text>
        <rect x="${PAD_L}" y="${yOf(intra.demandHigh)}" width="${plotW}" height="${Math.max(4, yOf(intra.demandLow)-yOf(intra.demandHigh))}" fill="#10B981" opacity="0.25"/>
        <text x="${PAD_L+10}" y="${yOf(intra.demandHigh)-6}" font-size="10.5" font-weight="bold" fill="#6EE7B7" class="font-mono">🟢 ${intra.isBlowOffTop ? "昨日低点颈线与11/18中继承接带" : "分时低吸需求承接区"}: $${intra.demandLow.toFixed(2)} ~ $${intra.demandHigh.toFixed(2)}</text>
        <line x1="${PAD_L}" y1="${yOf(intra.vwap)}" x2="${W-PAD_R}" y2="${yOf(intra.vwap)}" stroke="#FBBF24" stroke-dasharray="6 4" stroke-width="1.6"/>
        <text x="${PAD_L+10}" y="${yOf(intra.vwap)-6}" font-size="10.5" font-weight="bold" fill="#FBBF24" class="font-mono">🟡 日内多空分水岭均价线 (Locked VWAP): $${intra.vwap.toFixed(2)}</text>
        <line x1="${xOf(intra.nowFloatIdx)}" y1="${PAD_T}" x2="${xOf(intra.nowFloatIdx)}" y2="${H-PAD_B}" stroke="#EF4444" stroke-dasharray="5 3" stroke-width="1.8"/>
        <line x1="${xOf(intra.openIdx)}" y1="${PAD_T}" x2="${xOf(intra.openIdx)}" y2="${H-PAD_B}" stroke="#6366F1" stroke-dasharray="4 4" stroke-width="1.5"/>
        <polyline fill="none" stroke="#10B981" stroke-width="${state.intraScenario==='B'?'3.2':'1.3'}" stroke-dasharray="4 4" opacity="${state.intraScenario==='B'?'1':'0.38'}" points="${intra.pathB.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#F97316" stroke-width="${state.intraScenario==='C'?'3.2':'1.3'}" stroke-dasharray="4 4" opacity="${state.intraScenario==='C'?'1':'0.38'}" points="${intra.pathC.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#38BDF8" stroke-width="${state.intraScenario==='A'?'3.4':'1.5'}" stroke-dasharray="7 4" opacity="${state.intraScenario==='A'?'1':'0.42'}" points="${intra.pathA.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <polyline fill="none" stroke="#F8FAFC" stroke-width="2.8" points="${intra.pastPts.map(d=>`${xOf(d[0])},${yOf(d[1])}`).join(" ")}"/>
        <circle cx="${xOf(intra.nowFloatIdx)}" cy="${yOf(m.curP)}" r="6" fill="#EF4444" stroke="#FEF2F2" stroke-width="2"/>
        <g transform="translate(${Math.min(W-105, Math.max(145, xOf(intra.nowFloatIdx)))}, ${yOf(m.curP)+24})">
          <rect x="-78" y="-12" width="156" height="20" rx="5" fill="#0F172A" stroke="#EF4444" stroke-width="1.4" opacity="0.96"/>
          <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#FCA5A5" class="font-mono">NOW(${intra.bjtHM}): $${m.curP.toFixed(2)}</text>
        </g>
        ${bubbles}
        ${INTRA_SLOTS.map((s, idx) => {
          const isNearNow = Math.abs(idx - intra.nowFloatIdx) < 0.35;
          return `
          <text x="${xOf(idx)}" y="${H-16}" text-anchor="middle" font-size="10" font-weight="${idx===intra.openIdx?'bold':'normal'}" fill="${idx===intra.openIdx?'#818CF8':'#94A3B8'}" opacity="${isNearNow?'0.25':'1'}" class="font-mono">${s.bjt}</text>
          <text x="${xOf(idx)}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#475569" opacity="${isNearNow?'0.25':'1'}" class="font-mono">${s.est}E</text>
          `;
        }).join("")}
        <g transform="translate(${xOf(intra.nowFloatIdx)}, ${H-16})">
          <rect x="-38" y="-11" width="76" height="24" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
          <text x="0" y="0" text-anchor="middle" font-size="10" font-weight="bold" fill="#F87171" class="font-mono">▲${intra.bjtHM}</text>
          <text x="0" y="10" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FCA5A5" class="font-mono">${intra.estHM}E</text>
        </g>
      </svg>`;
    }

    // ✨ 修复 Bug 2：采用局部无损 DOM 更新架构 (updateDynamicSections)，滑块永远不会被销毁重建，支持 60FPS 丝滑拖动！
    function updateDynamicSections() {
      if (!state.isAuthed) return;
      const timeInfo = getRealTimeSlotInfo();
      const m = computeAll();

                <div class="text-emerald-700 font-extrabold text-sm mt-1">系统逻辑轨 $${sysTrack.p1210.toFixed(2)} | ${is3x?'磨损轨':'母版轨'} $${lockedTrack.p1210.toFixed(2)}</div>
                <div class="text-[11px] text-emerald-800 mt-1">${cfg.isInverse ? '⚠️ 正股跨年主升期，严禁持有多单过节' : '🚀 圣诞跨年主升浪波峰兑现区'}</div>
              </div>
            </div>

            <div class="w-full overflow-x-auto">${buildMacroSvg(m)}</div>
          `;
        } else {
          elMacro.style.display = "none";
        }
      }
    }

    // 完整骨架渲染 (仅在登录、切换标的、切换Clean模式时调用一次，保护滑块DOM不丢失焦点)
    function renderFullShell() {
      const root = document.getElementById("app");
      if (!state.isAuthed) {
        root.innerHTML = `
          <div class="min-h-[85vh] flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 text-white">
              <div class="text-center space-y-2">
                <div class="text-3xl">🛡️</div>
                <h1 class="text-xl font-bold">【周期系统逻辑理论 V3.9 · 实时推演终端】</h1>
                <p class="text-xs text-slate-400 font-mono">VIP 内部量化监控终端 · 请输入访问口令解锁</p>
              </div>
              <form id="loginForm" class="space-y-4">
                <input id="pinInput" type="password" placeholder="请输入访问密码..." autofocus class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white text-center font-mono text-lg tracking-widest focus:outline-none"/>
                ${state.pinError ? `<p class="text-xs text-rose-400 text-center font-mono">❌ 访问口令错误，请重试</p>` : ""}
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">🔓 验证并进入实时终端</button>
              </form>
            </div>
          </div>`;
        const form = document.getElementById("loginForm");
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById("pinInput").value.trim();
            if (val === ACCESS_PIN) {
              try { localStorage.setItem(AUTH_KEY, ACCESS_PIN); } catch (err) {}
              state.isAuthed = true; state.pinError = false; renderFullShell();
            } else {
              state.pinError = true; renderFullShell();
            }
          };
        }
        return;
      }

      const cfg = RAW_DB[state.ticker];
      const curP = state.prices[state.ticker] || cfg.regClose;

      root.innerHTML = `
        <header class="flex flex-wrap justify-between items-center bg-white px-4 md:px-6 py-3.5 rounded-2xl shadow-sm border border-slate-200 gap-3">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <button id="liveBtn" onclick="toggleLive()"></button>
              <span id="clockBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-slate-900 text-amber-300"></span>
              <span id="countdownBadge" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
              <h1 id="headerTitle" class="text-base md:text-lg font-bold text-slate-900"></h1>
            </div>
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <button onclick="setView('both')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='both'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">⚡ 日内+宏观双擎同屏</button>
              <button onclick="setView('intraday')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='intraday'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📈 仅看日内24H四步推演</button>
              <button onclick="setView('macro')" class="px-2.5 py-1 text-xs font-bold rounded-lg ${state.viewMode==='macro'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">📅 仅看周期系统逻辑跨月推演图</button>
              <button onclick="toggleClean()" class="px-2.5 py-1 text-xs font-bold rounded-lg border ${state.cleanShot?'bg-rose-600 text-white border-rose-700':'bg-slate-50 text-slate-700 border-slate-300'}">${state.cleanShot?'📸 退出群聊截图模式':'📸 群聊截图模式'}</button>
              <button onclick="logout()" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-500">🔒 锁定</button>
            </div>
          </div>
          <div id="tickerButtons" class="flex items-center gap-1.5 flex-wrap"></div>
        </header>

        <div id="gammaBanner"></div>
        <div id="barrierBanner" class="grid grid-cols-1 md:grid-cols-2 gap-3 font-mono text-xs"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          ${!state.cleanShot ? `
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span id="sliderStatusLabel" class="text-sm font-bold text-slate-800"></span>
                  <span id="sliderPriceVal" class="text-lg font-mono font-bold text-indigo-600"></span>
                </div>
                <input id="priceSlider" type="range" min="${cfg.minP}" max="${cfg.maxP}" step="${cfg.step}" value="${curP}" class="w-full accent-indigo-600 cursor-pointer"/>
                <div class="flex justify-between text-[11px] text-slate-400 font-mono mt-1 mb-3">
                  <span>$${cfg.minP.toFixed(1)}</span>
                  <button onclick="toggleLive(true)" class="text-emerald-600 font-bold underline">点此恢复公网实时自动同步</button>
                  <span>$${cfg.maxP.toFixed(1)}</span>
                </div>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-1.5">
                ${cfg.presets.map((p, idx) => `
                  <button onclick="applyPreset(${idx})" class="p-2 text-[11px] rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 font-mono font-semibold text-slate-700 text-left truncate">${p.label}</button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div id="diagPanel" class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 ${state.cleanShot?'lg:col-span-12':'lg:col-span-7'}"></div>
        </div>

        <div id="intraSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-indigo-500/30 space-y-4"></div>
        <div id="macroSection" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border-2 border-blue-500/30 space-y-4"></div>
      `;

      const slider = document.getElementById("priceSlider");
      if (slider) {
        slider.addEventListener("input", (e) => {
          state.isLive = false;
          state.prices[state.ticker] = parseFloat(e.target.value);
          updateDynamicSections();
        });
      }

      updateDynamicSections();
    }

    window.toggleLive = (forceTrue) => {
      state.isLive = forceTrue ? true : !state.isLive;
      state.customBaseTheo = null;
      state.anchorDt = "11/12";
      updateDynamicSections();
    };
    window.setView = (v) => { state.viewMode = v; renderFullShell(); };
    window.setEngine = (e) => { state.cycleEngine = e; updateDynamicSections(); };
    window.setIntra = (s) => { state.intraScenario = s; updateDynamicSections(); };
    window.toggleClean = () => { state.cleanShot = !state.cleanShot; renderFullShell(); };
    window.logout = () => { try { localStorage.removeItem(AUTH_KEY); } catch(e){} state.isAuthed = false; renderFullShell(); };
    window.selectTicker = (sym) => { state.ticker = sym; state.customBaseTheo = null; state.anchorDt = "11/12"; renderFullShell(); };
    window.applyPreset = (idx) => {
      const p = RAW_DB[state.ticker].presets[idx];
      if (!p) return;
      state.isLive = false;
      state.prices[state.ticker] = p.val;
      state.customBaseTheo = p.baseTheo;
      state.anchorDt = p.anchorDt || "11/12";
      const slider = document.getElementById("priceSlider");
      if (slider) slider.value = p.val;
      updateDynamicSections();
    };
    window.copyReport = () => {
      const m = computeAll();
      const text = `📊 **【${state.ticker} 周期系统逻辑理论 V3.9 全天候实盘战报】**\n` +
        `● **伽马脉冲雷达**: ${m.gammaStatus.badge}\n` +
        `● **负乖离红线状态**: ${m.isShortFrozen ? '🚨 负乖离未收敛（做空熔断中）' : '🟢 负乖离已归零（允许右侧对冲）'}\n` +
        `● **阶段定性**: ${m.phaseTitle}\n` +
        `● **现价锚点 (${state.anchorDt})**: $${m.curP.toFixed(2)} | 今日理论位 $${m.activeTheoNow.toFixed(2)} (实时乖离 ${m.spreadPct.toFixed(1)}%)\n` +
        `● **💎 [周期系统逻辑轨]**: 11/18中继 $${m.sysTrack.p1118.toFixed(2)} ➔ **11/26节点 $${m.sysTrack.p1126.toFixed(2)}** ➔ 12/10节点 $${m.sysTrack.p1210.toFixed(2)}\n` +
        `● **🛡️ [基准锁锚对照轨]**: 11/18中继 $${m.lockedTrack.p1118.toFixed(2)} ➔ **11/26节点 $${m.lockedTrack.p1126.toFixed(2)}** ➔ 12/10节点 $${m.lockedTrack.p1210.toFixed(2)}`;
      navigator.clipboard.writeText(text);
      state.copied = true; updateDynamicSections();
      setTimeout(() => { state.copied = false; updateDynamicSections(); }, 2000);
    };

    // ✨ 修复 Bug 7：双代理容灾 + 优先提取盘前/盘后/夜盘最新K线价格
    async function syncQuotes() {
      if (!state.isAuthed || !state.isLive) return;
      try {
        await Promise.all(TICKER_ORDER.map(async (sym) => {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d&includePrePost=true`;
          const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
          ];
          for (const pUrl of proxies) {
            try {
              const r = await fetch(pUrl);
              if (!r.ok) continue;
              const j = await r.json();
              const res0 = j?.chart?.result?.[0];
              const meta = res0?.meta;
              const q = res0?.indicators?.quote?.[0];
              if (meta) {
                let latest = meta.postMarketPrice || meta.preMarketPrice || meta.regularMarketPrice;
                let maxH = RAW_DB[sym].intraHigh, minL = RAW_DB[sym].intraLow, sumPV = 0, sumV = 0;
                if (q && Array.isArray(q.close)) {
                  for (let k = 0; k < q.close.length; k++) {
                    const c = q.close[k], h = q.high?.[k], l = q.low?.[k], v = q.volume?.[k] || 0;
                    if (c !== null && c > 0) {
                      latest = c;
                      if (h && h > maxH) maxH = h;
                      if (l && l < minL) minL = l;
                      if (v > 0) { sumPV += c * v; sumV += v; }
                    }
                  }
                }
                if (latest && latest > 0) {
                  state.prices[sym] = parseFloat(latest.toFixed(2));
                  if (sym === state.ticker) {
                    const slider = document.getElementById("priceSlider");
                    if (slider) slider.value = state.prices[sym];
                  }
                }
                state.realIntraStats[sym] = {
                  high: parseFloat(maxH.toFixed(2)),
                  low: parseFloat(minL.toFixed(2)),
                  vwap: sumV > 0 ? parseFloat((sumPV / sumV).toFixed(2)) : RAW_DB[sym].fixedVwap
                };
                break;
              }
            } catch (innerE) {}
          }
        }));
        state.liveStatus = `云端公网实时 (${getRealTimeSlotInfo().bjtStr})`;
        updateDynamicSections();
      } catch (e) {}
    }

    renderFullShell();
    setInterval(() => { if (state.isAuthed) updateDynamicSections(); }, 1000);
    setInterval(syncQuotes, 8000);
    syncQuotes();
  </script>
</body>
</html>
